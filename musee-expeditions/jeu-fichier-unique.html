<style>
/* Musée & Expéditions — identité : aventure scientifique, BD franco-belge, carnet d'exploration */
:root {
  --paper: #f3e9d2;
  --paper2: #fbf5e6;
  --card: #fffaf0;
  --ink: #2b2118;
  --ink2: #5a4a3a;
  --red: #b23a2a;
  --ochre: #d39b2a;
  --teal: #2f6f73;
  --blue: #3f5a92;
  --green: #5f7f2a;
  --shadow: 3px 3px 0 var(--ink);
  --r: 8px;
  --title: 'Alegreya SC', Georgia, 'Times New Roman', serif;
  --body: 'Alegreya', Georgia, 'Times New Roman', serif;
  --hand: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Neue', cursive;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: radial-gradient(rgba(43,33,24,.05) 1px, transparent 1px);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  min-height: 100vh;
  padding-top: var(--safe-top);
}
h1, h2, h3, h4 { font-family: var(--title); margin: 0 0 .4em; line-height: 1.15; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; }
p { margin: .3em 0 .6em; }
small, .muted { color: var(--ink2); }
button { font: inherit; color: inherit; }
a { color: var(--blue); }

/* ---------- En-tête ---------- */
#topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--ink); color: var(--paper);
  border-bottom: 3px solid var(--ochre);
}
.brand { display: flex; align-items: center; gap: 8px; }
.logo { width: 40px; height: 40px; flex: none; border-radius: 9px; }
.brand-title { font-family: var(--title); font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
.brand-sub { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ochre); }
.stats { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.stat { background: rgba(255,250,240,.08); border: 1px solid rgba(255,250,240,.2); border-radius: 20px; padding: 3px 10px; font-size: .9rem; white-space: nowrap; }
.stat b { color: #fff; }
.stat.neg b { color: #ff9a8a; }
.top-actions { display: flex; gap: 6px; }
.short { display: none; }

/* ---------- Navigation ---------- */
#tabs {
  position: sticky; top: var(--tb, 58px); z-index: 25;
  display: flex; gap: 4px; padding: 6px 10px; overflow-x: auto;
  background: var(--paper2); border-bottom: 2px solid var(--ink);
  scrollbar-width: none;
}
#tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  border: 2px solid transparent; background: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 600;
}
.tab .ico { font-size: 1.05rem; }
.tab:hover { border-color: var(--ink); }
.tab.active { background: var(--ink); color: var(--paper); }
.tab .badge { background: var(--red); color: #fff; border-radius: 10px; font-size: .72rem; padding: 0 6px; }

#view { max-width: 1240px; margin: 0 auto; padding: 16px 14px 90px; outline: none; }

/* ---------- Composants ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 2px solid var(--ink); background: var(--card); padding: 7px 14px; border-radius: var(--r);
  cursor: pointer; font-weight: 700; box-shadow: 2px 2px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  min-height: 40px; text-align: center;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--ink); }
.btn.primary { background: var(--red); color: #fff; }
.btn.gold { background: var(--ochre); }
.btn.teal { background: var(--teal); color: #fff; }
.btn.small { padding: 4px 10px; min-height: 32px; font-size: .9rem; }
.btn.ghost { background: transparent; color: inherit; border-color: rgba(255,250,240,.5); box-shadow: none; }
#topbar .btn.primary { border-color: var(--paper); box-shadow: 2px 2px 0 var(--ochre); }
.btn.icon { width: 40px; padding: 0; font-size: 1.2rem; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.panel {
  background: var(--card); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 16px;
}
.panel.paper { background: var(--paper2); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 12px; font-size: .78rem; font-weight: 700; border: 1.5px solid var(--ink); background: var(--paper2); white-space: nowrap; }
.chip.c { color: #fff; border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { cursor: pointer; padding: 4px 12px; font-size: .88rem; }
.filter.on { background: var(--ink); color: var(--paper); }

.bar { height: 8px; background: rgba(43,33,24,.12); border-radius: 4px; overflow: hidden; border: 1px solid rgba(43,33,24,.3); }
.bar > i { display: block; height: 100%; background: var(--teal); }
.bar.cond > i { background: linear-gradient(90deg, #b23a2a, #d39b2a 45%, #5f7f2a 80%); background-size: 100px 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: .95rem; }
.kv dt { color: var(--ink2); }
.kv dd { margin: 0; font-weight: 600; }

/* ---------- Musée ---------- */
.museum-wrap { position: relative; border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: #cfe0dc; }
.museum-wrap canvas { display: block; width: 100%; }
.hint { font-family: var(--hand); font-size: 1.05rem; color: var(--ink2); }
.room-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.room-card { cursor: pointer; text-align: left; background: var(--card); border: 2px solid var(--ink); border-radius: var(--r); padding: 10px; box-shadow: 2px 2px 0 var(--ink); }
.room-card:hover { background: #fff; }
.room-card.locked { opacity: .7; background: repeating-linear-gradient(45deg, #efe2c2, #efe2c2 10px, #e6d4ab 10px, #e6d4ab 20px); }
.mini-objs { display: flex; gap: 2px; margin-top: 6px; }
.mini-objs .slot { width: 34px; height: 34px; border: 1.5px dashed rgba(43,33,24,.4); border-radius: 4px; display: grid; place-items: center; background: var(--paper2); }
.mini-objs .slot svg { width: 30px; height: 30px; }

.reasons li { list-style: none; margin: 2px 0; }
.reasons { padding: 0; margin: 0; }
.plus { color: var(--green); font-weight: 700; }
.minus { color: var(--red); font-weight: 700; }
.objective { border-left: 4px solid var(--ochre); padding: 4px 10px; margin: 6px 0; background: var(--paper2); }
.objective.done { border-color: var(--green); opacity: .6; }

/* ---------- Objets ---------- */
.obj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.obj-card {
  background: var(--card); border: 2px solid var(--ink); border-radius: var(--r); padding: 8px; cursor: pointer; text-align: left;
  box-shadow: 2px 2px 0 var(--ink); display: flex; flex-direction: column; gap: 4px; position: relative;
}
.obj-card:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.obj-card .pic { background: radial-gradient(circle at 50% 40%, #fffdf6, #efe2c2); border-radius: 6px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid rgba(43,33,24,.2); }
.obj-card .pic svg { width: 88%; height: 88%; }
.obj-card .name { font-weight: 700; font-size: .95rem; line-height: 1.15; }
.obj-card .id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; color: var(--ink2); }
.obj-card .unrevealed { filter: sepia(1) brightness(.55) blur(1.5px); }
.rar { position: absolute; top: 12px; right: 12px; }
.loc { font-size: .75rem; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-height: 50vh; overflow: auto; padding: 4px; }
.pick-list .obj-card { padding: 6px; }
.pick-list .obj-card.disabled { opacity: .45; }

/* ---------- Fiche objet ---------- */
.fiche { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: 18px; }
@media (max-width: 720px) { .fiche { grid-template-columns: 1fr; } }
.fiche .plate { background: radial-gradient(circle at 50% 35%, #fffdf6 0, #efe2c2 70%); border: 2px solid var(--ink); border-radius: var(--r); padding: 12px; aspect-ratio: 1; display: grid; place-items: center; position: relative; }
.fiche .plate svg { width: 100%; height: 100%; }
.fiche .plate .tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1.5px solid var(--ink); padding: 2px 10px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; border-radius: 3px; }
.histo p { margin: .3em 0; }
.histo .locked { color: var(--ink2); font-style: italic; filter: blur(.4px); }
.carnet {
  font-family: var(--hand); font-size: 1.08rem; line-height: 1.5;
  background: #fbf3dc repeating-linear-gradient(transparent, transparent 25px, rgba(63,90,146,.18) 26px);
  border: 2px solid var(--ink); border-radius: 4px; padding: 10px 14px 10px 30px; position: relative;
}
.carnet::before { content: ''; position: absolute; left: 18px; top: 0; bottom: 0; border-left: 2px solid rgba(178,58,42,.45); }
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { position: relative; padding: 0 0 8px 22px; }
.timeline li::before { content: ''; position: absolute; left: 5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ochre); border: 2px solid var(--ink); }
.timeline li::after { content: ''; position: absolute; left: 10px; top: 18px; bottom: 0; border-left: 2px dotted var(--ink2); }
.timeline li:last-child::after { display: none; }
.timeline .w { font-size: .78rem; color: var(--ink2); font-weight: 700; }

/* ---------- Carte & expéditions ---------- */
.map-box { border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: #bcd7d0; }
.map-svg { display: block; width: 100%; height: auto; }
.pin { cursor: pointer; transition: transform .15s; }
.pin:hover, .pin.sel { filter: drop-shadow(0 0 4px #fffaf0); }
.pin.locked { cursor: not-allowed; }
.scene { border: 3px solid var(--ink); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); max-width: 980px; }
.obj-card .pic.unrevealed svg { filter: brightness(.25) sepia(1); }
.scene canvas { display: block; width: 100%; }
.gauge { display: flex; align-items: center; gap: 8px; }
.gauge .bar { flex: 1; }
.team-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.staff-card { border: 2px solid var(--ink); border-radius: var(--r); padding: 8px; background: var(--card); display: flex; gap: 8px; align-items: flex-start; cursor: pointer; text-align: left; }
.staff-card.on { background: #fff4d6; box-shadow: inset 0 0 0 2px var(--ochre); }
.staff-card.busy { opacity: .5; cursor: not-allowed; }
.staff-card canvas { flex: none; }
.skills { display: grid; grid-template-columns: auto 1fr; gap: 0 6px; font-size: .78rem; align-items: center; }
.pips { letter-spacing: 1px; color: var(--ochre); font-size: .8rem; }
.pips i { color: rgba(43,33,24,.2); font-style: normal; }
.equip { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.equip label { border: 2px solid var(--ink); border-radius: var(--r); padding: 8px; display: flex; gap: 8px; background: var(--card); cursor: pointer; }
.equip label.req { background: #fff4d6; }
.forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.forecast div { background: var(--paper2); border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 8px; }
.forecast b { font-size: 1.15rem; display: block; }
.errors { color: var(--red); font-weight: 600; margin: 6px 0; padding-left: 18px; }
.ok-msg { color: var(--green); font-weight: 600; }

/* ---------- Atelier ---------- */
.bench { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; border: 2px solid var(--ink); border-radius: var(--r); padding: 10px; background: var(--card); margin-bottom: 8px; }
.bench.free { border-style: dashed; background: transparent; grid-template-columns: 1fr; text-align: center; color: var(--ink2); }
.bench .pic { width: 90px; height: 90px; background: var(--paper2); border-radius: 6px; border: 1px solid rgba(43,33,24,.3); }

/* ---------- Finances ---------- */
.chart svg { width: 100%; height: auto; display: block; }
table.ledger { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.ledger td, table.ledger th { padding: 4px 6px; border-bottom: 1px solid rgba(43,33,24,.15); text-align: left; }
table.ledger td.num, table.ledger th.num { text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--red); }
select, input[type=text], textarea { font: inherit; border: 2px solid var(--ink); border-radius: 6px; padding: 6px 8px; background: var(--card); color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: .75rem; }

/* ---------- Modales ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(43,33,24,.55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 20px 10px; overflow-y: auto; animation: fade .15s; }
.modal {
  background: var(--paper2); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 6px 6px 0 var(--ink);
  width: min(960px, 100%); padding: 18px; position: relative; animation: pop .18s ease-out; margin: auto 0;
}
.modal.narrow { width: min(560px, 100%); }
.modal .close { position: absolute; top: 10px; right: 10px; }
.modal h2 { padding-right: 46px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- Déballage au pinceau ---------- */
.reveal { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 18px; align-items: start; }
@media (max-width: 720px) { .reveal { grid-template-columns: 1fr; } }
.dig { position: relative; aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; background: radial-gradient(circle, #fffdf6, #e6d4ab); touch-action: none; user-select: none; }
.dig .obj { position: absolute; inset: 6%; }
.dig .obj svg { width: 100%; height: 100%; }
.dig canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; transition: opacity .6s; }
.dig.done canvas { opacity: 0; pointer-events: none; }
.dig .shine { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(255,236,170,.75), transparent 60%); }
.dig.done.rare .shine { animation: shine 1.6s ease-out; }
@keyframes shine { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
.reveal-info { opacity: .25; transition: opacity .5s; }
.reveal-info.on { opacity: 1; }
.big-title { font-family: var(--title); font-size: 1.7rem; }

/* ---------- Notifications ---------- */
#toasts { position: fixed; right: 12px; bottom: calc(14px + var(--safe-bottom)); z-index: 60; display: flex; flex-direction: column; gap: 6px; max-width: min(380px, calc(100% - 24px)); }
.toast { background: var(--card); border: 2px solid var(--ink); border-left: 8px solid var(--teal); border-radius: 6px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--ink); animation: pop .2s; font-size: .92rem; }
.toast.success { border-left-color: var(--green); }
.toast.warning { border-left-color: var(--ochre); }
.toast.danger, .toast.error { border-left-color: var(--red); }
.toast.story { border-left-color: var(--blue); }
.journal li { padding: 4px 0; border-bottom: 1px dotted rgba(43,33,24,.25); list-style: none; }
.journal { padding: 0; margin: 0; max-height: 60vh; overflow: auto; }
.journal .w { font-size: .78rem; color: var(--ink2); font-weight: 700; margin-right: 6px; }
.journal .success { color: #3d5a1a; } .journal .warning { color: #8a5a0a; } .journal .danger { color: var(--red); }

.empty { text-align: center; padding: 24px; color: var(--ink2); font-family: var(--hand); font-size: 1.15rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Téléphone ---------- */
@media (max-width: 720px) {
  body { font-size: 15px; }
  #topbar { padding: 6px 10px; gap: 6px; }
  .brand-title { font-size: 1.02rem; }
  .brand-sub { display: none; }
  .logo { width: 28px; height: 28px; }
  .short { display: inline; } .long { display: none; }
  #topbar .btn { min-height: 34px; }
  #topbar .btn.icon { width: 34px; font-size: 1rem; }
  .museum-wrap.two-d { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .museum-wrap.two-d canvas { width: 820px; max-width: none; }
  .gl-tools { gap: 4px; }
  .gl-tools button { width: 38px; height: 38px; }
  .scene canvas { width: 100%; }
  .stats { order: 3; flex-basis: 100%; justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .stat { font-size: .8rem; padding: 2px 8px; }
  .top-actions { margin-left: auto; }
  #topbar .btn.primary { padding: 6px 10px; font-size: .9rem; }
  #tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-top: 2px solid var(--ink); border-bottom: 0; padding: 4px 4px calc(4px + var(--safe-bottom)); background: var(--ink); }
  .tab { flex-direction: column; gap: 0; font-size: .68rem; padding: 4px 8px; color: var(--paper); border-radius: 8px; }
  .tab .ico { font-size: 1.2rem; }
  .tab.active { background: var(--ochre); color: var(--ink); }
  #view { padding: 12px 10px 100px; }
  #toasts { bottom: calc(76px + var(--safe-bottom)); }
  .modal { padding: 14px 12px; }
  h2 { font-size: 1.35rem; }
}

/* ---------- Vues 3D ---------- */
.gl-wrap { position: relative; overflow: hidden; background: #c7dcd9; user-select: none; -webkit-user-select: none; }
.gl-canvas { display: block; touch-action: none; cursor: grab; }
.gl-canvas:active { cursor: grabbing; }
.gl-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.gl-label { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.gl-label.room { background: var(--card); border: 2px solid var(--ink); border-radius: 5px; padding: 2px 8px; font: 700 13px/1.2 var(--body); box-shadow: 2px 2px 0 var(--ink); text-align: center; }
.gl-label.room small { display: block; font-weight: 600; font-size: 11px; }
.gl-label.room.locked { background: #fff4d6; }
.gl-label.sign { font: 700 12px var(--title); letter-spacing: .06em; background: var(--ink); color: var(--paper); padding: 2px 8px; border-radius: 3px; }
.gl-label.bubble { background: #fffaf0; border: 1.5px solid var(--ink); border-radius: 50%; width: 24px; height: 22px; display: grid; place-items: center; font: 700 13px Georgia, serif; }
.gl-label.bubble.love { color: var(--red); } .gl-label.bubble.wow { color: var(--ochre); } .gl-label.bubble.tired, .gl-label.bubble.hmm { color: var(--blue); font-size: 11px; }
.gl-label.hidden { display: none !important; }
.gl-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 2; }
.gl-tools button { width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--card); border-radius: 50%; font: 700 16px Georgia, serif; box-shadow: 2px 2px 0 var(--ink); cursor: pointer; color: var(--ink); padding: 0; }
.gl-tools button.wide { width: auto; border-radius: 18px; padding: 0 12px; background: var(--ochre); }
.gl-tools button:active { transform: translate(2px,2px); box-shadow: none; }
.museum-wrap.two-d { position: relative; }
.gl-banner { position: absolute; left: 12px; top: 12px; background: rgba(255,250,240,.94); border: 2px solid var(--ink); border-radius: 6px; padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
.gl-banner b { display: block; font-family: var(--title); font-size: 1.05rem; }
.gl-banner small { font-style: italic; }

@media (max-width: 720px) {
  .gl-label.room { font-size: 10px; padding: 1px 5px; border-width: 1.5px; box-shadow: 1px 1px 0 var(--ink); }
  .gl-label.room small { display: none; }
  .gl-label.sign { display: none !important; }
}

#installBtn[hidden] { display: none; }
.welcome-logo { display: block; width: 100%; max-width: 460px; margin: 0 auto 10px; border-radius: 8px; }
.install-box { display: flex; gap: 12px; align-items: center; }
.install-box img { width: 64px; height: 64px; border-radius: 14px; flex: none; }

</style>
</head>

<script>
/* Musée & Expéditions — JLG Creative
 * core.js : espace de noms, hasard reproductible, utilitaires communs.
 * Tous les modules s'attachent à l'objet global ME (scripts classiques,
 * pour fonctionner aussi en ouvrant index.html directement depuis le disque).
 */
(function (G) {
  'use strict';
  const ME = (G.ME = G.ME || {});
  ME.VERSION = 1;
  ME.SAVE_KEY = 'musee-expeditions-save-v1';

  /* ---------- Hasard reproductible (mulberry32, graine stockée dans l'état) ---------- */
  ME.rand = function (state) {
    state.rngSeed = (state.rngSeed + 0x6d2b79f5) | 0;
    let t = state.rngSeed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  ME.randInt = (state, min, max) => min + Math.floor(ME.rand(state) * (max - min + 1));
  ME.chance = (state, p) => ME.rand(state) < p;
  ME.pick = (state, arr) => arr[Math.floor(ME.rand(state) * arr.length)];
  ME.pickWeighted = function (state, items, weightFn) {
    const ws = items.map(weightFn);
    const total = ws.reduce((a, b) => a + b, 0);
    if (total <= 0) return items[0];
    let r = ME.rand(state) * total;
    for (let i = 0; i < items.length; i++) {
      r -= ws[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  };
  /* Générateur local, indépendant de l'état (pour le dessin : même graine → même image). */
  ME.seeded = function (seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), s | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  ME.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  ME.round = (v) => Math.round(v);
  ME.fmtMoney = function (v) {
    const n = Math.round(v);
    return n.toLocaleString('fr-FR').replace(/ | /g, ' ') + ' €';
  };
  ME.fmtInt = (v) => Math.round(v).toLocaleString('fr-FR');
  ME.deepClone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------- Identifiants ---------- */
  ME.nextId = function (state, counter, prefix, pad) {
    state.counters[counter] = (state.counters[counter] || 0) + 1;
    return prefix + String(state.counters[counter]).padStart(pad || 4, '0');
  };

  /* ---------- Journal & notifications ---------- */
  ME.log = function (state, text, kind, ref) {
    state.journal.unshift({ week: state.week, text, kind: kind || 'info', ref: ref || null });
    if (state.journal.length > 300) state.journal.length = 300;
    if (ME._toast) ME._toast(text, kind);
  };

  ME.weekLabel = function (week) {
    const year = Math.floor((week - 1) / 52) + 1;
    const w = ((week - 1) % 52) + 1;
    return 'Saison ' + year + ' · semaine ' + w;
  };

  ME.money = function (state, amount, label, cat) {
    state.money += amount;
    state.ledgerCurrent.push({ label, amount: Math.round(amount), cat: cat || (amount >= 0 ? 'divers' : 'charges') });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    fibule: { name: 'Fibule en bronze', shape: 'fibula', period: 'gaule', mat: 'bronze', rarity: 'commun', dates: [-200, -30],

          'La fibule fermait les vêtements. Sa forme change vite avec la mode : c\'est un excellent marqueur de datation.',

    statere: { name: 'Statère arverne en or', shape: 'coin', period: 'gaule', mat: 'or', rarity: 'rare', dates: [-80, -52],

          'Les Gaulois imitent d\'abord le statère de Philippe II de Macédoine, puis transforment le modèle en un style très personnel.',

    dressel: { name: 'Amphore Dressel 1', shape: 'amphora', period: 'gaule', mat: 'ceramique', rarity: 'peuCommun', dates: [-130, -30],

<script>
/* Musée & Expéditions — objects.js
 * Objets individualisés : identifiant permanent, provenance, datation, état, rareté,
 * intérêt scientifique, documentation, étude, et historique complet de leur parcours.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const O = (ME.Objects = {});

  O.LOCATIONS = {
    terrain: 'Sur le terrain',
    transport: 'En transport',
    reserve: 'En réserve',
    atelier: 'À l\'atelier',
    vitrine: 'Exposé',
    'pret-sortant': 'Prêté à un autre musée',
    'en-route': 'En route (prêt entrant)',
    depot: 'Dépôt chez le partenaire',
    rendu: 'Rendu à son propriétaire',
    restitue: 'Restitué',
  };

  /* Transitions autorisées : garantit qu'un objet suit un parcours cohérent. */
  const ALLOWED = {
    terrain: ['transport', 'depot'],
    transport: ['reserve'],
    'en-route': ['reserve'],
    reserve: ['atelier', 'vitrine', 'pret-sortant', 'rendu', 'restitue', 'depot'],
    atelier: ['reserve'],
    vitrine: ['reserve'],
    'pret-sortant': ['reserve'],
    depot: ['en-route'],
    rendu: ['depot', 'en-route'],
    restitue: [],
  };

  function fmtYear(y) {
    if (y < -10000) return 'vers ' + ME.fmtInt(Math.round(-y / 500) * 500) + ' av. J.-C.';
    if (y < 0) return 'vers ' + Math.round(-y / 10) * 10 + ' av. J.-C.';
    if (y < 500) return 'vers ' + Math.max(1, Math.round(y / 10) * 10) + ' apr. J.-C.';
    const c = Math.floor((y - 1) / 100) + 1;
    const roman = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV'][c] || c;
    const part = y % 100 < 34 ? 'début du ' : y % 100 < 67 ? 'milieu du ' : 'fin du ';
    return part + roman + 'e siècle';
  }
  O.fmtYear = fmtYear;

  const VARIANTS = {
    amphora: ['', ' à col tranché', ' timbrée', ' à anses coudées'],
    coin: ['', ' bien centré', ' à flan large', ' usé par la circulation'],
    default: [''],
  };
  const SQUARES = 'ABCDEFGH';

  /** Crée un objet et l'enregistre dans l'état. opts : {mode, dest, expId, location, condition, documentation, studied, provenance, owner, lender, prefix, layer} */
  O.create = function (state, typeKey, opts) {
    opts = opts || {};
    const t = D.TYPES[typeKey];
    if (!t) throw new Error('Type inconnu : ' + typeKey);
    const prefix = opts.prefix || 'MEX-';
    const id = ME.nextId(state, prefix === 'MEX-' ? 'obj' : 'loan', prefix, 4);
    const year = Math.round(t.dates[0] + ME.rand(state) * (t.dates[1] - t.dates[0]));
    const variants = VARIANTS[t.shape] || VARIANTS.default;
    const rar = D.RARITY[t.rarity];
    const dest = opts.dest ? D.DESTINATIONS[opts.dest] : null;
    let context = null;
    if (dest) {
      context = {
        site: dest.site,
        layer: opts.layer || ME.pick(state, dest.layers),
        square: SQUARES[ME.randInt(state, 0, 7)] + ME.randInt(state, 1, 9),
        depth: (ME.randInt(state, 15, 320) / 100).toFixed(2).replace('.', ',') + ' m',
      };
    }
    const obj = {
      id,
      type: typeKey,
      name: t.name + ME.pick(state, variants),
      period: t.period,
      mat: t.mat,
      rarity: t.rarity,
      year,
      dating: fmtYear(year),
      dest: opts.dest || null,
      context,
      provenance: opts.provenance || (dest ? dest.name + ', ' + dest.place : 'Origine inconnue'),
      provenanceDoc: opts.provenanceDoc || 'complete',
      owner: opts.owner || 'musee',
      lender: opts.lender || null,
      acquisition: { mode: opts.mode || 'fouille', week: state.week, expId: opts.expId || null, price: opts.price || 0 },
      condition: Math.round(ME.clamp(opts.condition != null ? opts.condition : 60, 5, 100)),
      documentation: Math.round(ME.clamp(opts.documentation != null ? opts.documentation : 50, 0, 100)),
      studied: Math.round(ME.clamp(opts.studied || 0, 0, 100)),
      sci: Math.round(ME.clamp(rar.score * 14 + ME.randInt(state, 0, 25) + (opts.documentation || 50) * 0.2, 5, 100)),
      location: opts.location || 'reserve',
      roomId: null,
      slot: null,
      revealed: opts.revealed != null ? opts.revealed : true,
      seed: ME.randInt(state, 1, 2147483646),
      returnWeek: null,
      loanOut: null,
      history: [],
    };
    state.objects[id] = obj;
    return obj;
  };

  O.addHistory = function (state, obj, text) {
    obj.history.push({ w: state.week, loc: obj.location, text });
  };

  /** Déplace un objet en respectant les transitions autorisées. Renvoie true si le déplacement est valide. */
  O.move = function (state, obj, to, text) {
    const allowed = ALLOWED[obj.location] || [];
    if (!allowed.includes(to)) {
      throw new Error('Déplacement impossible de « ' + obj.location + ' » vers « ' + to + ' » pour ' + obj.id);
    }
    obj.location = to;
    if (to !== 'vitrine') { obj.roomId = null; obj.slot = null; }
    O.addHistory(state, obj, text || O.LOCATIONS[to]);
    return true;
  };

  O.get = (state, id) => state.objects[id];

  O.all = (state, filterFn) => Object.values(state.objects).filter(filterFn || (() => true));

  /** Objets présents physiquement au musée (réserve, atelier, vitrines). */
  O.inMuseum = (state) => O.all(state, (o) => ['reserve', 'atelier', 'vitrine'].includes(o.location));

  O.reserveCount = (state) => O.all(state, (o) => o.location === 'reserve' || o.location === 'atelier').length;

  O.type = (obj) => D.TYPES[obj.type];
  O.material = (obj) => D.MATERIALS[obj.mat];

  /** Valeur d'assurance estimée. */
  O.value = function (obj) {
    const r = D.RARITY[obj.rarity].value;
    return Math.round(r * (0.4 + 0.6 * obj.condition / 100) * (1 + obj.studied / 200));
  };

  O.conditionLabel = function (c) {
    if (c >= 85) return 'Excellent';
    if (c >= 65) return 'Bon';
    if (c >= 45) return 'Moyen';
    if (c >= 25) return 'Fragile';
    return 'Très dégradé';
  };

  /** Seuil d'état minimum pour exposer (les objets fragiles exigent plus). */
  O.minDisplayCondition = function (obj) {
    return Math.round(35 + O.material(obj).fragility * 20);
  };

  /** Fiche historique visible selon le niveau d'étude. */
  O.ficheTiers = function (obj) {
    const t = O.type(obj);
    return [
      { unlocked: true, text: t.h[0], need: 0 },
      { unlocked: obj.studied >= 40, text: t.h[1], need: 40 },
      { unlocked: obj.studied >= 80, text: t.h[2], need: 80 },
    ];
  };

  /** Attrait d'un objet exposé, avant préférences des visiteurs. */
  O.appeal = function (obj) {
    const r = D.RARITY[obj.rarity].score;
    return r * (0.35 + 0.65 * obj.condition / 100) * (0.75 + 0.25 * obj.studied / 100 + 0.1 * obj.documentation / 100);
  };

  O.isOnLoanIn = (obj) => obj.owner === 'preteur' || obj.owner === 'partenaire';

  O.ownerLabel = function (obj) {
    if (obj.owner === 'musee') return 'Collection du musée';
    const inst = obj.lender && D.INSTITUTIONS[obj.lender];
    if (obj.owner === 'partenaire') return 'Propriété de : ' + (inst ? inst.name : 'partenaire');
    return 'Prêt de : ' + (inst ? inst.name : obj.lender);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Musée & Expéditions — state.js
 * Création d'une partie, sauvegarde automatique (localStorage), export / import,
 * migration des anciennes sauvegardes.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const S = (ME.State = {});

  S.newGame = function (seed) {
    const state = {
      version: ME.VERSION,
      createdAt: new Date().toISOString(),
      rngSeed: (seed != null ? seed : Math.floor(Math.random() * 2147483646)) | 0,
      week: 1,
      museumName: 'Musée & Expéditions',
      money: 16000,
      reputation: 8,
      science: 0,
      ticketPrice: 8,
      shopLevel: 1,
      benches: 2,
      reserveCap: 14,
      counters: {},
      staff: [],
      candidates: [],
      objects: {},
      expeditions: [],
      permits: {},
      knowledge: {},
      rooms: {},
      route: ['salle1', 'salle2'],
      jobs: [],
      tempExpo: null,
      tempHistory: [],
      loansIn: [],
      loanOffers: [],
      market: [],
      grants: {},
      ledgerCurrent: [],
      ledger: [],
      lastVisit: null,
      visitHistory: [],
      totalVisitors: 0,
      journal: [],
      pendingReveals: [],
      objectives: {},
      settings: { weeklyReport: true },
    };

    for (const k in D.INSTITUTIONS) state.permits[k] = { status: 'none', weeksLeft: 0, validUntil: 0, partnership: 10 };
    for (const k in D.DESTINATIONS) state.knowledge[k] = 0;
    for (const k in D.ROOMS) {
      const r = D.ROOMS[k];
      state.rooms[k] = { unlocked: r.unlocked, theme: null, lighting: 'standard', vitrines: new Array(r.slots).fill(null) };
    }

    D.STAFF_START.forEach((p) => state.staff.push(makeStaff(state, p)));
    state.candidates = D.CANDIDATES.slice(0, 3).map((c) => ME.deepClone(c));

    D.START_COLLECTION.forEach((c) => {
      const o = ME.Objects.create(state, c.type, {
        mode: 'legs', condition: c.condition, studied: c.studied, documentation: 55,
        provenance: c.prov, location: 'reserve',
      });
      o.acquisition.week = 0;
      ME.Objects.addHistory(state, o, 'Entrée dans la collection — ' + c.prov);
      if (c.room) {
        state.rooms[c.room].vitrines[c.slot] = o.id;
        o.location = 'vitrine'; o.roomId = c.room; o.slot = c.slot;
        ME.Objects.addHistory(state, o, 'Exposé : ' + D.ROOMS[c.room].name);
      }
    });

    state.permits.sap.partnership = 20;
    ME.log(state, 'Bienvenue ! Le musée ouvre ses portes avec le legs du Dr Aubertin. Préparez votre première expédition depuis la carte.', 'story');
    return state;
  };

  function makeStaff(state, p) {
    const id = ME.nextId(state, 'staff', 'P', 2);
    return { id, name: p.name, role: p.role, salary: p.salary, skills: Object.assign({}, p.skills), traits: (p.traits || []).slice(), look: Object.assign({}, p.look), assign: null, xp: 0 };
  }
  S.makeStaff = makeStaff;

  /* ---------------- Sauvegarde ---------------- */
  S.memorySave = null; // repli si localStorage indisponible

  S.serialize = (state) => JSON.stringify(state);

  S.validate = function (data) {
    if (!data || typeof data !== 'object') throw new Error('Fichier illisible.');
    if (typeof data.week !== 'number' || !data.objects || !data.rooms || !Array.isArray(data.staff)) {
      throw new Error('Ce fichier ne ressemble pas à une sauvegarde de Musée & Expéditions.');
    }
    return true;
  };

  /** Mise à niveau des sauvegardes plus anciennes : complète les champs manquants. */
  S.migrate = function (data) {
    const toast = ME._toast; ME._toast = null;
    const fresh = S.newGame(1);
    ME._toast = toast;
    for (const k in fresh) if (!(k in data)) data[k] = ME.deepClone(fresh[k]);
    for (const k in D.ROOMS) {
      if (!data.rooms[k]) data.rooms[k] = ME.deepClone(fresh.rooms[k]);
      const need = D.ROOMS[k].slots;
      while (data.rooms[k].vitrines.length < need) data.rooms[k].vitrines.push(null);
    }
    for (const k in D.INSTITUTIONS) if (!data.permits[k]) data.permits[k] = ME.deepClone(fresh.permits[k]);
    for (const k in D.DESTINATIONS) if (data.knowledge[k] == null) data.knowledge[k] = 0;
    Object.values(data.objects).forEach((o) => { if (!o.history) o.history = []; });
    data.version = ME.VERSION;
    return data;
  };

  S.deserialize = function (text) {
    const data = typeof text === 'string' ? JSON.parse(text) : text;
    S.validate(data);
    return S.migrate(data);
  };

  S.save = function (state) {
    const txt = S.serialize(state);
    S.memorySave = txt;
    try { G.localStorage && G.localStorage.setItem(ME.SAVE_KEY, txt); return true; } catch (e) { return false; }
  };

  S.load = function () {
    let txt = null;
    try { txt = G.localStorage && G.localStorage.getItem(ME.SAVE_KEY); } catch (e) { txt = null; }
    if (!txt) txt = S.memorySave;
    if (!txt) return null;
    try { return S.deserialize(txt); } catch (e) { return null; }
  };

  S.clear = function () {
    S.memorySave = null;
    try { G.localStorage && G.localStorage.removeItem(ME.SAVE_KEY); } catch (e) { /* ignore */ }
  };

  /** Code de sauvegarde compact (texte copiable) : JSON encodé en base64 UTF-8. */
  S.exportCode = function (state) {
    const json = S.serialize(state);
    const bytes = new TextEncoder().encode(json);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'MEX1:' + btoa(bin);
  };

  S.importText = function (text) {
    text = (text || '').trim();
    if (text.startsWith('MEX1:')) {
      const bin = atob(text.slice(5));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      text = new TextDecoder().decode(bytes);
    }
    return S.deserialize(text);
  };
})(typeof window !== 'undefined' ? window : globalThis);
