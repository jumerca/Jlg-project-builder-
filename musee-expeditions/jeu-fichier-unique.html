<script>
/* Musée & Expéditions — expeditions.js
 * Autorisations, partenariats, préparation et déroulement des expéditions,
 * tables de découvertes par site, transport et rapatriement.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Obj = ME.Objects;
  const X = (ME.Expeditions = {});

  /* ---------------- Équipe ---------------- */
  X.staffById = (state, id) => state.staff.find((p) => p.id === id);
  X.isAvailable = (p) => !p.assign || p.assign.kind === 'accueil';

  /** Compétence d'équipe : le meilleur compte entièrement, les autres à moitié (complémentarité). */
  X.teamSkill = function (members, skill) {
    const vals = members.map((p) => p.skills[skill] || 0).sort((a, b) => b - a);
    if (!vals.length) return 0;
    return vals[0] + vals.slice(1).reduce((a, b) => a + b * 0.5, 0);
  };

  /* ---------------- Autorisations ---------------- */
  X.permitFor = (state, destKey) => state.permits[D.DESTINATIONS[destKey].inst];

  X.permitValid = function (state, destKey) {
    const p = X.permitFor(state, destKey);
    return p.status === 'granted' && p.validUntil >= state.week;
  };

  X.permitChance = function (state, instKey) {
    const p = state.permits[instKey];
    const dipl = Math.max(0, ...state.staff.map((s) => s.skills.diplomatie || 0));
    return ME.clamp(0.5 + state.reputation * 0.01 + p.partnership * 0.005 + dipl * 0.06, 0.2, 0.97);
  };

  X.requestPermit = function (state, instKey) {
    const inst = D.INSTITUTIONS[instKey];
    const p = state.permits[instKey];
    if (p.status === 'pending') return { ok: false, error: 'Demande déjà en cours d\'instruction.' };
    if (state.reputation < inst.minRep) return { ok: false, error: 'Réputation insuffisante (' + inst.minRep + ' requise).' };
    if (state.money < inst.permitCost) return { ok: false, error: 'Fonds insuffisants pour constituer le dossier.' };
    ME.money(state, -inst.permitCost, 'Dossier d\'autorisation — ' + inst.short, 'expeditions');
    p.status = 'pending';
    p.weeksLeft = inst.permitWeeks;
    ME.log(state, 'Dossier déposé auprès de : ' + inst.name + '. Réponse dans ' + inst.permitWeeks + ' semaine(s).', 'info');
    return { ok: true };
  };

  X.tickPermits = function (state) {
    for (const k in state.permits) {
      const p = state.permits[k];
      const inst = D.INSTITUTIONS[k];
      if (p.status === 'pending') {
        p.weeksLeft--;
        if (p.weeksLeft <= 0) {
          if (ME.chance(state, X.permitChance(state, k))) {
            p.status = 'granted';
            p.validUntil = state.week + 30;
            p.partnership = Math.min(100, p.partnership + 5);
            ME.log(state, inst.name + ' vous accorde une autorisation de fouille (30 semaines).', 'success');
          } else {
            p.status = 'refused';
            p.partnership = Math.min(100, p.partnership + 3);
            ME.log(state, inst.name + ' refuse votre dossier pour cette fois : renforcez votre réputation ou votre équipe diplomatique, puis redemandez.', 'warning');
          }
        }
      } else if (p.status === 'granted' && p.validUntil < state.week) {
        p.status = 'expired';
        ME.log(state, 'L\'autorisation accordée par ' + inst.short + ' a expiré.', 'warning');
      }
    }
  };

  /* ---------------- Préparation ---------------- */
  X.planCost = function (state, plan) {
    const dest = D.DESTINATIONS[plan.dest];
    const m = D.MISSIONS[plan.mission];
    const field = dest.weekly * plan.weeks;
    const equip = (plan.equip || []).reduce((a, k) => a + D.EQUIPMENT[k].cost, 0);
    const travel = 300 * dest.transport * Math.max(1, (plan.team || []).length);
    const gross = field + equip + travel;
    const total = Math.round(gross * m.costMult);
    return { field, equip, travel, gross, partnerShare: gross - total, total };
  };

  X.validatePlan = function (state, plan) {
    const errors = [];
    const dest = D.DESTINATIONS[plan.dest];
    const m = D.MISSIONS[plan.mission];
    if (!dest || !m) return ['Plan incomplet.'];
    if (state.reputation < dest.unlockRep) errors.push('Réputation insuffisante pour ce site (' + dest.unlockRep + ' requise).');
    if (m.needsPermit && !X.permitValid(state, plan.dest)) errors.push('Autorisation de fouille requise auprès de : ' + D.INSTITUTIONS[dest.inst].name + '.');
    if (m.minPartner && X.permitFor(state, plan.dest).partnership < m.minPartner) errors.push('Partenariat insuffisant (' + m.minPartner + ' requis).');
    if (plan.weeks < m.minWeeks || plan.weeks > m.maxWeeks) errors.push('Durée invalide.');
    const team = (plan.team || []).map((id) => X.staffById(state, id)).filter(Boolean);
    if (team.length < 2) errors.push('Il faut au moins 2 membres d\'équipe.');
    if (team.length > 5) errors.push('Maximum 5 membres d\'équipe.');
    team.forEach((p) => { if (!X.isAvailable(p)) errors.push(p.name + ' est déjà occupé(e).'); });
    dest.required.forEach((k) => { if (!(plan.equip || []).includes(k)) errors.push('Équipement obligatoire : ' + D.EQUIPMENT[k].label + '.'); });
    if (dest.transport >= 2 && !(plan.equip || []).includes('camp')) errors.push('Équipement obligatoire : ' + D.EQUIPMENT.camp.label + '.');
    if (dest.diver && !team.some((p) => p.traits.includes('plongeur'))) errors.push('Un plongeur est indispensable dans l\'équipe.');
    if (state.expeditions.some((e) => e.dest === plan.dest && e.phase !== 'termine')) errors.push('Une expédition est déjà en cours sur ce site.');
    const cost = X.planCost(state, plan);
    if (state.money < cost.total) errors.push('Budget insuffisant : ' + ME.fmtMoney(cost.total) + ' nécessaires.');
    return Array.from(new Set(errors));
  };

  /** Estimations affichées au joueur pour l'aider à composer son équipe. */
  X.forecast = function (state, plan) {
    const dest = D.DESTINATIONS[plan.dest];
    const m = D.MISSIONS[plan.mission];
    const team = (plan.team || []).map((id) => X.staffById(state, id)).filter(Boolean);
    const sk = (k) => X.teamSkill(team, k);
    const perWeek = (0.4 + sk('fouille') * 0.12 + ((plan.equip || []).includes('topo') ? 0.3 : 0) + state.knowledge[plan.dest] / 100 * 0.5) * m.findMult;
    return {
      finds: Math.max(0, Math.round(perWeek * plan.weeks * 10) / 10),
      care: ME.clamp(Math.round(40 + sk('conservation') * 9 + ((plan.equip || []).includes('kit') ? 12 : 0)), 0, 100),
      doc: ME.clamp(Math.round(35 + sk('recherche') * 7 + ((plan.equip || []).includes('topo') ? 18 : 0)), 0, 100),
      safety: ME.clamp(Math.round(40 + sk('logistique') * 10 + ((plan.equip || []).includes('caisses') ? 25 : 0)), 0, 100),
      diplomacy: ME.clamp(Math.round(30 + sk('diplomatie') * 12), 0, 100),
      skills: Object.keys(D.SKILLS).reduce((acc, k) => (acc[k] = sk(k), acc), {}),
    };
  };

  X.launch = function (state, plan) {
    const errors = X.validatePlan(state, plan);
    if (errors.length) return { ok: false, errors };
    const dest = D.DESTINATIONS[plan.dest];
    const cost = X.planCost(state, plan);
    ME.money(state, -cost.total, 'Expédition — ' + dest.name, 'expeditions');
    const id = ME.nextId(state, 'exp', 'EXP-', 2);
    const exp = {
      id, dest: plan.dest, mission: plan.mission, weeks: plan.weeks, weekDone: 0, phase: 'terrain',
      transportLeft: 0, team: plan.team.slice(), equip: (plan.equip || []).slice(), finds: [],
      log: [], cost: cost.total, startWeek: state.week, endWeek: null, progress: 0, morale: 80, extra: 0,
    };
    plan.team.forEach((pid) => { X.staffById(state, pid).assign = { kind: 'expedition', id }; });
    state.expeditions.push(exp);
    exp.log.push({ w: state.week, text: 'Départ de l\'équipe vers ' + dest.name + ' (' + D.MISSIONS[plan.mission].label.toLowerCase() + ', ' + plan.weeks + ' semaines).' });
    ME.log(state, 'L\'expédition ' + id + ' part pour ' + dest.name + '.', 'story', { exp: id });
    return { ok: true, exp };
  };

  /* ---------------- Événements de terrain ---------------- */
  const EVENTS = [
    { key: 'pluie', w: 1, biomes: ['valley', 'plateau', 'forest'], run(ctx) {
      if (ctx.has('camp') || ctx.sk('logistique') >= 4) return 'Pluies diluviennes. Bâches tendues à temps : le travail continue.';
      ctx.progress *= 0.5; return 'Pluies diluviennes : le chantier est noyé, la moitié de la semaine est perdue.'; } },
    { key: 'visite', w: 1, run(ctx) {
      const g = 2 + Math.round(ctx.sk('diplomatie'));
      ctx.permit.partnership = Math.min(100, ctx.permit.partnership + g);
      return 'Visite d\'une délégation (' + ctx.inst.short + ') : la rigueur du chantier impressionne. Partenariat +' + g + '.'; } },
    { key: 'presse', w: 0.8, run(ctx) { ctx.state.reputation += 1; return 'Un journaliste publie un reportage sur la fouille. Réputation +1.'; } },
    { key: 'local', w: 0.9, run(ctx) { ctx.bonusFinds += 1; ctx.state.knowledge[ctx.exp.dest] = Math.min(100, ctx.state.knowledge[ctx.exp.dest] + 5); return 'Un habitant signale un secteur prometteur. Une découverte supplémentaire !'; } },
    { key: 'blessure', w: 0.6, run(ctx) {
      if (ctx.sk('logistique') >= 3) return 'Une entorse sur le chantier, vite prise en charge grâce à une logistique solide.';
      ctx.progress *= 0.7; ctx.exp.morale -= 10; return 'Une fouilleuse se blesse : l\'équipe ralentit.'; } },
    { key: 'surcout', w: 0.7, run(ctx) {
      const c = ctx.sk('logistique') >= 4 ? 120 : 350;
      ME.money(ctx.state, -c, 'Imprévu de terrain — ' + ctx.dest.name, 'expeditions'); ctx.exp.extra += c;
      return 'Location imprévue d\'une pompe et d\'un groupe électrogène : ' + ME.fmtMoney(c) + '.'; } },
    { key: 'mistral', w: 1.4, biomes: ['sea'], run(ctx) { ctx.progress *= 0.5; return 'Coup de mistral : les plongées sont annulées trois jours.'; } },
    { key: 'compresseur', w: 0.8, biomes: ['sea'], run(ctx) {
      if (ctx.sk('logistique') >= 3) return 'Le compresseur tousse ; Théo le répare dans la soirée.';
      ctx.progress *= 0.6; return 'Panne du compresseur : on attend une pièce de rechange.'; } },
    { key: 'khamsin', w: 1.3, biomes: ['desert'], run(ctx) {
      if (ctx.has('camp')) { ctx.progress *= 0.8; return 'Le khamsin souffle ; le camp tient bon, les tranchées se remplissent de sable.'; }
      ctx.progress *= 0.4; return 'Tempête de sable : le chantier est enseveli.'; } },
    { key: 'inspecteur', w: 1, biomes: ['desert', 'island'], run(ctx) {
      if (ctx.sk('diplomatie') >= 3) { ctx.permit.partnership = Math.min(100, ctx.permit.partnership + 4); return 'L\'inspecteur des antiquités dîne au camp ; les échanges sont chaleureux. Partenariat +4.'; }
      ctx.progress *= 0.6; return 'Contrôle administratif tatillon : deux jours perdus en paperasse.'; } },
    { key: 'meltemi', w: 1.2, biomes: ['island'], run(ctx) { ctx.progress *= 0.6; return 'Le meltemi empêche le caïque de rejoindre l\'îlot.'; } },
    { key: 'labour', w: 1, biomes: ['plateau'], run(ctx) { ctx.bonusFinds += 1; return 'Un agriculteur apporte des tessons remontés par sa charrue : on ouvre un nouveau sondage.'; } },
    { key: 'ronces', w: 1, biomes: ['forest'], run(ctx) {
      if (ctx.sk('fouille') >= 4) return 'Les ronces du cloître sont dégagées en une matinée.';
      ctx.progress *= 0.75; return 'Il faut d\'abord débroussailler le cloître envahi par les ronces.'; } },
    { key: 'eboulis', w: 0.9, biomes: ['valley'], run(ctx) {
      if (ctx.sk('logistique') >= 3) return 'Un bloc menace de tomber ; il est étayé avant tout incident.';
      ctx.progress *= 0.6; return 'Un éboulis bloque l\'accès à l\'abri : chantier ralenti.'; } },
    { key: 'grotte', w: 0.5, biomes: ['valley'], run(ctx) { ctx.rareBoost += 0.6; return 'Un courant d\'air froid révèle une petite cavité scellée. Émotion sur le chantier !'; } },
    { key: 'cartonnage', w: 0.5, biomes: ['desert'], run(ctx) { ctx.rareBoost += 0.6; return 'Un puits funéraire intact est dégagé. On retient son souffle.'; } },
  ];

  function rollEvent(state, ctx) {
    if (!ME.chance(state, 0.45)) return null;
    const pool = EVENTS.filter((e) => !e.biomes || e.biomes.includes(ctx.dest.biome));
    const ev = ME.pickWeighted(state, pool, (e) => e.w);
    return ev.run(ctx);
  }

  /* ---------------- Découvertes ---------------- */
  X.rollFind = function (state, exp, ctx) {
    const dest = D.DESTINATIONS[exp.dest];
    const know = state.knowledge[exp.dest];
    const entry = ME.pickWeighted(state, dest.loot, ([type, w]) => {
      const sc = D.RARITY[D.TYPES[type].rarity].score;
      return w * (sc >= 3 ? 1 + know / 60 + ctx.sk('recherche') * 0.05 + ctx.rareBoost : 1);
    });
    const type = entry[0];
    const mat = D.MATERIALS[D.TYPES[type].mat];
    const condition = 72 - mat.fragility * 35 + ME.randInt(state, -20, 15) + ctx.sk('conservation') * 3 + (ctx.has('kit') ? 10 : 0);
    const documentation = 35 + ctx.sk('recherche') * 7 + (ctx.has('topo') ? 18 : 0) + ME.randInt(state, 0, 15);
    const mode = exp.mission === 'scientifique' ? 'scientifique' : exp.mission;
    const obj = Obj.create(state, type, {
      dest: exp.dest, mode, expId: exp.id, condition: ME.clamp(condition, 8, 96), documentation,
      location: 'terrain', revealed: false,
    });
    Obj.addHistory(state, obj, 'Mis au jour — ' + dest.site + ', ' + obj.context.layer + ', carré ' + obj.context.square + ', à ' + obj.context.depth + '. Expédition ' + exp.id + '.');
    exp.finds.push(obj.id);
    return obj;
  };

  /* ---------------- Déroulement hebdomadaire ---------------- */
  X.tick = function (state) {
    const arrivals = [];
    state.expeditions.forEach((exp) => {
      if (exp.phase === 'terrain') tickTerrain(state, exp);
      else if (exp.phase === 'transport') {
        exp.transportLeft--;
        if (exp.transportLeft <= 0) arrivals.push(...finish(state, exp));
        else exp.log.push({ w: state.week, text: 'Les caisses sont en route vers le musée.' });
      }
    });
    return arrivals;
  };

  function tickTerrain(state, exp) {
    const dest = D.DESTINATIONS[exp.dest];
    const team = exp.team.map((id) => X.staffById(state, id)).filter(Boolean);
    const ctx = {
      state, exp, dest, inst: D.INSTITUTIONS[dest.inst], permit: state.permits[dest.inst],
      sk: (k) => X.teamSkill(team, k), has: (k) => exp.equip.includes(k),
      progress: 1, bonusFinds: 0, rareBoost: 0,
    };
    const evText = rollEvent(state, ctx);
    if (evText) exp.log.push({ w: state.week, text: evText, event: true });

    const m = D.MISSIONS[exp.mission];
    const expected = (0.4 + ctx.sk('fouille') * 0.12 + (ctx.has('topo') ? 0.3 : 0) + state.knowledge[exp.dest] / 100 * 0.5) * m.findMult * ctx.progress;
    let n = Math.floor(expected) + (ME.chance(state, expected % 1) ? 1 : 0) + ctx.bonusFinds;
    const found = [];
    for (let i = 0; i < n; i++) found.push(X.rollFind(state, exp, ctx));
    if (found.length) {
      exp.log.push({ w: state.week, text: found.length === 1 ? 'Une découverte enregistrée au carnet : objet n° ' + found[0].id + '.' : found.length + ' découvertes enregistrées au carnet (' + found.map((o) => o.id).join(', ') + ').', finds: found.map((o) => o.id) });
    } else {
      exp.log.push({ w: state.week, text: 'Semaine de décapage patient, sans découverte notable.' });
    }
    exp.weekDone++;
    exp.progress = exp.weekDone / exp.weeks;
    if (exp.weekDone >= exp.weeks) closeField(state, exp, ctx);
  }

  function closeField(state, exp, ctx) {
    const dest = ctx.dest;
    const inst = ctx.inst;
    const m = D.MISSIONS[exp.mission];
    state.knowledge[exp.dest] = Math.min(100, state.knowledge[exp.dest] + m.knowledge);
    const docAvg = exp.finds.length ? exp.finds.reduce((a, id) => a + state.objects[id].documentation, 0) / exp.finds.length : 50;
    const partnerGain = m.partner + Math.round(docAvg / 25) + Math.round(ctx.sk('diplomatie'));
    ctx.permit.partnership = Math.min(100, ctx.permit.partnership + partnerGain);
    const sci = Math.round(exp.finds.reduce((a, id) => a + state.objects[id].sci, 0) / 12 * (m.science || 1));
    state.science += sci;
    // Partage des découvertes
    let keepIdx = 0;
    const sorted = exp.finds.map((id) => state.objects[id]).sort((a, b) => D.RARITY[b.rarity].score - D.RARITY[a.rarity].score);
    const toPartner = new Set();
    if (exp.mission === 'scientifique') sorted.forEach((o) => toPartner.add(o.id));
    else if (inst.share > 0) sorted.forEach((o) => { if (keepIdx++ % 2 === 0) toPartner.add(o.id); });

    exp.finds.forEach((id) => {
      const o = state.objects[id];
      if (toPartner.has(id)) {
        o.owner = 'partenaire';
        o.lender = dest.inst;
        Obj.move(state, o, 'depot', exp.mission === 'scientifique'
          ? 'Mission conjointe : objet conservé par ' + inst.name + ' (dépôt partenaire, prêt possible).'
          : 'Partage des découvertes : attribué à ' + inst.name + ' selon l\'accord de fouille.');
      } else {
        const crate = ctx.has('caisses') ? 0.3 : 1;
        const dmg = Math.round(ME.randInt(state, 0, 18) * D.MATERIALS[o.mat].fragility * crate * Math.max(0.3, 1 - ctx.sk('logistique') * 0.08));
        o.condition = Math.max(5, o.condition - dmg);
        Obj.move(state, o, 'transport', 'Emballé et expédié vers le musée' + (ctx.has('caisses') ? ' en caisse capitonnée' : '') + '.');
        if (dmg >= 2) Obj.addHistory(state, o, 'Choc pendant le transport : état −' + dmg + '.');
      }
    });
    exp.phase = 'transport';
    exp.transportLeft = dest.transport;
    exp.log.push({ w: state.week, text: 'Fin de campagne. ' + exp.finds.length + ' objet(s) inventorié(s). Partenariat ' + inst.short + ' +' + partnerGain + ', science +' + sci + '. Le camp est démonté.' });
    ME.log(state, 'Fin de campagne pour ' + exp.id + ' (' + dest.name + ') : ' + exp.finds.length + ' découverte(s). Retour des caisses dans ' + dest.transport + ' semaine(s).', 'success', { exp: exp.id });
  }

  function finish(state, exp) {
    const arrivals = [];
    exp.finds.forEach((id) => {
      const o = state.objects[id];
      if (o.location === 'transport') {
        Obj.move(state, o, 'reserve', 'Arrivé au musée. Enregistré à l\'inventaire sous le n° ' + o.id + ', rangé en réserve.');
        arrivals.push(id);
      }
    });
    exp.team.forEach((pid) => {
      const p = X.staffById(state, pid);
      if (p && p.assign && p.assign.id === exp.id) { p.assign = null; p.xp += exp.weeks; }
    });
    exp.phase = 'termine';
    exp.endWeek = state.week;
    exp.log.push({ w: state.week, text: 'Les caisses arrivent au musée. Place au déballage !' });
    state.pendingReveals.push(...exp.finds.filter((id) => !state.objects[id].revealed));
    ME.log(state, 'Les caisses de ' + exp.id + ' sont arrivées : ' + exp.finds.length + ' découverte(s) à déballer.', 'success', { exp: exp.id });
    return arrivals;
  }

  X.EVENTS = EVENTS;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Musée & Expéditions — conservation.js
 * Atelier de restauration et d'étude (postes et personnel limités), réserves,
 * vieillissement des objets exposés selon l'éclairage.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Obj = ME.Objects;
  const C = (ME.Conservation = {});

  C.JOBS = {
    restauration: { label: 'Restauration', skill: 'conservation', verb: 'restaurer' },
    etude: { label: 'Étude scientifique', skill: 'recherche', verb: 'étudier' },
  };

  C.benchesUsed = (state) => state.jobs.length;
  C.benchesFree = (state) => state.benches - state.jobs.length;

  /** Plafond de restauration selon le talent du restaurateur. */
  C.restoreCap = (p) => Math.min(96, 68 + (p.skills.conservation || 0) * 7);

  C.canStart = function (state, objId, kind, staffId) {
    const o = state.objects[objId];
    const p = state.staff.find((s) => s.id === staffId);
    const job = C.JOBS[kind];
    if (!o || !job) return 'Objet ou travail inconnu.';
    if (o.location !== 'reserve') return 'L\'objet doit être en réserve (retirez-le d\'abord de sa vitrine).';
    if (C.benchesFree(state) <= 0) return 'Tous les postes de l\'atelier sont occupés (' + state.benches + ' postes).';
    if (!p) return 'Choisissez un membre de l\'équipe.';
    if (!ME.Expeditions.isAvailable(p)) return p.name + ' n\'est pas disponible.';
    if ((p.skills[job.skill] || 0) < 1) return p.name + ' n\'a pas la compétence ' + D.SKILLS[job.skill] + '.';
    if (kind === 'restauration' && o.condition >= C.restoreCap(p)) return 'L\'état de l\'objet dépasse déjà ce que ' + p.name + ' peut obtenir.';
    if (kind === 'etude' && o.studied >= 100) return 'Objet déjà entièrement étudié.';
    if (o.owner === 'preteur') return 'Un objet prêté ne peut pas être restauré ni étudié sans accord du prêteur.';
    return null;
  };

  C.start = function (state, objId, kind, staffId) {
    const err = C.canStart(state, objId, kind, staffId);
    if (err) return { ok: false, error: err };
    const o = state.objects[objId];
    const p = state.staff.find((s) => s.id === staffId);
    const id = ME.nextId(state, 'job', 'J', 3);
    const job = { id, objId, kind, staffId, startWeek: state.week, weeks: 0 };
    if (kind === 'restauration') { job.from = o.condition; job.target = C.restoreCap(p); }
    else { job.from = o.studied; job.target = 100; }
    state.jobs.push(job);
    p.assign = { kind: 'atelier', id };
    Obj.move(state, o, 'atelier', C.JOBS[kind].label + ' confiée à ' + p.name + '.');
    return { ok: true, job };
  };

  C.estimateWeeks = function (state, job) {
    const p = state.staff.find((s) => s.id === job.staffId);
    const o = state.objects[job.objId];
    const rate = C.rate(p, o, job.kind);
    const cur = job.kind === 'restauration' ? o.condition : o.studied;
    return Math.max(1, Math.ceil((job.target - cur) / rate));
  };

  C.rate = function (p, o, kind) {
    if (kind === 'restauration') {
      const frag = D.MATERIALS[o.mat].fragility;
      return (4 + (p.skills.conservation || 0) * 5) * (1.1 - frag * 0.5);
    }
    return 6 + (p.skills.recherche || 0) * 7 + o.documentation * 0.06;
  };

  C.cancel = function (state, jobId) {
    const i = state.jobs.findIndex((j) => j.id === jobId);
    if (i < 0) return;
    const job = state.jobs[i];
    const o = state.objects[job.objId];
    const p = state.staff.find((s) => s.id === job.staffId);
    if (p) p.assign = null;
    state.jobs.splice(i, 1);
    Obj.move(state, o, 'reserve', C.JOBS[job.kind].label + ' interrompue, retour en réserve.');
  };

  C.tick = function (state) {
    const done = [];
    state.jobs.slice().forEach((job) => {
      const o = state.objects[job.objId];
      const p = state.staff.find((s) => s.id === job.staffId);
      job.weeks++;
      const r = C.rate(p, o, job.kind);
      if (job.kind === 'restauration') {
        o.condition = Math.min(job.target, Math.round(o.condition + r));
        if (o.condition >= job.target) done.push(job);
      } else {
        const before = o.studied;
        o.studied = Math.min(100, Math.round(o.studied + r));
        state.science += Math.round((o.studied - before) * o.sci / 400);
        if (before < 40 && o.studied >= 40) Obj.addHistory(state, o, 'Étude : contexte historique établi.');
        if (before < 80 && o.studied >= 80) Obj.addHistory(state, o, 'Étude : analyse approfondie terminée.');
        if (o.studied >= 100) done.push(job);
      }
    });
    done.forEach((job) => {
      const o = state.objects[job.objId];
      const p = state.staff.find((s) => s.id === job.staffId);
      state.jobs.splice(state.jobs.indexOf(job), 1);
      if (p) { p.assign = null; p.xp += job.weeks; }
      let text;
      if (job.kind === 'restauration') {
        text = 'Restauration terminée par ' + (p ? p.name : '—') + ' : état ' + job.from + ' → ' + o.condition + '.';
      } else {
        text = 'Étude terminée : publication d\'une notice scientifique.';
        state.reputation += 1;
        if (o.dest) {
          const inst = D.DESTINATIONS[o.dest].inst;
          state.permits[inst].partnership = Math.min(100, state.permits[inst].partnership + 3);
        }
      }
      Obj.move(state, o, 'reserve', text);
      ME.log(state, o.name + ' (' + o.id + ') — ' + text, 'success', { obj: o.id });
    });
    return done;
  };

  /** Usure des objets exposés selon l'éclairage et la sensibilité du matériau. */
  C.wear = function (state) {
    Object.values(state.objects).forEach((o) => {
      if (o.location !== 'vitrine') return;
      const room = state.rooms[o.roomId];
      const light = D.LIGHTING[room.lighting];
      const sens = D.MATERIALS[o.mat].light;
      const loss = light.wear * sens * 1.6;
      if (loss > 0) {
        o._wear = (o._wear || 0) + loss;
        if (o._wear >= 1) {
          const l = Math.floor(o._wear);
          o.condition = Math.max(5, o.condition - l);
          o._wear -= l;
          if (o.condition < Obj.minDisplayCondition(o) + 3 && !o._warned) {
            o._warned = true;
            ME.log(state, o.name + ' (' + o.id + ') se dégrade sous l\'éclairage « ' + light.label + ' ». Pensez à tamiser la salle ou à le restaurer.', 'warning', { obj: o.id });
          }
        }
      }
    });
  };

  C.reserveUsage = (state) => ({ used: Obj.reserveCount(state), cap: state.reserveCap });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Musée & Expéditions — exhibitions.js
 * Salles, vitrines, thèmes, éclairage, parcours de visite, expositions temporaires,
 * prêts entrants et sortants, acquisitions documentées.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Obj = ME.Objects;
  const E = (ME.Exhibitions = {});

  /* ---------------- Vitrines ---------------- */
  E.canDisplay = function (state, obj, roomId) {
    const room = state.rooms[roomId];
    if (!room || !room.unlocked) return 'Salle fermée.';
    if (obj.location !== 'reserve') return 'L\'objet doit être en réserve.';
    if (obj.condition < Obj.minDisplayCondition(obj)) return 'Trop fragile pour être exposé (état ' + obj.condition + ', minimum ' + Obj.minDisplayCondition(obj) + ') : restaurez-le d\'abord.';
    return null;
  };

  E.place = function (state, objId, roomId, slot) {
    const obj = state.objects[objId];
    const err = E.canDisplay(state, obj, roomId);
    if (err) return { ok: false, error: err };
    const room = state.rooms[roomId];
    if (slot == null) slot = room.vitrines.indexOf(null);
    if (slot < 0 || slot >= room.vitrines.length) return { ok: false, error: 'Aucune vitrine libre dans cette salle.' };
    if (room.vitrines[slot]) E.remove(state, room.vitrines[slot]);
    room.vitrines[slot] = objId;
    Obj.move(state, obj, 'vitrine', 'Exposé : ' + D.ROOMS[roomId].name + ', vitrine ' + (slot + 1) + '.');
    obj.roomId = roomId;
    obj.slot = slot;
    return { ok: true };
  };

  E.remove = function (state, objId, text) {
    const obj = state.objects[objId];
    if (!obj || obj.location !== 'vitrine') return;
    const room = state.rooms[obj.roomId];
    if (room) room.vitrines[obj.slot] = null;
    Obj.move(state, obj, 'reserve', text || 'Retiré de la vitrine, retour en réserve.');
  };

  E.setTheme = (state, roomId, theme) => { state.rooms[roomId].theme = theme || null; };
  E.setLighting = (state, roomId, l) => { state.rooms[roomId].lighting = l; };

  E.expoRooms = (state) => Object.keys(D.ROOMS).filter((k) => ['expo', 'temp'].includes(D.ROOMS[k].kind) && state.rooms[k].unlocked);

  /** Parcours : ordre de visite des salles ouvertes (le hall est toujours en premier). */
  E.normalizeRoute = function (state) {
    const open = E.expoRooms(state);
    state.route = state.route.filter((r) => open.includes(r));
    open.forEach((r) => { if (!state.route.includes(r)) state.route.push(r); });
    return state.route;
  };
  E.moveInRoute = function (state, roomId, dir) {
    const r = E.normalizeRoute(state);
    const i = r.indexOf(roomId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= r.length) return;
    [r[i], r[j]] = [r[j], r[i]];
  };

  /** Analyse d'une salle : score d'attrait et explications lisibles. */
  E.analyzeRoom = function (state, roomId) {
    const room = state.rooms[roomId];
    const def = D.ROOMS[roomId];
    const objs = room.vitrines.filter(Boolean).map((id) => state.objects[id]);
    const notes = [];
    let mult = 1;
    const light = D.LIGHTING[room.lighting];
    if (!objs.length) return { score: 0, mult: 0, objs, notes: [{ t: 'Aucun objet exposé.', s: -1 }], periods: {} };
    const periods = {};
    objs.forEach((o) => { periods[o.period] = (periods[o.period] || 0) + 1; });
    if (room.theme) {
      const match = periods[room.theme] || 0;
      const off = objs.length - match;
      if (match >= 3) { mult *= 1.25; notes.push({ t: 'Thème cohérent (' + D.PERIODS[room.theme].label + ', ' + match + ' objets) : +25 %', s: 1 }); }
      else notes.push({ t: 'Thème « ' + D.PERIODS[room.theme].label + ' » : ajoutez au moins 3 objets de cette période pour un bonus', s: 0 });
      if (off > 0) { mult *= Math.pow(0.85, off); notes.push({ t: off + ' objet(s) hors thème : −' + Math.round((1 - Math.pow(0.85, off)) * 100) + ' %', s: -1 }); }
    } else if (Object.keys(periods).length >= 3 && def.kind !== 'hall') {
      mult *= 0.9; notes.push({ t: 'Salle sans fil conducteur (' + Object.keys(periods).length + ' périodes mélangées) : −10 %. Choisissez un thème.', s: -1 });
    }
    const empty = room.vitrines.length - objs.length;
    if (def.kind !== 'hall' && empty > room.vitrines.length / 2) { mult *= 0.85; notes.push({ t: 'Salle clairsemée (' + empty + ' vitrines vides) : −15 %', s: -1 }); }
    if (light.attract !== 1) notes.push({ t: 'Éclairage ' + light.label.toLowerCase() + ' : ' + (light.attract > 1 ? '+' : '') + Math.round((light.attract - 1) * 100) + ' % d\'attrait', s: light.attract > 1 ? 1 : -1 });
    mult *= light.attract;
    const sensitive = objs.filter((o) => D.MATERIALS[o.mat].light >= 0.5);
    if (sensitive.length && room.lighting !== 'tamise') notes.push({ t: sensitive.length + ' objet(s) sensible(s) à la lumière s\'abîment ici', s: -1 });
    const unstudied = objs.filter((o) => o.studied < 40).length;
    if (unstudied) notes.push({ t: unstudied + ' cartel(s) pauvre(s) : objets peu étudiés', s: -1 });
    const stars = objs.filter((o) => D.RARITY[o.rarity].score >= 3.5).length;
    if (stars) notes.push({ t: stars + ' chef(s)-d\'œuvre exposé(s)', s: 1 });
    const base = objs.reduce((a, o) => a + Obj.appeal(o), 0);
    return { score: base * mult, base, mult, objs, notes, periods };
  };

  /* ---------------- Exposition temporaire ---------------- */
  E.TEMP_COST = 1500;
  E.TEMP_WEEKS = 8;

  E.canStartTemp = function (state, title) {
    if (!state.rooms.temp.unlocked) return 'La salle des expositions temporaires n\'est pas encore ouverte.';
    if (state.tempExpo) return 'Une exposition temporaire est déjà en cours.';
    if (!title || !title.trim()) return 'Donnez un titre à l\'exposition.';
    if (!state.rooms.temp.theme) return 'Choisissez un thème pour l\'exposition.';
    const n = state.rooms.temp.vitrines.filter(Boolean).length;
    if (n < 3) return 'Installez au moins 3 objets dans la salle temporaire.';
    if (state.money < E.TEMP_COST) return 'Fonds insuffisants pour la scénographie (' + ME.fmtMoney(E.TEMP_COST) + ').';
    return null;
  };

  E.startTemp = function (state, title) {
    const err = E.canStartTemp(state, title);
    if (err) return { ok: false, error: err };
    ME.money(state, -E.TEMP_COST, 'Scénographie — « ' + title.trim() + ' »', 'expositions');
    const a = E.analyzeRoom(state, 'temp');
    state.tempExpo = { title: title.trim(), theme: state.rooms.temp.theme, start: state.week, end: state.week + E.TEMP_WEEKS, hype: Math.round(a.score * 10) / 10, visitors: 0, satSum: 0, satN: 0, objIds: state.rooms.temp.vitrines.filter(Boolean) };
    state.tempExpo.objIds.forEach((id) => Obj.addHistory(state, state.objects[id], 'Présenté dans l\'exposition temporaire « ' + title.trim() + ' ».'));
    ME.log(state, 'Inauguration de l\'exposition « ' + title.trim() + ' » ! Elle durera ' + E.TEMP_WEEKS + ' semaines.', 'story');
    return { ok: true };
  };

  E.tickTemp = function (state) {
    const t = state.tempExpo;
    if (!t || state.week < t.end) return null;
    const sat = t.satN ? t.satSum / t.satN : 50;
    const stars = ME.clamp(Math.round(sat / 20), 1, 5);
    state.reputation += stars;
    state.tempHistory.push({ title: t.title, theme: t.theme, start: t.start, end: t.end, visitors: t.visitors, stars });
    state.tempExpo = null;
    ME.log(state, 'L\'exposition « ' + t.title + ' » ferme ses portes : ' + ME.fmtInt(t.visitors) + ' visiteurs, critique ' + '★'.repeat(stars) + '☆'.repeat(5 - stars) + '. Réputation +' + stars + '.', 'story');
    return t;
  };

  /* ---------------- Prêts entrants ---------------- */
  E.loanCatalog = function (state) {
    const list = [];
    for (const k in D.INSTITUTIONS) {
      const inst = D.INSTITUTIONS[k];
      inst.loans.forEach((l) => {
        const busy = state.loansIn.find((x) => x.inst === k && x.type === l.type);
        list.push({ inst: k, type: l.type, fee: l.fee, weeks: l.weeks, minPartner: l.minPartner, partnership: state.permits[k].partnership, available: !busy && state.permits[k].partnership >= l.minPartner, busy: !!busy });
      });
    }
    return list;
  };

  E.requestLoan = function (state, instKey, type) {
    const inst = D.INSTITUTIONS[instKey];
    const l = inst.loans.find((x) => x.type === type);
    if (!l) return { ok: false, error: 'Objet introuvable dans le catalogue.' };
    if (state.permits[instKey].partnership < l.minPartner) return { ok: false, error: 'Partenariat insuffisant avec ' + inst.short + ' (' + l.minPartner + ' requis).' };
    if (state.loansIn.find((x) => x.inst === instKey && x.type === type)) return { ok: false, error: 'Cet objet est déjà prêté au musée.' };
    if (state.money < l.fee) return { ok: false, error: 'Fonds insuffisants.' };
    ME.money(state, -l.fee, 'Frais de prêt — ' + D.TYPES[type].name + ' (' + inst.short + ')', 'expositions');
    state.catalogObjects = state.catalogObjects || {};
    const key = instKey + ':' + type;
    let obj = state.catalogObjects[key] && state.objects[state.catalogObjects[key]];
    if (!obj) {
      obj = Obj.create(state, type, { prefix: 'PRT-', owner: 'preteur', lender: instKey, mode: 'pret', condition: 82, studied: 100, documentation: 90, location: 'rendu', provenance: 'Collections de : ' + inst.name });
      Obj.addHistory(state, obj, 'Inscrit au catalogue des prêts de ' + inst.name + '.');
      state.catalogObjects[key] = obj.id;
    }
    Obj.move(state, obj, 'en-route', 'Prêt accordé par ' + inst.name + ' pour ' + l.weeks + ' semaines. Convoiement en cours.');
    obj.returnWeek = state.week + 1 + l.weeks;
    state.loansIn.push({ objId: obj.id, inst: instKey, type, returnWeek: obj.returnWeek, fee: l.fee });
    ME.log(state, inst.short + ' prête « ' + obj.name + ' » (' + obj.id + ') : arrivée la semaine prochaine.', 'success', { obj: obj.id });
    return { ok: true, obj };
  };

  /** Objets de nos missions conservés par un partenaire : prêt gratuit de 12 semaines. */
  E.requestDeposit = function (state, objId) {
    const obj = state.objects[objId];
    if (!obj || obj.location !== 'depot') return { ok: false, error: 'Objet indisponible.' };
    const inst = D.INSTITUTIONS[obj.lender];
    if (state.permits[obj.lender].partnership < 25) return { ok: false, error: 'Partenariat insuffisant avec ' + inst.short + ' (25 requis).' };
    Obj.move(state, obj, 'en-route', 'Prêt gratuit consenti par ' + inst.name + ' (12 semaines). Convoiement en cours.');
    obj.returnWeek = state.week + 13;
    state.loansIn.push({ objId, inst: obj.lender, type: obj.type, returnWeek: obj.returnWeek, fee: 0, deposit: true });
    ME.log(state, inst.short + ' accepte de prêter « ' + obj.name + ' » (' + obj.id + ').', 'success', { obj: objId });
    return { ok: true };
  };

  /* ---------------- Prêts sortants ---------------- */
  E.loanOutEligible = function (state, offer) {
    return Obj.all(state, (o) => o.owner === 'musee' && ['reserve', 'vitrine'].includes(o.location) && o.period === offer.period && o.condition >= 60 && o.studied >= 40 && D.RARITY[o.rarity].score >= D.RARITY[offer.minRarity].score);
  };

  E.acceptLoanOut = function (state, offerId, objId) {
    const offer = state.loanOffers.find((x) => x.id === offerId);
    const obj = state.objects[objId];
    if (!offer || !obj) return { ok: false, error: 'Offre ou objet introuvable.' };
    if (offer.expires < state.week) return { ok: false, error: 'Cette demande a expiré.' };
    if (!E.loanOutEligible(state, offer).includes(obj)) return { ok: false, error: 'Cet objet ne remplit pas les conditions du prêt (période, rareté, état ≥ 60, étude ≥ 40).' };
    if (obj.location === 'vitrine') E.remove(state, objId, 'Décroché pour un prêt.');
    Obj.move(state, obj, 'pret-sortant', 'Prêté au ' + offer.museum + ' pour ' + offer.weeks + ' semaines (exposition « ' + offer.expo + ' »).');
    obj.loanOut = { museum: offer.museum, returnWeek: state.week + offer.weeks, expo: offer.expo };
    ME.money(state, offer.fee, 'Redevance de prêt — ' + offer.museum, 'prets');
    state.reputation += offer.rep;
    state.loanOffers = state.loanOffers.filter((x) => x.id !== offerId);
    ME.log(state, '« ' + obj.name + ' » (' + obj.id + ') part pour le ' + offer.museum + '. Redevance ' + ME.fmtMoney(offer.fee) + ', réputation +' + offer.rep + '.', 'success', { obj: objId });
    return { ok: true };
  };

  E.tickLoans = function (state) {
    // Arrivées et retours des prêts entrants
    state.loansIn.slice().forEach((l) => {
      const o = state.objects[l.objId];
      if (o.location === 'en-route') {
        Obj.move(state, o, 'reserve', 'Arrivé au musée, constat d\'état réalisé (état ' + o.condition + ').');
      } else if (state.week >= l.returnWeek) {
        if (o.location === 'vitrine') E.remove(state, o.id, 'Décroché : fin du prêt.');
        if (o.location === 'reserve') {
          const inst = D.INSTITUTIONS[l.inst];
          Obj.move(state, o, 'rendu', 'Rendu à ' + inst.name + ' à l\'échéance du prêt.');
          if (l.deposit) Obj.move(state, o, 'depot', 'De retour en dépôt chez ' + inst.name + '.');
          o.returnWeek = null;
          state.loansIn.splice(state.loansIn.indexOf(l), 1);
          state.permits[l.inst].partnership = Math.min(100, state.permits[l.inst].partnership + 2);
          ME.log(state, '« ' + o.name + ' » (' + o.id + ') a été rendu à ' + inst.short + ' en temps voulu.', 'info', { obj: o.id });
        }
      }
    });
    // Retours des prêts sortants
    Object.values(state.objects).forEach((o) => {
      if (o.location === 'pret-sortant' && o.loanOut && state.week >= o.loanOut.returnWeek) {
        Obj.move(state, o, 'reserve', 'Retour du prêt au ' + o.loanOut.museum + '. Constat d\'état : ' + o.condition + '.');
        ME.log(state, '« ' + o.name + ' » (' + o.id + ') est revenu du ' + o.loanOut.museum + '.', 'info', { obj: o.id });
        o.loanOut = null;
      }
    });
    // Nouvelles demandes de prêt d'autres musées
    state.loanOffers = state.loanOffers.filter((x) => x.expires >= state.week);
    if (state.loanOffers.length < 2 && ME.chance(state, 0.22 + state.reputation * 0.004)) {
      const owned = Obj.all(state, (o) => o.owner === 'musee' && ['reserve', 'vitrine'].includes(o.location));
      if (owned.length) {
        const ref = ME.pick(state, owned);
        const minRarity = D.RARITY[ref.rarity].score >= 2 ? 'peuCommun' : 'commun';
        const fee = (minRarity === 'commun' ? 600 : 1400) + ME.randInt(state, 0, 6) * 100;
        const themes = { prehistoire: 'Chasseurs de l\'ère glaciaire', gaule: 'Gaulois, une civilisation retrouvée', egypte: 'Rites d\'éternité', rome: 'Naufrages et commerce antique', medieval: 'Le temps des abbayes', bronze: 'Les îles de marbre' };
        state.loanOffers.push({ id: ME.nextId(state, 'offer', 'D', 3), museum: ME.pick(state, D.BORROWERS), period: ref.period, minRarity, weeks: ME.randInt(state, 6, 10), fee, rep: minRarity === 'commun' ? 1 : 2, expo: themes[ref.period], expires: state.week + 5 });
      }
    }
  };

  /* ---------------- Acquisitions documentées ---------------- */
  E.tickMarket = function (state) {
    state.market = state.market.filter((m) => m.expires >= state.week && !m.sold);
    if (state.market.length < 3 && ME.chance(state, 0.3)) {
      const types = Object.keys(D.TYPES).filter((k) => D.TYPES[k].rarity !== 'exceptionnel');
      const type = ME.pick(state, types);
      const t = D.TYPES[type];
      const lacunaire = ME.chance(state, 0.35);
      const cond = ME.randInt(state, 45, 90);
      const price = Math.round(D.RARITY[t.rarity].value * (0.7 + cond / 150) * (lacunaire ? 0.6 : 1) / 50) * 50;
      state.market.push({
        id: ME.nextId(state, 'lot', 'L', 3), type, seller: ME.pick(state, D.SELLERS), price, condition: cond,
        dossier: lacunaire ? 'lacunaire' : 'complet', verified: false, illicit: lacunaire && ME.chance(state, 0.55),
        expires: state.week + 6,
      });
    }
    // Réclamations différées sur des achats illicites
    Object.values(state.objects).forEach((o) => {
      if (o.claimWeek && state.week >= o.claimWeek && o.owner === 'musee' && o.location !== 'restitue') {
        if (o.location === 'vitrine') E.remove(state, o.id, 'Décroché à la demande des autorités.');
        if (o.location === 'atelier') ME.Conservation.cancel(state, (state.jobs.find((j) => j.objId === o.id) || {}).id);
        if (o.location === 'pret-sortant') return; // sera traité au retour
        if (o.location === 'reserve') {
          ME.Objects.move(state, o, 'restitue', 'Saisi et restitué à son pays d\'origine : l\'objet provenait d\'un pillage récent.');
          o.claimWeek = null;
          state.reputation = Math.max(0, state.reputation - 8);
          ME.log(state, 'Scandale : « ' + o.name + ' » (' + o.id + ') provenait d\'un pillage. Objet restitué, réputation −8.', 'danger', { obj: o.id });
        }
      }
    });
  };

  E.VERIFY_COST = 200;
  E.verifyLot = function (state, lotId) {
    const lot = state.market.find((m) => m.id === lotId);
    if (!lot || lot.verified) return { ok: false, error: 'Rien à vérifier.' };
    if (state.money < E.VERIFY_COST) return { ok: false, error: 'Fonds insuffisants.' };
    ME.money(state, -E.VERIFY_COST, 'Enquête de provenance — lot ' + lot.id, 'acquisitions');
    lot.verified = true;
    if (lot.dossier === 'complet') lot.verdict = 'Historique de propriété complet et vérifié.';
    else lot.verdict = lot.illicit ? 'Alerte : l\'objet figure sur une liste d\'objets volés. Pillage probable.' : 'Lacune bénigne : l\'objet dormait dans un grenier familial depuis 1920, attestations retrouvées.';
    return { ok: true, lot };
  };

  E.reportLot = function (state, lotId) {
    const lot = state.market.find((m) => m.id === lotId);
    if (!lot || !lot.verified || !lot.illicit) return { ok: false };
    state.market = state.market.filter((m) => m !== lot);
    state.reputation += 3;
    ME.log(state, 'Vous signalez le lot ' + lot.id + ' aux autorités : l\'objet sera rendu à son pays. Réputation +3.', 'success');
    return { ok: true };
  };

  E.buyLot = function (state, lotId) {
    const lot = state.market.find((m) => m.id === lotId);
    if (!lot || lot.expires < state.week) return { ok: false, error: 'Lot indisponible.' };
    if (state.money < lot.price) return { ok: false, error: 'Fonds insuffisants.' };
    ME.money(state, -lot.price, 'Acquisition — ' + D.TYPES[lot.type].name + ' (' + lot.seller + ')', 'acquisitions');
    const dossierTxt = lot.verified ? lot.verdict : (lot.dossier === 'complet' ? 'dossier complet' : 'dossier lacunaire, non vérifié');
    const o = Obj.create(state, lot.type, { mode: 'achat', price: lot.price, condition: lot.condition, documentation: lot.dossier === 'complet' ? 70 : 35, location: 'reserve', provenance: 'Acquis auprès de : ' + lot.seller, provenanceDoc: lot.verified && !lot.illicit ? 'verifiee' : lot.dossier });
    Obj.addHistory(state, o, 'Acquis auprès de ' + lot.seller + ' pour ' + ME.fmtMoney(lot.price) + '. Provenance : ' + dossierTxt + '. Enregistré sous le n° ' + o.id + '.');
    if (lot.illicit) o.claimWeek = state.week + ME.randInt(state, 3, 8);
    lot.sold = true;
    state.market = state.market.filter((m) => m !== lot);
    ME.log(state, 'Nouvelle acquisition : « ' + o.name + ' » (' + o.id + ').', 'success', { obj: o.id });
    return { ok: true, obj: o };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Musée & Expéditions — visitors.js
 * Fréquentation et satisfaction : chaque semaine, un échantillon de visiteurs aux intérêts
 * variés parcourt le musée dans l'ordre du parcours. Leurs impressions sont résumées
 * en raisons lisibles (ce qui a plu, ce qui a déçu).
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Obj = ME.Objects;
  const E = ME.Exhibitions;
  const V = (ME.Visitors = {});

  V.SAMPLE = 60;

  V.priceFactor = (price) => ME.clamp(1.35 - (price - 5) * 0.07, 0.3, 1.45);
  V.season = function (week) {
    const w = ((week - 1) % 52) + 1;
    if (w >= 26 && w <= 35) return 1.3;
    if (w >= 48 || w <= 6) return 0.85;
    return 1;
  };
  V.mediation = function (state) {
    const m = state.staff.filter((p) => p.assign && p.assign.kind === 'accueil');
    return m.reduce((a, p) => a + 3 + (p.skills.mediation || 0) * 1.5, 0);
  };

  /** Attrait global du musée (somme des salles du parcours + pièce d'appel). */
  V.attraction = function (state) {
    const route = E.normalizeRoute(state);
    let a = 0;
    const rooms = {};
    ['hall'].concat(route).forEach((r) => {
      const an = E.analyzeRoom(state, r);
      rooms[r] = an;
      a += an.score * (r === 'hall' ? 1.6 : 1);
    });
    if (state.tempExpo) a += state.tempExpo.hype * 1.2;
    return { total: a, rooms };
  };

  V.expectedVisitors = function (state, att) {
    att = att || V.attraction(state);
    const potential = 80 + state.reputation * 5 + att.total * 9 + (state.tempExpo ? 60 : 0);
    const wom = state.lastVisit ? 0.8 + state.lastVisit.satisfaction / 250 : 1;
    return potential * V.priceFactor(state.ticketPrice) * wom * V.season(state.week);
  };

  V.simulate = function (state) {
    const att = V.attraction(state);
    const route = E.normalizeRoute(state);
    const noise = 0.9 + ME.rand(state) * 0.2;
    const total = Math.max(0, Math.round(V.expectedVisitors(state, att) * noise));
    const vitrines = ['hall'].concat(route).reduce((a, r) => a + state.rooms[r].vitrines.length, 0) || 1;
    const crowd = total / (vitrines * 60);
    const med = V.mediation(state);
    const types = Object.keys(D.VISITOR_TYPES);
    const reasons = {};
    const add = (k, sign) => { reasons[k] = reasons[k] || { text: k, n: 0, sign }; reasons[k].n++; };
    const byType = {};
    types.forEach((t) => (byType[t] = { n: 0, sat: 0 }));
    const roomStats = {};
    ['hall'].concat(route).forEach((r) => (roomStats[r] = { joy: 0, n: 0 }));
    const sample = [];
    let satSum = 0;
    let tempSat = 0, tempN = 0;

    for (let i = 0; i < V.SAMPLE; i++) {
      const tk = ME.pickWeighted(state, types, (t) => D.VISITOR_TYPES[t].share);
      const vt = D.VISITOR_TYPES[tk];
      const interest = ME.pick(state, vt.interests);
      let joy = 0;
      let sawInterest = 0, sawStar = false, unstudied = 0, darkRooms = 0;
      const path = ['hall'].concat(route);
      path.forEach((r, idx) => {
        const an = att.rooms[r];
        if (!an || !an.objs.length) return;
        const roomIdx = idx; // le hall compte comme une étape légère
        const fatigue = roomIdx <= vt.stamina ? 1 : Math.pow(0.7, roomIdx - vt.stamina);
        const room = state.rooms[r];
        let lightPref = 1;
        if (vt.likesBright && room.lighting === 'vif') lightPref = 1.1;
        if (vt.likesBright && room.lighting === 'tamise') { lightPref = 0.92; darkRooms++; }
        if (!vt.likesBright && room.lighting === 'vif') lightPref = 0.95;
        let rj = 0;
        an.objs.forEach((o) => {
          const match = o.period === interest;
          if (match) sawInterest++;
          const rs = D.RARITY[o.rarity].score;
          if (rs >= 6) sawStar = true;
          if (o.studied < 40) unstudied++;
          const studyFactor = 1 + vt.careStudy * (o.studied / 100 - 0.4) * 0.6;
          const rareFactor = 1 + vt.careRare * (rs - 1.5) * 0.08;
          rj += Obj.appeal(o) * (match ? 2.1 : 0.75) * studyFactor * rareFactor;
        });
        rj *= an.mult * lightPref * fatigue * (r === 'hall' ? 1.4 : 1);
        roomStats[r].joy += rj;
        roomStats[r].n++;
        joy += rj;
        if (r === 'temp' && state.tempExpo) { tempSat += rj; tempN++; }
      });
      let sat = 12 + 88 * (1 - Math.exp(-joy / 9));
      sat += med;
      if (crowd > 1) { sat -= (crowd - 1) * 12; add('Trop de monde devant les vitrines', -1); }
      const pricePain = Math.max(0, state.ticketPrice * vt.priceMult - 10) * (tk === 'touriste' ? 1.5 : 3);
      if (pricePain > 0) { sat -= pricePain; add('Billet jugé trop cher', -1); }
      if (path.length - 1 > vt.stamina) add('Fatigue en fin de parcours (' + vt.label.toLowerCase() + ')', -1);
      if (sawInterest >= 2) add('A adoré les collections : ' + D.PERIODS[interest].label, 1);
      else if (sawInterest === 0) add('Aurait voulu voir : ' + D.PERIODS[interest].label, -1);
      if (sawStar) add('Émerveillé·e par un chef-d\'œuvre', 1);
      if (vt.careStudy >= 1 && unstudied >= 3) add('Cartels trop pauvres (objets peu étudiés)', -1);
      if (darkRooms >= 2) add('Salles trop sombres pour les ' + vt.label.toLowerCase(), -1);
      if (med > 0 && ME.chance(state, 0.5)) add('Accueil et médiation appréciés', 1);
      sat = ME.clamp(sat, 0, 100);
      satSum += sat;
      byType[tk].n++;
      byType[tk].sat += sat;
      if (i < 16) sample.push({ type: tk, interest, sat: Math.round(sat) });
    }

    const satisfaction = Math.round(satSum / V.SAMPLE);
    const counts = {};
    types.forEach((t) => {
      counts[t] = Math.round(total * byType[t].n / V.SAMPLE);
      byType[t].sat = byType[t].n ? Math.round(byType[t].sat / byType[t].n) : 0;
    });
    if (state.tempExpo) {
      state.tempExpo.visitors += total;
      const ts = tempN ? 100 * (1 - Math.exp(-(tempSat / tempN) / 6)) : 40;
      state.tempExpo.satSum += ts;
      state.tempExpo.satN++;
    }
    const reasonList = Object.values(reasons).sort((a, b) => b.n - a.n).map((r) => ({ text: r.text, pct: Math.round(r.n * 100 / V.SAMPLE), sign: r.sign }));
    const rooms = {};
    Object.keys(roomStats).forEach((r) => { rooms[r] = roomStats[r].n ? Math.round(roomStats[r].joy / roomStats[r].n * 10) / 10 : 0; });
    return { week: state.week, total, counts, satisfaction, byType, reasons: reasonList.slice(0, 8), rooms, crowd: Math.round(crowd * 100) / 100, sample, attraction: Math.round(att.total * 10) / 10 };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Musée & Expéditions — finances.js
 * Billetterie, boutique, dons, subventions, charges, investissements et personnel.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Obj = ME.Objects;
  const F = (ME.Finances = {});

  F.CATS = {
    billetterie: 'Billetterie', boutique: 'Boutique', dons: 'Dons', subventions: 'Subventions', prets: 'Prêts',
    salaires: 'Salaires', entretien: 'Entretien', assurance: 'Assurance', stockage: 'Stockage',
    expeditions: 'Expéditions', expositions: 'Expositions', acquisitions: 'Acquisitions', investissements: 'Investissements', divers: 'Divers',
  };

  /** Billetterie : chaque public paie selon son tarif (scolaires à demi-tarif). */
  F.ticketRevenue = function (state, visit) {
    let r = 0;
    for (const t in visit.counts) r += visit.counts[t] * state.ticketPrice * D.VISITOR_TYPES[t].priceMult;
    return Math.round(r);
  };

  F.shopRevenue = function (state, visit) {
    let r = 0;
    for (const t in visit.counts) r += visit.counts[t] * (0.8 + state.shopLevel * 0.9) * D.VISITOR_TYPES[t].shop;
    return Math.round(r * ME.clamp(visit.satisfaction / 70, 0.4, 1.4));
  };

  F.donations = function (state, visit) {
    let d = Math.round(visit.total * 0.12 * visit.satisfaction / 100);
    let mecene = 0;
    if (state.reputation >= 20 && visit.satisfaction >= 65 && ME.chance(state, 0.08)) mecene = ME.randInt(state, 5, 20) * 100;
    return { d, mecene };
  };

  F.openRooms = (state) => Object.keys(state.rooms).filter((k) => state.rooms[k].unlocked).length;

  F.charges = function (state) {
    const salaries = state.staff.reduce((a, p) => a + p.salary, 0);
    const upkeep = 120 + F.openRooms(state) * 40;
    const exhibited = Obj.all(state, (o) => o.location === 'vitrine');
    const insurance = Math.round(exhibited.reduce((a, o) => a + Obj.value(o), 0) * 0.002);
    const over = Math.max(0, Obj.reserveCount(state) - state.reserveCap);
    const storage = over * 30;
    return { salaries, upkeep, insurance, storage, over };
  };

  F.week = function (state, visit) {
    const ticket = F.ticketRevenue(state, visit);
    const shop = F.shopRevenue(state, visit);
    const don = F.donations(state, visit);
    ME.money(state, ticket, 'Billetterie (' + ME.fmtInt(visit.total) + ' visiteurs)', 'billetterie');
    ME.money(state, shop, 'Boutique', 'boutique');
    if (don.d) ME.money(state, don.d, 'Dons des visiteurs', 'dons');
    if (don.mecene) { ME.money(state, don.mecene, 'Don d\'un mécène enthousiaste', 'dons'); ME.log(state, 'Un mécène, conquis par sa visite, fait un don de ' + ME.fmtMoney(don.mecene) + ' !', 'success'); }
    F.tickGrants(state);
    const c = F.charges(state);
    ME.money(state, -c.salaries, 'Salaires de l\'équipe', 'salaires');
    ME.money(state, -c.upkeep, 'Entretien du bâtiment', 'entretien');
    if (c.insurance) ME.money(state, -c.insurance, 'Assurance des objets exposés', 'assurance');
    if (c.storage) ME.money(state, -c.storage, 'Stockage externe (' + c.over + ' objets hors réserves)', 'stockage');
    const entries = state.ledgerCurrent;
    const totals = {};
    entries.forEach((e) => { totals[e.cat] = (totals[e.cat] || 0) + e.amount; });
    const income = entries.filter((e) => e.amount > 0).reduce((a, e) => a + e.amount, 0);
    const spend = entries.filter((e) => e.amount < 0).reduce((a, e) => a + e.amount, 0);
    const rec = { week: state.week, entries, totals, income, spend, net: income + spend, balance: Math.round(state.money) };
    state.ledger.push(rec);
    if (state.ledger.length > 52) state.ledger.shift();
    state.ledgerCurrent = [];
    return rec;
  };

  /* ---------------- Subventions ---------------- */
  F.grantStatus = function (state, key) {
    const g = state.grants[key];
    if (!g) return { status: 'none' };
    return g;
  };

  F.canApply = function (state, key) {
    const def = D.GRANTS[key];
    const g = state.grants[key];
    if (g && (g.status === 'pending' || g.status === 'active')) return 'Dossier déjà en cours.';
    if (g && g.cooldownUntil > state.week) return 'Nouvelle demande possible à partir de la semaine ' + g.cooldownUntil + '.';
    if (!def.check(state, ME)) return 'Conditions non remplies : ' + def.req + '.';
    return null;
  };

  F.applyGrant = function (state, key) {
    const err = F.canApply(state, key);
    if (err) return { ok: false, error: err };
    const def = D.GRANTS[key];
    state.grants[key] = { status: 'pending', reviewLeft: def.review, weeksLeft: def.weeks, cooldownUntil: 0 };
    ME.log(state, 'Dossier de subvention déposé : ' + def.label + '.', 'info');
    return { ok: true };
  };

  F.tickGrants = function (state) {
    for (const key in state.grants) {
      const g = state.grants[key];
      const def = D.GRANTS[key];
      if (g.status === 'pending') {
        g.reviewLeft--;
        if (g.reviewLeft <= 0) {
          if (def.weeks === 0) {
            ME.money(state, def.amount, 'Subvention : ' + def.label, 'subventions');
            g.status = 'done';
            g.cooldownUntil = state.week + def.cooldown;
            ME.log(state, 'Subvention accordée : ' + def.label + ' (' + ME.fmtMoney(def.amount) + ').', 'success');
          } else {
            g.status = 'active';
            ME.log(state, 'Subvention accordée : ' + def.label + ' (' + ME.fmtMoney(def.amount) + ' par semaine pendant ' + def.weeks + ' semaines).', 'success');
          }
        }
      } else if (g.status === 'active') {
        ME.money(state, def.amount, 'Subvention : ' + def.label, 'subventions');
        g.weeksLeft--;
        if (g.weeksLeft <= 0) { g.status = 'done'; g.cooldownUntil = state.week + def.cooldown; }
      }
    }
  };

  /* ---------------- Investissements ---------------- */
  F.upgradeState = function (state, key) {
    const u = D.UPGRADES[key];
    if (key === 'salle3' || key === 'temp') return { done: state.rooms[key].unlocked, cost: u.cost };
    if (key === 'bench') return { done: state.benches >= u.max, cost: u.cost + (state.benches - 2) * 1500, level: state.benches };
    if (key === 'shop') return { done: state.shopLevel >= u.max, cost: u.cost * state.shopLevel, level: state.shopLevel };
    if (key === 'reserve') return { done: false, cost: u.cost + Math.max(0, (state.reserveCap - 14) / 10) * 1000, level: state.reserveCap };
    return { done: true, cost: 0 };
  };

  F.buyUpgrade = function (state, key) {
    const st = F.upgradeState(state, key);
    if (st.done) return { ok: false, error: 'Déjà au maximum.' };
    if (state.money < st.cost) return { ok: false, error: 'Fonds insuffisants (' + ME.fmtMoney(st.cost) + ').' };
    ME.money(state, -st.cost, D.UPGRADES[key].label, 'investissements');
    if (key === 'salle3' || key === 'temp') { state.rooms[key].unlocked = true; ME.Exhibitions.normalizeRoute(state); }
    if (key === 'bench') state.benches++;
    if (key === 'shop') state.shopLevel++;
    if (key === 'reserve') state.reserveCap += 10;
    ME.log(state, 'Travaux terminés : ' + D.UPGRADES[key].label + '.', 'success');
    return { ok: true };
  };

  /* ---------------- Personnel ---------------- */
  F.hire = function (state, idx) {
    const c = state.candidates[idx];
    if (!c) return { ok: false, error: 'Candidat introuvable.' };
    if (state.staff.length >= 9) return { ok: false, error: 'Équipe complète (9 personnes maximum).' };
    const fee = c.salary * 4;
    if (state.money < fee) return { ok: false, error: 'Fonds insuffisants (frais d\'embauche ' + ME.fmtMoney(fee) + ').' };
    ME.money(state, -fee, 'Recrutement — ' + c.name, 'salaires');
    state.staff.push(ME.State.makeStaff(state, c));
    state.candidates.splice(idx, 1);
    state.hiredNames = (state.hiredNames || []).concat(c.name);
    ME.log(state, c.name + ' (' + c.role.toLowerCase() + ') rejoint l\'équipe.', 'success');
    return { ok: true };
  };

  F.fire = function (state, staffId) {
    const p = state.staff.find((s) => s.id === staffId);
    if (!p) return { ok: false };
    if (p.assign && p.assign.kind !== 'accueil') return { ok: false, error: p.name + ' est en mission ou à l\'atelier.' };
    if (state.staff.length <= 2) return { ok: false, error: 'Le musée a besoin d\'au moins deux personnes.' };
    state.staff = state.staff.filter((s) => s !== p);
    ME.money(state, -p.salary * 2, 'Indemnité de départ — ' + p.name, 'salaires');
    ME.log(state, p.name + ' quitte le musée.', 'info');
    return { ok: true };
  };

  F.toggleAccueil = function (state, staffId) {
    const p = state.staff.find((s) => s.id === staffId);
    if (!p) return { ok: false };
    if (p.assign && p.assign.kind === 'accueil') { p.assign = null; return { ok: true }; }
    if (p.assign) return { ok: false, error: p.name + ' est occupé(e).' };
    p.assign = { kind: 'accueil' };
    return { ok: true };
  };

  F.refreshCandidates = function (state) {
    const hired = new Set((state.hiredNames || []).concat(state.staff.map((s) => s.name)));
    const pool = D.CANDIDATES.filter((c) => !hired.has(c.name));
    const out = [];
    while (pool.length && out.length < 3) out.push(ME.deepClone(pool.splice(ME.randInt(state, 0, pool.length - 1), 1)[0]));
    state.candidates = out;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Musée & Expéditions — sim.js
 * Orchestration d'une semaine de jeu et objectifs de progression.
 */
(function (G) {
  'use strict';
  const ME = G.ME;
  const D = ME.DATA;
  const Sim = (ME.Sim = {});

  const fromField = (o) => ['fouille', 'prospection', 'scientifique'].includes(o.acquisition.mode);
  const hasHist = (o, s) => o.history.some((h) => h.text.indexOf(s) === 0);

  Sim.OBJECTIVES = [
    { key: 'permis', label: 'Obtenir une autorisation de fouille', hint: 'Carte → choisissez un site → « Demander l\'autorisation ».', reward: 500,
      check: (s) => Object.values(s.permits).some((p) => p.status === 'granted') },
    { key: 'expe', label: 'Lancer une première expédition', hint: 'Carte → site autorisé → « Préparer une mission ».', reward: 500,
      check: (s) => s.expeditions.length > 0 },
    { key: 'deballer', label: 'Déballer une découverte au musée', hint: 'Attendez le retour des caisses, puis dégagez l\'objet au pinceau.', reward: 800,
      check: (s) => Object.values(s.objects).some((o) => fromField(o) && o.revealed && ['reserve', 'atelier', 'vitrine'].includes(o.location)) },
    { key: 'restaurer', label: 'Restaurer un objet à l\'atelier', hint: 'Atelier → choisissez un objet abîmé et un restaurateur.', reward: 800,
      check: (s) => Object.values(s.objects).some((o) => hasHist(o, 'Restauration terminée')) },
    { key: 'exposer', label: 'Exposer l\'une de vos découvertes', hint: 'Musée → touchez une salle → placez l\'objet dans une vitrine.', reward: 1000,
      check: (s) => Object.values(s.objects).some((o) => fromField(o) && o.location === 'vitrine') },
    { key: 'etudier', label: 'Étudier une découverte à 100 %', hint: 'Atelier → « Étude scientifique » avec une historienne.', reward: 600,
      check: (s) => Object.values(s.objects).some((o) => fromField(o) && o.studied >= 100) },
    { key: 'theme', label: 'Créer une salle thématique cohérente', hint: 'Choisissez un thème de salle et exposez 3 objets de cette période.', reward: 800,
      check: (s) => Object.keys(s.rooms).some((r) => s.rooms[r].theme && s.rooms[r].vitrines.filter(Boolean).filter((id) => s.objects[id].period === s.rooms[r].theme).length >= 3) },
    { key: 'visiteurs', label: 'Accueillir 3 000 visiteurs au total', hint: 'Un musée attrayant et un prix juste attirent du monde.', reward: 1500,
      check: (s) => s.totalVisitors >= 3000 },
    { key: 'pret', label: 'Exposer un objet prêté par un partenaire', hint: 'Expositions → Prêts : le partenariat ouvre le catalogue.', reward: 600,
      check: (s) => Object.values(s.objects).some((o) => o.owner !== 'musee' && o.location === 'vitrine') },
    { key: 'temporaire', label: 'Inaugurer une exposition temporaire', hint: 'Ouvrez la salle temporaire (Finances → Travaux), puis Expositions.', reward: 2000,
      check: (s) => !!s.tempExpo || s.tempHistory.length > 0 },
    { key: 'fayoum', label: 'Mener une campagne au Fayoum', hint: 'Il faut une réputation de 15 et un camp complet.', reward: 1500,
      check: (s) => s.expeditions.some((e) => e.dest === 'fayoum') },
  ];

  Sim.checkObjectives = function (state) {
    const done = [];
    Sim.OBJECTIVES.forEach((o) => {
      if (!state.objectives[o.key] && o.check(state)) {
        state.objectives[o.key] = state.week;
        ME.money(state, o.reward, 'Objectif atteint : ' + o.label, 'divers');
        state.reputation += 1;
        ME.log(state, 'Objectif atteint : « ' + o.label + ' » (+' + ME.fmtMoney(o.reward) + ', réputation +1).', 'success');
        done.push(o);
      }
    });
    return done;
  };

  /** Avance d'une semaine. Renvoie un rapport synthétique. */
  Sim.advanceWeek = function (state) {
    const report = { week: state.week };
    ME.Expeditions.tickPermits(state);
    report.arrivals = ME.Expeditions.tick(state);
    report.jobsDone = ME.Conservation.tick(state).map((j) => j.objId);
    ME.Exhibitions.tickLoans(state);
    ME.Exhibitions.tickMarket(state);
    const visit = ME.Visitors.simulate(state);
    state.lastVisit = visit;
    state.totalVisitors += visit.total;
    state.visitHistory.push({ week: state.week, total: visit.total, sat: visit.satisfaction });
    if (state.visitHistory.length > 52) state.visitHistory.shift();
    report.visit = visit;
    report.finance = ME.Finances.week(state, visit);
    ME.Conservation.wear(state);
    report.tempEnded = ME.Exhibitions.tickTemp(state);
    // La réputation évolue lentement avec la satisfaction.
