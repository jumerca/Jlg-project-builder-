async function db(){

  if(!('indexedDB' in window)){reject(new Error('Stockage IndexedDB indisponible'));return;}

="display:block;font-size:11px;line-height:1.4;margin-top:5px">${x[2]}</span></span></button>`).join('')}</div>`)}${panel('Couverture & progression',`<div class="panel-pad"><div class="split"><span class="muted t-sm">Population couverte</span><b class="t-sm">${Math.round(game.coverage*100)} %</b></div><div class="progress" style="margin:12px 0 16px"><i style="width:${Math.round(game.coverage*100)}%"></i></div><p class="muted t-sm">La couverture limite ton audience potentielle. Investis pour conquérir de nouveaux territoires.</p><button class="btn btn-outline btn-wide" style="margin-top:15px" data-action="expand">${game.tier<2?'Étendre la couverture ↗':'Couverture maximale atteinte'}</button></div>`)}${panel('Conseil de programmation',`<div class="panel-pad"><p class="muted t-sm">Les audiences tiennent compte des six publics, de l’horaire, de la qualité des émissions, des huit rivaux et de ta couverture.</p><button class="btn btn-outline btn-wide" style="margin-top:14px" data-nav="audience">Analyser les résultats →</button></div>`)}</div></div>`}
function gridPage(){let weekDay=game.day%7;if(ui.day<weekDay)ui.day=weekDay;const past=ui.day<weekDay;let rows=scheduleDay(ui.day).filter(b=>ui.night||b.start<40);const tabs=DAY.map((d,i)=>`<button type="button" data-action="choose-day" data-value="${i}" class="day-btn ${ui.day===i?'current':''} ${i<weekDay?'past':''}"><span>${d}</span><strong>${i<weekDay?'Diffusé':i===weekDay?'Aujourd’hui':'À venir'}</strong></button>`).join('');return `${heading('Grille de programmation','Organise chaque demi-heure, de 06h à 06h.','<span class="chip">48 créneaux / jour</span>')}<div class="day-tabs">${tabs}</div><div class="grid-head"><div><h2 class="section-title">${DAYLONG[ui.day]}</h2><div class="page-sub">${rows.length} programmes · touche un bloc pour le remplacer</div></div><button class="btn btn-tiny btn-outline" data-action="toggle-night">${ui.night?'Masquer':'Voir'} la nuit</button></div>${past?`<div class="alert">Cette journée est terminée, sa programmation est verrouillée.</div>`:''}<div class="show-list" style="margin-top:11px">${rows.map(b=>{const p=E.getProgram(b.programId,game);return `<button type="button" class="air-row" data-action="edit" data-value="${b.start}" ${past?'disabled':''}><span class="air-time">${E.time(b.start)}<span style="display:block;color:#7e93a7;margin-top:5px">${b.length*30} min</span></span><span class="genre-line" style="background:${genreColor(p.genre)}"></span><span class="grow"><span class="air-title ellipsis" style="display:block">${ESC(p.title)}</span><span class="air-sub">${E.GENRES[p.genre]?.name} · qualité ${p.quality}/100</span></span><span class="badge-lock">${past?'✓':'Modifier ›'}</span></button>`}).join('')}</div><div class="panel-pad"><span class="t-xs muted">Remplacer un programme conserve automatiquement une grille sans trous ni chevauchements. Les nouveaux créneaux sont comblés par la continuité d’antenne.</span></div>`}
function studioPage(){const ready=game.productions.filter(x=>x.readyDay<=game.day).length;return `${heading('Studio de production','Développe tes propres formats et construis une identité éditoriale.')}<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('PRODUCTIONS',game.productions.length,'Commandées depuis le début','▣')}${stat('PRÊTES',ready,'Disponibles pour la grille','✦')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>Créer une émission</h3><span class="chip chip-teal">NOUVEAU FORMAT</span></div><div class="panel-pad"><form id="production-form" class="form-grid"><div class="field full"><label for="production-name">Nom de l’émission</label><input id="production-name" class="input" name="title" maxlength="45" placeholder="Ex. Le Grand Défi" required></div><div class="field"><label for="production-genre">Genre</label><select id="production-genre" class="input" name="genre">${Object.entries(E.GENRES).map(([id,g])=>`<option value="${id}">${g.name}</option>`).join('')}</select></div><div class="field"><label for="production-length">Durée</label><select id="production-length" class="input" name="slots"><option value="1">30 min</option><option value="2" selected>60 min</option><option value="3">90 min</option><option value="4">120 min</option></select></div><div class="field full"><label for="production-budget">Budget de production</label><select id="production-budget" class="input" name="budget"><option value="85000">85 000 € — pilote indépendant · 2 j</option><option value="150000" selected>150 000 € — production standard · 3 j</option><option value="280000">280 000 € — grande production · 4 j</option></select></div><div class="full alert">Les budgets élevés améliorent en moyenne la qualité. Le résultat garde une part d’incertitude déterministe. Les frais de production sont déduits à la commande.</div><button class="btn btn-primary full" type="submit">✦ Lancer la production</button></form></div></section>${panel('Tes productions',`<div class="panel-pad" style="display:grid;gap:10px">${game.productions.length?game.productions.slice().reverse().map(p=>`<div class="production-row">${programmeThumb(p)}<div class="grow"><div class="strong t-sm">${ESC(p.title)}</div><div class="muted t-xs" style="margin-top:6px">${E.GENRES[p.genre].name} · ${p.slots*30} min · Qualité ${p.quality}</div></div><span class="chip ${p.readyDay<=game.day?'chip-teal':'chip-gold'}">${p.readyDay<=game.day?'Prête':'Jour '+(p.readyDay+1)}</span></div>`).join(''):`<div class="empty"><div class="empty-icon">✦</div>Aucune émission produite.<br>Crée ton premier programme original.</div>`}</div>`)}</div>`}
function catCards(){let all=E.PROGRAMS.filter(p=>!game.owned.includes(p.id)&&p.genre!=='sport').filter(p=>ui.genre==='all'||p.genre===ui.genre).filter(p=>!ui.query||p.title.toLowerCase().includes(ui.query.toLowerCase()));return `<div class="split" style="margin-bottom:14px"><select class="input" id="cat-genre" style="max-width:220px" aria-label="Filtre genre"><option value="all">Tous les genres</option>${Object.entries(E.GENRES).map(([id,g])=>`<option value="${id}" ${ui.genre===id?'selected':''}>${g.name}</option>`).join('')}</select><span class="muted t-xs">${all.length} offres</span></div><div class="market-list">${all.length?all.slice(0,28).map(p=>`<div class="market-card">${programmeThumb(p)}<div class="programme-info"><h3>${ESC(p.title)}</h3><p>${E.GENRES[p.genre].name} · ${p.slots*30} min · Qualité ${p.quality}/100</p><div class="t-xs gold" style="margin-top:7px">Licence : ${EUR(p.licensePrice)}</div></div><button class="btn btn-tiny btn-outline" data-action="acquire" data-value="${p.id}" ${game.cash<p.licensePrice?'disabled':''}>Acheter</button></div>`).join(''):`<div class="empty">Aucun programme dans cette sélection.</div>`}</div><p class="muted t-xs" style="margin-top:12px">Catalogue simplifié : 72 titres fictifs. Les droits achetés deviennent programmables.</p>`}
function adCards(){return `<div class="alert" style="margin-bottom:12px">Les contrats paient les impressions réellement diffusées. Maximum 3 campagnes simultanées ; une pénalité peut s’appliquer si la cible n’est pas atteinte.</div><div class="market-list">${E.ADVERTISERS.map(a=>{const active=game.campaigns.find(c=>c.offerId===a.id&&c.status==='active');return `<div class="market-card"><div class="rank-icon" style="background:#23516a">◎</div><div class="programme-info"><h3>${a.name}</h3><p>Public ${E.SEGMENTS[a.segment]} · ${a.cpm} € CPM · ${a.duration} j</p><div class="t-xs gold" style="margin-top:7px">Plafond ${EUR(a.budget)} · Objectif ${(a.target/1e6).toFixed(1)} M impr.</div>${active?`<div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,active.delivered/active.target*100)}%"></i></div>`:''}</div><button class="btn btn-tiny ${active?'btn-outline':'btn-primary'}" data-action="sign-ad" data-value="${a.id}" ${active?'disabled':''}>${active?'En cours':'Signer'}</button></div>`}).join('')}</div>`}
function sportsCards(){return `<div class="alert" style="margin-bottom:12px">Droits sportifs fictifs, enchères scellées face aux chaînes rivales. Chaque direct doit respecter son jour et son horaire.</div><div class="market-list">${E.SPORTS.map(s=>{const owned=game.sportsRights.find(r=>r.id===s.id),lost=game.sportsLost.includes(s.id);return `<div class="market-card"><div class="rank-icon" style="background:#164f4a">⚑</div><div class="programme-info"><h3>${ESC(s.title)}</h3><p>${DAYLONG[s.weekday]} ${E.time(s.slot)} · ${s.duration*30} min · ${s.airings} diffusions</p><div class="t-xs gold" style="margin-top:7px">Prix de réserve : ${EUR(s.price)}</div></div><button class="btn btn-tiny ${owned?'btn-outline':'btn-primary'}" data-action="sport-bid" data-value="${s.id}" ${owned||lost?'disabled':''}>${owned?'Acquis':lost?'Perdu':'Enchérir'}</button></div>`}).join('')}</div>`}
function expansionCard(){return `<div class="panel panel-pad"><h2 class="section-title">Développer la diffusion</h2><p class="muted t-sm" style="margin-top:12px">Ta chaîne couvre actuellement ${Math.round(game.coverage*100)} % du marché fictif. Investir étend ta portée, mais augmente les charges de diffusion.</p><div class="progress" style="margin:19px 0"><i style="width:${game.coverage*100}%"></i></div><div class="market-card"><div class="rank-icon" style="background:#205f60">↗</div><div class="grow"><h3>${['Couverture régionale','Couverture nationale','Réseau complet'][game.tier]}</h3><p>${['Passer à 38 % pour 1,2 M€','Passer à 84 % pour 5,5 M€','Le réseau national est déployé.'][game.tier]}</p></div><button class="btn btn-primary" data-action="expand" ${game.tier===2?'disabled':''}>Investir</button></div><div class="market-card" style="margin-top:10px"><div class="rank-icon" style="background:#205f60">✦</div><div class="grow"><h3>Campagne de promotion</h3><p>120 000 € · bonus de notoriété sur 7 jours</p></div><button class="btn btn-outline" data-action="marketing" ${game.cash<120000?'disabled':''}>Promouvoir</button></div></div>`}
function marketPage(){const tabs=[['catalogue','Catalogue'],['pub','Publicités'],['sports','Droits sportifs'],['develop','Développement']];return `${heading('Marché & négociations','Acquiers des programmes, signe des publicités et décroche les grands directs.')}<div class="market-tabs">${tabs.map(([v,t])=>`<button class="market-tab ${ui.market===v?'selected':''}" data-action="market-tab" data-value="${v}">${t}</button>`).join('')}</div>${ui.market==='catalogue'?catCards():ui.market==='pub'?adCards():ui.market==='sports'?sportsCards():expansionCard()}`}
function audiencePage(){const report=currentReport();if(!report)return `${heading('Audiences','Analyse les performances réelles de ta chaîne.')}<div class="empty panel"><div class="empty-icon">⌁</div>Diffuse une première journée pour débloquer les rapports.</div>`;
 const max=Math.max(5,...report.slots.map(r=>r.share))*1.13;const best=[...report.shows].sort((a,b)=>b.share-a.share).slice(0,6);return `${heading('Audiences','Les statistiques proviennent directement des téléspectateurs simulés.')}<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('PART NATIONALE',pct(report.share),'Toutes chaînes et Autres','⌁')}${stat('PUBLIC MOYEN',new Intl.NumberFormat('fr-FR').format(report.viewers),'Téléspectateurs / demi-heure','◉')}</div>${panel('Courbe d’audience · Dernière journée',`<div class="panel-pad"><div style="display:flex;align-items:end;height:168px;gap:2px">${report.slots.map((s,i)=>`<div title="${s.hour}: ${pct(s.share)}" style="flex:1;min-width:1px;background:linear-gradient(180deg,#4cdec3,#16697b);height:${Math.max(2,s.share/max*100)}%;border-radius:3px 3px 0 0"></div>`).join('')}</div><div class="split muted t-xs" style="margin-top:9px"><span>06:00</span><span>12:00</span><span>18:00</span><span>00:00</span><span>06:00</span></div></div>`,'48 créneaux de 30 min')}<div style="height:15px"></div>${panel('Émissions les plus performantes',`<div class="table-scroll"><table class="data-table"><thead><tr><th>Programme</th><th>Horaire</th><th>Audience moy.</th><th>Part</th></tr></thead><tbody>${best.map(p=>`<tr><td>${ESC(p.title)}</td><td>${E.time(p.start)}</td><td>${new Intl.NumberFormat('fr-FR').format(p.viewers)}</td><td class="positive strong">${pct(p.share)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="panel-pad muted t-xs">Marché fictif simulé, et non mesure réelle d’audience. Contrôle de conservation du marché : ${report.invariantError===0?'48 × 6 segments conformes':'anomalies détectées : '+report.invariantError}.</div>`}
function financePage(){const report=currentReport();const seven=game.reports.slice(-7),rev=seven.reduce((x,y)=>x+y.revenue,0),cost=seven.reduce((x,y)=>x+y.cost,0);return `${heading('Finances','Contrôle des recettes, coûts et engagements.')}<div class="stats">${stat('SOLDE BANCAIRE',EUR(game.cash),'Trésorerie disponible','◈')}${stat('RECETTES / 7 J',EUR(rev),'Publicité vendue & remplissage','↗')}${stat('CHARGES / 7 J',EUR(cost),'Diffusion et programmes','↘')}${stat('RÉSULTAT / 7 J',EUR(rev-cost),'Hors acquisitions ponctuelles','▥')}</div><div class="dashboard-grid">${panel('Dernières opérations',`<div class="panel-pad">${game.ledger.filter(x=>x.company==='player').length?game.ledger.filter(x=>x.company==='player').slice(-16).reverse().map(l=>`<div class="ledger-row"><span class="grow">J${l.day+1} · ${ESC(l.category)}</span><strong class="${l.amount>=0?'positive':'negative'}">${l.amount>0?'+':''}${euro(l.amount)}</strong></div>`).join(''):`<div class="empty">Aucune écriture comptable.</div>`}</div>`)}${panel('Contrats publicitaires',`<div class="panel-pad" style="display:grid;gap:13px">${game.campaigns.length?game.campaigns.slice().reverse().map(c=>`<div><div class="split"><b class="t-sm">${c.advertiser}</b><span class="chip ${c.status==='active'?'chip-teal':''}">${c.status==='active'?'Actif':'Terminé'}</span></div><div class="split muted t-xs" style="margin:8px 0"><span>${EUR(c.earned)} facturés</span><span>${pct(100*c.delivered/c.target)} de l’objectif</span></div><div class="progress"><i style="width:${Math.min(100,100*c.delivered/c.target)}%"></i></div></div>`).join(''):`<div class="empty">Aucun contrat signé.<br>Va au marché pour négocier.</div>`}<button class="btn btn-outline btn-wide" data-action="go-ads">Trouver des annonceurs →</button></div>`)}</div>`}
function rivalsPage(){const rank=rankData();return `${heading('Guerre des chaînes','Huit adversaires, huit lignes éditoriales et une même simulation.')}<div class="panel"><div class="panel-title"><h3>Classement d’audience</h3><span class="muted t-xs">${currentReport()?'Dernière journée':'Simuler pour classer'}</span></div>${rank?rank.map((r,i)=>`<div class="ranking ${r.id==='player'?'me':''}"><span class="ranknum">${i+1}</span><span class="rank-icon" style="background:${r.color}">${r.name.slice(0,1)}</span><div class="grow"><div class="strong t-sm">${ESC(r.name)} ${r.id==='player'?'<span class="chip chip-teal">TOI</span>':''}</div><div class="muted t-xs" style="margin-top:5px">${r.id==='player'?'Chaîne indépendante':game.rivals.find(c=>c.id===r.id)?.policy}</div></div><span class="rank-share">${pct(r.share)}</span></div>`).join(''):`<div class="empty">Le classement sera disponible après la première diffusion.</div>`}</div><div style="height:16px"></div>${panel('Profils des groupes rivaux',`<div class="cards-grid panel-pad">${game.rivals.map(r=>`<div class="programme-card"><span class="rank-icon" style="background:${r.color}">${r.name[0]}</span><div class="programme-info"><div class="programme-title">${r.name}</div><div class="programme-detail">${r.policy} · Couverture ${Math.round(r.coverage*100)} %</div><div class="programme-detail">Trésorerie : ${EUR(r.cash)}</div></div></div>`).join('')}</div>`)}`}
function morePage(){return `${heading('Administration','Données, rapports et paramètres de carrière.')}<div class="more-menu"><button class="more-link" data-nav="audience"><span>⌁</span>Rapports d’audience</button><button class="more-link" data-nav="finance"><span>◈</span>Finances & contrats</button><button class="more-link" data-nav="rivals"><span>♜</span>Classement & rivaux</button><button class="more-link" data-action="open-save"><span>▣</span>Sauvegarder / charger</button><button class="more-link" data-action="export"><span>⇩</span>Exporter ma carrière</button><button class="more-link" data-action="open-import"><span>⇧</span>Importer une carrière</button></div><div style="height:17px"></div>${panel('Installation & confidentialité',`<div class="panel-pad"><p class="muted t-sm">Version jouable 0.3 · ${game.reports.length} journées simulées. La partie est stockée dans ce navigateur. Une exportation JSON permet d’en conserver une copie.</p><div class="flex wrap gap8" style="margin-top:15px"><button class="btn btn-outline" data-action="install">Installer le jeu</button><button class="btn btn-outline" data-action="new-game">Nouvelle carrière</button></div><p class="muted t-xs" style="margin-top:15px">Installation PWA disponible après hébergement HTTPS compatible. Sur un fichier local, ouvre simplement la version autonome dans le navigateur.</p>${storageWarning?'<div class="alert alert-red">Sauvegarde locale défaillante, export nécessaire.</div>':''}</div>`)}`}
function page(){return {dashboard:dashboard,grid:gridPage,studio:studioPage,market:marketPage,audience:audiencePage,finance:financePage,rivals:rivalsPage,more:morePage}[ui.tab]?.()||dashboard()}

 case 'install':if(installPrompt){installPrompt.prompt();installPrompt=null}else toast('Utilise le menu du navigateur → Installer l’application, après déploiement HTTPS.');break;case 'new-game':ui.modal='new';render();break;case 'reset-confirm':game=null;ui.modal=null;render();break;

const v02OriginalHandleClick = handleClick;
handleClick = async function v02HandleClick(ev) {
  const button = ev.target.closest('[data-action]');
  if (button && !button.disabled) {
    const action = button.dataset.action;
    const value = button.dataset.value;
    if (action === 'period') { ui.period = value; render(); return; }
    if (action === 'auto-plan') { ui.modal = 'auto-plan'; render(); return; }
    if (action === 'auto-confirm') {
      const result = E.autoPlan(game, ui.day, value);
      if (result.error) { toast(result.error, true); return; }
      ui.modal = null;
      setGame(result.state);
      toast('Grille du ' + DAYLONG[ui.day] + ' reconstruite : 24 heures couvertes.');
      return;
    }
    if (action === 'copy-next') {
      const result = E.copyDay(game, ui.day);
      if (result.error) { toast(result.error, true); return; }
      const targetDay = ui.day + 1;
      ui.day = targetDay;
      setGame(result.state);
      toast('Grille copiée au ' + DAYLONG[targetDay] + '.');
      return;
    }
  }
  return v02OriginalHandleClick(ev);
};

async function v131DeleteSave(id){
 if(!['auto','slot1','slot2','slot3'].includes(id))throw Error('Emplacement invalide.');
 const earlier=saveQueues.get(id)||Promise.resolve();
 const deletion=earlier.catch(()=>{}).then(async()=>{
  const marker={id,data:null,deleted:true,savedAt:new Date().toISOString()};
  let localOk=false,dbOk=false;
  try{localStorage.setItem('tvt-'+id,JSON.stringify(marker));localOk=true;}catch(e){console.warn('Suppression secours local',e);}
  try{
   const conn=await db();
   try{
    await Promise.race([new Promise((resolve,reject)=>{
     const tx=conn.transaction('saves','readwrite');
     tx.objectStore('saves').delete(id);
     tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
    }),new Promise((_,reject)=>setTimeout(()=>reject(Error('Stockage indisponible')),4500))]);
    dbOk=true;
   }finally{conn.close();}
  }catch(e){console.warn('Suppression IndexedDB',e);}
  if(dbOk&&localOk){try{localStorage.removeItem('tvt-'+id);}catch(e){console.warn(e);}}
  if(!localOk&&!dbOk)throw Error('La suppression n’a pas pu être enregistrée.');
  return true;
 });
 saveQueues.set(id,deletion);
 return deletion;
}

const V10_POLICIES={
 equilibre:{name:'Équilibre',icon:'◇',tag:'Protéger la chaîne',desc:'Aucun surcoût quotidien. Objectif : préserver l’audience et la trésorerie.'},
 conquete:{name:'Conquête',icon:'↗',tag:'Gagner des publics',desc:'18 000 € par jour de promotion. Bonus de visibilité réel dans le calcul d’audience.'},
 rentabilite:{name:'Rentabilité',icon:'◈',tag:'Protéger la marge',desc:'Optimisation des dépenses de diffusion, jusqu’à 5 % des coûts par jour.'},
 qualite:{name:'Qualité',icon:'✦',tag:'Construire une marque',desc:'12 000 € par jour pour la recherche éditoriale. Effet progressif sur la réputation.'}
};
const v10Round=n=>Math.round(n);
const v10Clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const v10Money=n=>EUR(v10Round(n));

function v10Initialize(state){
 if(!state || !Array.isArray(state.reports))return state;
 if(!state.v10 || typeof state.v10!=='object')state.v10={brand:50,records:[],opportunities:[],cycle:null};
 const v=state.v10;
 v.brand=v10Clamp(Number.isFinite(v.brand)?v.brand:50,0,100);
 if(!Array.isArray(v.records))v.records=[];
 if(!Array.isArray(v.opportunities))v.opportunities=[];
 const index=Math.floor(state.day/28);
 if(!v.cycle || v.cycle.index!==index){
  const recent=state.reports.slice(-7);
  const avg=recent.length?recent.reduce((n,r)=>n+r.share,0)/recent.length:1.8;
  v.cycle={index,startDay:state.day,endDay:index*28+27,policy:'equilibre',locked:false,targetShare:Math.round(Math.max(.8,avg+0.08)*100)/100,days:[],monthStartCash:state.cash};
 }
 // Chaque semaine crée au plus une occasion réelle, aussi pour les carrières anciennes.
 if(state.day>=7 && state.day%7===0){
  const week=Math.floor(state.day/7);
  if(!v.opportunities.some(o=>o.week===week)){
   const names=['Opération nouveaux publics','Coup de projecteur éditorial','Rencontre avec les annonceurs','Rentrée des programmes','Campagne de fidélisation','Promotion en prime time'];
   const kind=Math.floor(E.noise(state.seed,'v10-event',week)*names.length);
   v.opportunities.unshift({week,day:state.day,kind,status:'pending'});
  }
 }
 v.opportunities=v.opportunities.filter(o=>state.day-o.day<=21).slice(0,14);
 return state;
}
E.ensureV10=v10Initialize;
E.V10_POLICIES=V10_POLICIES;
E.setV10Policy=function(source,policy){
 if(!V10_POLICIES[policy])return {error:'Mandat inconnu.'};
 const s=structuredClone(source);v10Initialize(s);
 if(s.v10.cycle.locked)return {error:'Ce mandat est engagé jusqu’à la fin de la période. Un nouveau choix sera possible le mois suivant.'};
 s.v10.cycle.policy=policy;
 s.directorNotes||=[];s.directorNotes.unshift('Mandat de direction : '+V10_POLICIES[policy].name+' pour la période '+(s.v10.cycle.index+1)+'.');
 return {state:s};
};
E.v10EventOffer=function(source,week){
 v10Initialize(source);
 const o=source.v10.opportunities.find(x=>x.week===week);
 if(!o)return null;
 const spec=[
  ['Opération nouveaux publics','Investir 65 000 € dans la promotion pour toucher un public plus large pendant cinq jours.',65000,'marketing'],
  ['Coup de projecteur éditorial','Investir 40 000 € dans l’image et les programmes de ta chaîne.',40000,'reputation'],
  ['Rencontre avec les annonceurs','Investir 30 000 € dans les relations commerciales et la visibilité de l’antenne.',30000,'marketing'],
  ['Rentrée des programmes','Financer une campagne de lancement d’émissions à hauteur de 45 000 €.',45000,'marketing'],
  ['Campagne de fidélisation','Investir 25 000 € dans la fidélité des téléspectateurs.',25000,'reputation'],
  ['Promotion en prime time','Lancer un dispositif publicitaire de 70 000 € avant les grandes soirées.',70000,'marketing']
 ][o.kind];
 return {...o,title:spec[0],description:spec[1],cost:spec[2],effect:spec[3],focus:v10SafeGenre(source.focus)};

E.resolveV10Event=function(source,week,accept){
 const s=structuredClone(source);v10Initialize(s);
 const offer=E.v10EventOffer(s,week);
 if(!offer||offer.status!=='pending')return {error:'Cette opportunité a déjà été traitée ou n’est plus disponible.'};
 if(s.day>offer.day+6)return {error:'Cette opportunité est expirée.'};
 if(accept&&s.cash<offer.cost)return {error:'Trésorerie insuffisante : mieux vaut décliner l’opération.'};
 const row=s.v10.opportunities.find(x=>x.week===week);
 row.status=accept?'accepted':'declined';row.resolvedDay=s.day;
 if(accept){
  E.transaction(s,`v10-event-${week}`,'Investissement événement éditorial',-offer.cost,s.day);
  if(offer.effect==='marketing')s.marketingUntil=Math.max(s.marketingUntil,s.day+4);
  else s.reputation=v10Clamp(s.reputation+.018,.05,1);
  s.v10.brand=v10Clamp(s.v10.brand+(offer.effect==='reputation'?5:2),0,100);
 }
 s.directorNotes||=[];
 s.directorNotes.unshift(`${offer.title} : ${accept?'investissement de '+v10Money(offer.cost)+' approuvé':'offre refusée sans coût'}.`);
 return {state:s,accepted:accept,offer};
};
E.getV10Board=function(source){
 v10Initialize(source);
 const c=source.v10.cycle;const days=c.days||[],history=source.v10.records;
 const share=days.length?days.reduce((n,r)=>n+r.share,0)/days.length:null;
 const profit=days.reduce((n,r)=>n+r.profit,0);
 const revenue=days.reduce((n,r)=>n+r.revenue,0);
 const last=source.reports.slice(-7);
 const recent=last.length?last.reduce((n,r)=>n+r.share,0)/last.length:null;
 return {cycle:c,days:days.length,share,profit,revenue,recent,brand:source.v10.brand,
  opportunities:source.v10.opportunities.filter(o=>o.status==='pending'&&source.day<=o.day+6),
  records:history.slice(-8).reverse(),rivals:E.getCompetitionOverview(source).rivals.slice(0,3)};
};
E.simulateDay=function(source){
 const work=structuredClone(source);v10Initialize(work);
 const cycle=work.v10.cycle;
 cycle.locked=true;
 const selected=cycle.policy;
 if(selected==='conquete')work.marketingUntil=Math.max(work.marketingUntil,work.day);
 const output=v10OldSimulate(work);
 if(output.error)return output;
 const s=output.state,report=output.report;
 // Le jour vient d’avancer : conserver le mandat jusqu’à son dernier bilan.
 let delta=0;
 if(selected==='conquete'){
  const cost=18000;
  if(E.transaction(s,`v10-conquest-${report.day}`,'Mandat Conquête : publicité ciblée',-cost,report.day)){
   report.cost+=cost;report.profit-=cost;delta-=cost;
  }
 }else if(selected==='rentabilite'){
  const saving=Math.min(18000,Math.max(0,v10Round(report.cost*.05)));
  if(saving&&E.transaction(s,`v10-savings-${report.day}`,'Mandat Rentabilité : optimisation de production',saving,report.day)){
   report.cost-=saving;report.profit+=saving;delta+=saving;
  }
 }else if(selected==='qualite'){
  const cost=12000;
  if(E.transaction(s,`v10-quality-${report.day}`,'Mandat Qualité : rédaction et recherche',-cost,report.day)){
   report.cost+=cost;report.profit-=cost;delta-=cost;
   const quality=(report.shows||[]).length?report.shows.reduce((n,x)=>n+(E.getProgram(x.programId,s)?.quality||50),0)/report.shows.length:50;
   if(quality>=65)s.reputation=v10Clamp(s.reputation+.002,.05,1);
  }
 }
 report.cash=s.cash;
 const brandMove=v10Clamp((report.share-2)*.27,-1.4,1.4)+(selected==='qualite'?.35:0);
 s.v10.brand=v10Clamp(Math.round((s.v10.brand+brandMove)*10)/10,0,100);
 const current=s.v10.cycle;
 current.days.push({day:report.day,share:report.share,profit:report.profit,revenue:report.revenue,delta,genres:[...new Set(report.shows.map(x=>x.genre))]});
 if(report.day===current.endDay){
  const ds=current.days,avg=ds.reduce((n,x)=>n+x.share,0)/Math.max(1,ds.length);
  const net=ds.reduce((n,x)=>n+x.profit,0);
  const genres=new Set(ds.flatMap(x=>x.genres));
  const pass=selected==='conquete'?avg>=current.targetShare:
   selected==='rentabilite'?net>=0:
   selected==='qualite'?genres.size>=3&&s.reputation>=.21:
   net>=-Math.max(400000,ds.length*20000)&&avg>=current.targetShare*.75;
  const reward=pass?({equilibre:45000,conquete:80000,rentabilite:65000,qualite:60000}[selected]):0;
  if(reward&&E.transaction(s,`v10-month-reward-${current.index}`,'Prime de mandat '+V10_POLICIES[selected].name,reward,report.day)){
   report.revenue+=reward;report.profit+=reward;report.cash=s.cash;
  }
  const record={index:current.index,day:report.day,policy:selected,share:avg,profit:net+reward,genres:genres.size,reward,passed:pass,brand:s.v10.brand};
  s.v10.records.push(record);
  s.v10.records=s.v10.records.slice(-24);
  s.directorNotes||=[];
  s.directorNotes.unshift(`Bilan période ${current.index+1} : ${pass?'objectif atteint':'objectif manqué'} · ${v10Num(avg)} % d’audience · ${v10Money(net+reward)} de résultat.`);
  s.v10.cycle=null;
  v10Initialize(s);
 }
 return {state:s,report};
};

const v11Years=[1,2,3,5],v11Y=365;

const v11Clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

E.talentOffer=function(s,id,days,ratio=100){

 if(!base||ratio<70||ratio>135)return {error:'Offre invalide.'};
 const signing=Math.round(base.cost*(.66+.055*yrs)),salary=Math.round(base.salary*ratio/100);
 const chance=v11Clamp(57+(ratio-90)*1.1-(yrs-1)*3-(base.popularity||60)*.08,15,97);
 return {base,days:Number(days),salary,signing,years:yrs,accepted:E.noise('v11-hire',s.seed,id,s.day,days,ratio)*100<chance,threshold:chance};
};
E.negotiateTalent=function(state,id,days,ratio){
 if(!v11ValidDays(days))return v11OriginalHire(state,id,days,ratio);
 const offer=E.talentOffer(state,id,days,ratio);if(offer.error)return offer;
 if(state.talents?.some(t=>t.id===id)||state.rivals.some(r=>(r.talents||[]).some(t=>t.id===id)))return {error:'Personnalité déjà sous contrat.'};
 if(state.cash<offer.signing+offer.salary*7)return {error:'Budget insuffisant pour la prime et les premiers salaires.'};
 const s=structuredClone(state);s.contractHistory||=[];
 s.contractHistory.unshift({day:s.day,type:'talent',title:offer.base.name,accepted:offer.accepted,days:Number(days),years:offer.years,salary:offer.salary,signing:offer.signing});
 if(!offer.accepted)return {state:s,accepted:false};
 s.talents||=[];s.talents.push({...offer.base,salary:offer.salary,signedSalary:offer.salary,startDay:s.day,contractEnd:s.day+Number(days),contractYears:offer.years,fatigue:0,restUntil:-1});
 E.transaction(s,'v11-hire-'+id+'-'+s.day,'Recrutement '+offer.base.name,-offer.signing,s.day);
 return {state:s,accepted:true};
};
E.renewTalent=function(state,id,days,ratio){
 if(!v11ValidDays(days))return v11OriginalRenew(state,id,days,ratio);
 const t=state.talents?.find(t=>t.id===id),base=E.HOSTS.find(t=>t.id===id),years=Number(days)/365;
 if(!t||!base||Number(ratio)<70||Number(ratio)>135)return {error:'Renouvellement impossible.'};
 const salary=Math.round(base.salary*Number(ratio)/100),bonus=Math.round(base.cost*(.20+years*.055));
 if(state.cash<bonus+salary*7)return {error:'Trésorerie insuffisante.'};
 const chance=v11Clamp(52+(ratio-90)*1.1-years*2-(t.fatigue||0)*.10,12,97);
 const accepted=E.noise('v11-renew',state.seed,id,state.day,days,ratio)*100<chance;
 const s=structuredClone(state);s.contractHistory||=[];
 s.contractHistory.unshift({day:s.day,type:'renouvellement',title:base.name,accepted,years,days:Number(days),salary,signing:bonus});
 if(accepted){

const v11OldLicenseOffer=E.licenseOffer,v11OldLicense=E.licenseContent;
E.licenseOffer=function(s,id,days){
 if(!v11ValidDays(days))return v11OldLicenseOffer(s,id,days);
 const p=E.ALL[id];if(!p)return {error:'Contenu introuvable.'};
 const years=Number(days)/365,annual=Math.round(p.licensePrice*(1.5+(p.quality||65)/180));
 return {program:p,days:Number(days),years,annual,cost:v11Cost(annual,years)};
};
E.licenseContent=function(state,id,days){
 if(!v11ValidDays(days))return v11OldLicense(state,id,days);
 const offer=E.licenseOffer(state,id,days);if(offer.error)return offer;
 if(state.owned.includes(id)&&!state.licenseEnds?.[id])return {error:'Programme déjà détenu sans échéance.'};
 if(state.cash<offer.cost)return {error:'Trésorerie insuffisante.'};
 const s=structuredClone(state);s.licenseEnds||={};s.contractHistory||=[];
 if(!s.owned.includes(id))s.owned.push(id);
 s.licenseEnds[id]=Math.max(s.day,s.licenseEnds[id]||s.day)+offer.days;
 E.transaction(s,'v11-license-'+id+'-'+s.day,'Licence '+offer.years+' an(s) : '+offer.program.title,-offer.cost,s.day);
 s.contractHistory.unshift({day:s.day,type:'licence',title:offer.program.title,days:offer.days,years:offer.years,signing:offer.cost,accepted:true});
 return {state:s};

// Droit de retransmission : enchère annuelle puis paiement intégral de la durée.
E.bidSportYears=function(state,id,years,bid){
 years=Number(years);bid=Number(bid);
 const lot=E.SPORTS.find(x=>x.id===id);
 if(!lot||!v11Years.includes(years)||!Number.isFinite(bid)||bid<lot.price||bid>lot.price*5)return {error:'Durée ou offre invalide.'};
 const total=v11Cost(bid,years);
 if(state.cash<total)return {error:'Budget insuffisant pour régler toutes les années.'};
 const own=state.sportsRights?.find(r=>r.id===id&&r.endDay>=state.day);
 if(own){
  const s=structuredClone(state);const r=s.sportsRights.find(x=>x.id===id);
  r.endDay+=years*365;r.contractYears=(r.contractYears||1)+years;r.totalPaid=(r.totalPaid||0)+total;
  E.transaction(s,'v11-sport-renew-'+id+'-'+s.day,'Prolongation droits : '+lot.title,-total,s.day);
  s.contractHistory||=[];s.contractHistory.unshift({day:s.day,type:'retransmission',title:r.title,days:years*365,years,signing:total,accepted:true});
  return {state:s,win:true,renewed:true};
 }
 const result=E.bidSport(state,id,bid);
 if(result.error||!result.win)return result;
 const s=result.state,r=s.sportsRights.find(x=>x.id===id);
 r.startDay=s.day;r.seasonStart=s.day;r.seasonIndex=0;r.contractYears=years;r.annualFee=bid;r.totalPaid=total;r.endDay=s.day+years*365-1;
 if(total>bid)E.transaction(s,'v11-sport-years-'+id,'Coût des années supplémentaires : '+lot.title,-(total-bid),s.day);
 s.contractHistory||=[];s.contractHistory.unshift({day:s.day,type:'retransmission',title:r.title,days:years*365,years,signing:total,accepted:true});
 return {...result,state:s};
};
const v11OldSim=E.simulateDay;

 for(const r of s.sportsRights||[]){
  if(!r.contractYears||s.day>r.endDay)continue;
  const season=Math.floor((s.day-(r.seasonStart??r.startDay??s.day))/365);
  if(season>(r.seasonIndex||0)){r.used=0;r.seasonIndex=season;}
 }
 return v11OldSim(s);
};
const v11PreviousBidYears=E.bidSportYears;
E.bidSportYears=function(state,id,years,bid){
 const outdated=(state.sportsRights||[]).some(r=>r.id===id&&r.endDay<state.day);
 if(!outdated)return v11PreviousBidYears(state,id,years,bid);
 const clean=structuredClone(state);
 clean.sportsRights=clean.sportsRights.filter(r=>r.id!==id||r.endDay>=state.day);

/* TV Network Tycoon V1.4 — Mercato des animateurs et rentrées annuelles */
const V14_PLANS={
sobre:{name:'Rentrée maîtrisée',icon:'🧩',cost:80000,days:5,brand:.006,bonus:1,desc:'Lancement prudent, budget préservé.'},
public:{name:'Conquête du public',icon:'📡',cost:280000,days:18,brand:.012,bonus:2,desc:'Campagne d’audience ambitieuse.'},
premium:{name:'Programmation premium',icon:'🎬',cost:520000,days:10,brand:.035,bonus:4,desc:'Qualité et prestige du genre vedette.'},
offensive:{name:'Grande offensive',icon:'🚀',cost:780000,days:28,brand:.023,bonus:3,desc:'Couverture promotionnelle massive.'}
};
function v14Init(s){if(!s.v14||typeof s.v14!=='object')s.v14={};for(const k of ['seasons','offers','approaches'])if(!Array.isArray(s.v14[k]))s.v14[k]=[];return s.v14;}
function v14Year(d){return Math.floor(d/365);}
function v14Season(s){return s.v14?.seasons?.find(p=>p.year===v14Year(s.day));}
E.ensureV14=v14Init;
E.v14Launch=function(source,planId,genre){
 const p=V14_PLANS[planId],yr=v14Year(source.day);
 if(!p||!E.GENRES[genre])return {error:'Orientation ou spécialité invalide.'};
 if(source.day%365>=45)return {error:'La rentrée se prépare durant les 45 premiers jours de l’année.'};
 if(v14Season(source))return {error:'Une rentrée a déjà été validée cette année.'};
 if(source.cash<p.cost)return {error:'Budget insuffisant pour cette rentrée.'};
 const s=structuredClone(source),v=v14Init(s),record={year:yr,policy:planId,genre,startDay:s.day,cost:p.cost,endDay:s.day+p.days-1};
 v.seasons.push(record);
 E.transaction(s,'v14-launch-'+yr,'Plan de rentrée · '+p.name,-p.cost,s.day);
 s.marketingUntil=Math.max(s.marketingUntil||-1,record.endDay);
 s.reputation=Math.max(0,Math.min(1,(s.reputation||.2)+p.brand));
 (s.directorNotes||=[]).unshift('Rentrée '+(yr+1)+' : '+p.name+' · '+E.GENRES[genre].name+' · '+EUR(p.cost)+'.');
 return {state:s,record};
};
const v14BoostBase=E.talentBoostForProgram;
E.talentBoostForProgram=function(s,p){
 const base=Number(v14BoostBase?v14BoostBase(s,p):0)||0;
 const season=s.v14?.seasons?.find(x=>s.day>=x.startDay&&s.day<x.startDay+56);
 const talent=s.talents?.find(t=>t.id===s.castAssignments?.[p.id]&&t.contractEnd>s.day&&t.restUntil<s.day);
 return season&&talent&&season.genre===p.genre?Math.min(22,base+(V14_PLANS[season.policy]?.bonus||0)):base;
};
function v14RivalOwner(s,id){return s.rivals.find(r=>(r.talents||[]).some(x=>x.id===id));}
E.v14Quote=function(s,id,years,ratio){
 const h=E.HOSTS.find(x=>x.id===id),r=v14RivalOwner(s,id);
 years=Number(years);ratio=Number(ratio);
 if(!h||![1,2,3,5].includes(years)||![90,100,115,130].includes(ratio))return {error:'Offre incorrecte.'};
 if(s.talents.some(x=>x.id===id))return {error:'Talent déjà dans ton équipe.'};
 const t=r?.talents.find(x=>x.id===id),remaining=Math.max(0,(t?.contractEnd??s.day+365)-s.day);
 if(r&&remaining>180)return {error:'Exclusivité encore en cours pour plus de 180 jours.'};
 const salary=Math.round(h.salary*ratio/100),signing=Math.round(h.cost*(.65+years*.055));
 const buyout=r?Math.round(h.cost*(.2+.75*remaining/365)):0;
 const chance=Math.max(8,Math.min(96,Math.round(58+(ratio-100)*1.15-(years-1)*3-(r?14:0)+(h.boost||0)*.35)));
 return {h,r,years,ratio,salary,signing,buyout,chance,remaining};
};
E.v14Sign=function(source,id,years,ratio){
 const q=E.v14Quote(source,id,years,ratio);if(q.error)return q;
 if(source.cash<q.signing+q.buyout+q.salary*7)return {error:'Trésorerie insuffisante pour le transfert et les premiers salaires.'};
 const accepted=E.noise('v14-sign',source.seed,id,source.day,years,ratio)*100<q.chance;
 const s=structuredClone(source),v=v14Init(s);
 v.offers.unshift({day:s.day,id,person:q.h.name,from:q.r?.name||'Agent libre',years:q.years,ratio:q.ratio,accepted,cost:q.signing+q.buyout});
 v.offers=v.offers.slice(0,60);
 (s.contractHistory||=[]).unshift({day:s.day,type:'mercato',title:q.h.name,accepted,days:q.years*365,years:q.years,salary:q.salary,signing:q.signing+q.buyout});
 if(!accepted)return {state:s,accepted:false};
 if(q.r){
  const rival=s.rivals.find(x=>x.id===q.r.id);
  rival.talents=rival.talents.filter(x=>x.id!==id);
  E.transaction(s,'v14-compensate-'+s.day+'-'+id,'Indemnité de transfert : '+q.h.name,-q.buyout,s.day);
  E.transaction(s,'v14-receive-'+s.day+'-'+id,'Indemnité reçue : '+q.h.name,q.buyout,s.day,rival.id);
  rival.lastMove='Transfert de '+q.h.name+' vers '+s.brandName;
 }
 s.talents.push({...q.h,salary:q.salary,signedSalary:q.salary,contractEnd:s.day+365*q.years,contractYears:q.years,startDay:s.day,fatigue:0,restUntil:-1});
 E.transaction(s,'v14-talent-'+s.day+'-'+id,'Signature mercato : '+q.h.name,-q.signing,s.day);
 (s.directorNotes||=[]).unshift(q.h.name+' rejoint la chaîne pour '+q.years+' an(s).');
 return {state:s,accepted:true};
};
E.v14Decision=function(source,id,choice){
 const approach=source.v14?.approaches?.find(x=>x.id===id);
 if(!approach||approach.status!=='pending'||source.day>approach.deadline)return {error:'Offre expirée ou déjà traitée.'};
 if(!['keep','sell','reject'].includes(choice))return {error:'Décision invalide.'};
 const t=source.talents.find(x=>x.id===approach.talentId),r=source.rivals.find(x=>x.id===approach.rivalId);
 if(!t||!r)return {error:'Talent ou acquéreur introuvable.'};
 const s=structuredClone(source),a=v14Init(s).approaches.find(x=>x.id===id),talent=s.talents.find(x=>x.id===t.id),rival=s.rivals.find(x=>x.id===r.id);
 if(choice==='sell'){
  if(rival.cash<a.amount)return {error:'Le rival ne peut plus payer ce transfert.'};
  E.transaction(s,'v14-sell-'+id,'Vente : '+talent.name,a.amount,s.day);
  E.transaction(s,'v14-buyer-'+id,'Achat : '+talent.name,-a.amount,s.day,rival.id);
  rival.talents.push({...talent,contractEnd:s.day+365,startDay:s.day});
  s.talents=s.talents.filter(x=>x.id!==talent.id);
  for(const [p,x] of Object.entries(s.castAssignments||{}))if(x===talent.id)delete s.castAssignments[p];
  a.status='accepted';
 }else if(choice==='keep'){
  const cost=Math.round((E.HOSTS.find(x=>x.id===t.id)?.cost||150000)*.38);
  if(s.cash<cost)return {error:'Budget insuffisant pour la prime de fidélité.'};
  E.transaction(s,'v14-keep-'+id,'Fidélité : '+talent.name,-cost,s.day);
  talent.contractEnd=Math.max(talent.contractEnd,s.day)+365;talent.contractYears=(talent.contractYears||1)+1;
  a.status='retained';
 }else a.status='rejected';
 (s.directorNotes||=[]).unshift('Mercato · '+talent.name+' : '+({sell:'transfert conclu',keep:'prolongation signée',reject:'offre refusée'}[choice])+'.');
 return {state:s};
};
const v14RivalBase=E.prepareRivals;
E.prepareRivals=function(s,day){
 const v=v14Init(s);
 for(const r of s.rivals){
  r.talents||=[];
  for(const t of r.talents){
   if(!Number.isFinite(t.contractEnd))t.contractEnd=day+90+Math.floor(E.noise(s.seed,r.id,t.id,'legacy')*330);
   t.salary??=E.HOSTS.find(h=>h.id===t.id)?.salary||4500;
  }
  r.talents=r.talents.filter(t=>t.contractEnd>day);
 }
 for(const a of v.approaches)if(a.status==='pending'&&day>a.deadline)a.status='expired';
 const result=v14RivalBase(s,day);
 for(const r of s.rivals)for(const t of r.talents||[])if(!Number.isFinite(t.contractEnd))t.contractEnd=day+365+Math.floor(E.noise(s.seed,r.id,t.id,'new')*365);
 if(day>0&&day%28===0&&!v.approaches.some(x=>x.status==='pending')){
  const t=s.talents.filter(x=>x.contractEnd>day&&x.contractEnd-day<=150).sort((a,b)=>a.contractEnd-b.contractEnd)[0];
  const rivals=s.rivals.filter(x=>x.cash>1000000).sort((a,b)=>(b.focus===t?.genre?1:0)-(a.focus===t?.genre?1:0)||b.cash-a.cash);
  const rival=rivals[0];
  if(t&&rival&&E.noise('v14-approach',s.seed,day,t.id)<.6){
   v.approaches.unshift({id:'approach-'+day+'-'+t.id,day,deadline:day+14,talentId:t.id,rivalId:rival.id,amount:Math.round((E.HOSTS.find(h=>h.id===t.id)?.cost||180000)*1.1),status:'pending'});
   (s.directorNotes||=[]).unshift(rival.name+' propose de racheter le contrat de '+t.name+'.');
  }
 }
 v.approaches=v.approaches.slice(0,30);
 return result;
};
const v14SimBase=E.simulateDay;
E.simulateDay=function(source){const s=structuredClone(source);v14Init(s);const r=v14SimBase(s);if(!r.error)v14Init(r.state);return r;};

const v14Clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function v14Ensure(s){
 if(!s||!Array.isArray(s.rivals))return s;
 if(!s.v14||typeof s.v14!=='object')s.v14={transfers:[],incoming:[],seasons:[],seasonReports:[],version:14};
 for(const k of ['transfers','incoming','seasons','seasonReports'])if(!Array.isArray(s.v14[k]))s.v14[k]=[];
 for(const rival of s.rivals)for(const t of rival.talents||[]){
  t.contractEnd??=(Math.floor(s.day/365)+1)*365;
  t.startDay??=Math.max(0,s.day-60);
 }
 return s;
}
E.ensureV14=v14Ensure;
const v14OldCreate=E.createGame;
E.createGame=function(...args){const result=v14OldCreate(...args);return v14Ensure(result);};
function v14RivalOwner(s,id){return s.rivals.find(r=>(r.talents||[]).some(t=>t.id===id));}
E.mercatoQuote=function(state,id,years,ratio){
 const s=v14Ensure(state),base=E.HOSTS.find(h=>h.id===id),owner=v14RivalOwner(s,id);
 years=Number(years);ratio=Number(ratio);
 if(!base||!owner)return {error:'Cette personnalité n’est plus sous contrat chez une chaîne rivale.'};
 if(![1,2,3,5].includes(years)||!Number.isFinite(ratio)||ratio<85||ratio>150)return {error:'Durée ou salaire proposé incorrect.'};
 if((s.talents||[]).some(t=>t.id===id))return {error:'Personnalité déjà dans ton équipe.'};
 const held=owner.talents.find(t=>t.id===id),remaining=Math.max(0,held.contractEnd-s.day);
 const buyout=Math.round(base.cost*(.7+Math.min(3,remaining/365)*.6));
 const premium=Math.round(base.cost*(.25+.10*years));
 const total=buyout+premium,salary=Math.round(base.salary*ratio/100);
 const chance=v14Clamp(Math.round(37+(ratio-85)*.78-(remaining/365)*6-(years-1)*2+((base.popularity||60)-60)*-.12),12,90);
 return {base,owner,years,ratio,remaining,buyout,premium,total,salary,chance};
};
E.offerRivalTalent=function(source,id,years,ratio){
 const quote=E.mercatoQuote(source,id,years,ratio);
 if(quote.error)return quote;
 if(source.cash<quote.total+quote.salary*10)return {error:'Budget insuffisant pour le transfert et dix premiers jours de salaire.'};
 const s=structuredClone(source);v14Ensure(s);
 const accepted=E.noise('mercato-player',s.seed,id,s.day,quote.years,quote.ratio)*100<quote.chance;
 s.v14.transfers.unshift({day:s.day,id,title:quote.base.name,from:quote.owner.name,to:s.brandName,accepted,type:'recruit',cost:accepted?quote.total:0,ratio:quote.ratio,years:quote.years});
 s.v14.transfers=s.v14.transfers.slice(0,40);
 s.contractHistory||=[];s.contractHistory.unshift({day:s.day,type:'mercato',title:quote.base.name,accepted,years:quote.years,days:quote.years*365,signing:accepted?quote.total:0});
 if(!accepted){s.notes.unshift('Mercato : '+quote.base.name+' a refusé de quitter '+quote.owner.name+'.');return {state:s,accepted:false,quote};}
 const rival=s.rivals.find(r=>r.id===quote.owner.id);
 rival.talents=rival.talents.filter(t=>t.id!==id);
 const recruited={...quote.base,salary:quote.salary,signedSalary:quote.salary,startDay:s.day,contractEnd:s.day+quote.years*365,contractYears:quote.years,fatigue:0,restUntil:-1};
 s.talents.push(recruited);
 E.transaction(s,'v14-transfer-player-'+id+'-'+s.day,'Mercato : '+quote.base.name,-quote.total,s.day);
 E.transaction(s,'v14-buyout-rival-'+id+'-'+s.day,'Indemnité de transfert reçue : '+quote.base.name,quote.buyout,s.day,rival.id);
 rival.lastMove='Cède '+quote.base.name+' à '+s.brandName+' contre '+EUR(quote.buyout)+'.';
 s.notes.unshift('Mercato réussi : '+quote.base.name+' rejoint '+s.brandName+' pour '+quote.years+' an(s).');
 return {state:s,accepted:true,quote};
};
E.resolveRivalProposal=function(source,offerId,accept){
 const s=structuredClone(source);v14Ensure(s);
 const offer=s.v14.incoming.find(x=>x.id===offerId&&x.status==='pending');
 if(!offer)return {error:'Cette offre a expiré ou a déjà été traitée.'};
 if(s.day>offer.deadline){offer.status='expired';return {state:s,expired:true};}
 const talent=s.talents.find(t=>t.id===offer.talentId),rival=s.rivals.find(r=>r.id===offer.rivalId);
 if(!talent||!rival){offer.status='cancelled';return {state:s,expired:true};}
 if(!accept){offer.status='refused';s.notes.unshift('Offre de '+rival.name+' refusée pour '+talent.name+'.');return {state:s,accepted:false};}
 offer.status='accepted';
 s.talents=s.talents.filter(t=>t.id!==talent.id);
 for(const [program,assigned] of Object.entries(s.castAssignments||{}))if(assigned===talent.id)delete s.castAssignments[program];
 rival.talents||=[];rival.talents.push({...talent,startDay:s.day,contractEnd:s.day+365,fatigue:0,restUntil:-1});
 E.transaction(s,'v14-talent-sale-'+offer.id,'Vente de '+talent.name+' à '+rival.name,offer.bid,s.day);
 E.transaction(s,'v14-rival-purchase-'+offer.id,'Mercato : '+talent.name,-offer.bid,s.day,rival.id);
 s.v14.transfers.unshift({day:s.day,id:talent.id,title:talent.name,from:s.brandName,to:rival.name,accepted:true,type:'sale',cost:offer.bid});
 s.notes.unshift('Mercato : '+talent.name+' quitte la chaîne pour '+rival.name+'.');
 return {state:s,accepted:true};
};
E.launchTVSeason=function(source,genre,level,rebuild){
 const s=structuredClone(source);v14Ensure(s);
 const year=Math.floor(s.day/365),existing=s.v14.seasons.find(y=>y.year===year);
 if(existing)return {error:'La rentrée de cette année est déjà validée.'};
 if(!E.GENRES[genre])return {error:'Genre éditorial inconnu.'};
 const levels={prudent:{budget:120000,days:14,reputation:.008},ambitieux:{budget:420000,days:40,reputation:.020},premium:{budget:950000,days:70,reputation:.042}};
 const def=levels[level];if(!def)return {error:'Budget de lancement inconnu.'};
 if(s.cash<def.budget+100000)return {error:'Le lancement doit préserver une réserve de 100 000 €.'};
 if(rebuild){
  const plan=E.planWeek(s,level==='prudent'?'economy':'audience');
  if(plan.error)return {error:'Grille non planifiable : '+plan.error};
  s.schedule=plan.state.schedule;
 }
 E.transaction(s,'v14-season-'+year,'Rentrée TV '+(year+1)+' : '+E.GENRES[genre].name+' / '+level,-def.budget,s.day);
 s.focus=genre;
 s.marketingUntil=Math.max(s.marketingUntil||-1,s.day+def.days-1);
 s.reputation=v14Clamp((s.reputation||.2)+def.reputation,0,.95);
 const season={year,day:s.day,genre,level,budget:def.budget,days:def.days,planned:!!rebuild};
 s.v14.seasons.push(season);
 s.directorNotes||=[];s.directorNotes.unshift('Rentrée '+(year+1)+' : '+E.GENRES[genre].name+' · '+level+' · '+EUR(def.budget)+' investis.');
 return {state:s,season};
};
const v14OldSimulate=E.simulateDay;
E.simulateDay=function(source){
 const input=structuredClone(source);v14Ensure(input);
 const outcome=v14OldSimulate(input);if(outcome.error)return outcome;
 const s=outcome.state;v14Ensure(s);
 for(const o of s.v14.incoming)if(o.status==='pending'&&s.day>o.deadline)o.status='expired';
 // Les concurrents ne débauchent jamais un talent sans que le joueur ait accepté l'offre.
 if(s.day>0&&s.day%42===0&&s.talents.length){
  const candidate=s.talents.filter(t=>(t.contractEnd||0)>s.day+35).sort((a,b)=>(b.popularity||60)-(a.popularity||60))[0];
  if(candidate){
   const rivals=s.rivals.filter(r=>r.cash>candidate.cost*2&&!r.talents.some(t=>t.id===candidate.id));
   const rival=rivals.find(r=>r.focus===candidate.genre)||rivals[Math.floor(E.noise('mercato-ia',s.seed,s.day)*rivals.length)];
   if(rival&&!s.v14.incoming.some(x=>x.status==='pending'&&x.talentId===candidate.id)){
    const buyout=Math.round(candidate.cost*(1.25+Math.max(0,candidate.contractEnd-s.day)/730));
    s.v14.incoming.unshift({id:'rival-offer-'+s.day+'-'+candidate.id,day:s.day,deadline:s.day+10,talentId:candidate.id,rivalId:rival.id,bid:buyout,status:'pending'});
    s.v14.incoming=s.v14.incoming.slice(0,35);
    s.notes.unshift('Mercato : '+rival.name+' propose '+EUR(buyout)+' pour '+candidate.name+'.');
   }
  }
 }
 // Le bilan annuel n'est comptabilisé qu'une seule fois, au passage de l'année.
 if(s.day>0&&s.day%365===0){
  const year=s.day/365-1;
  if(!s.v14.seasonReports.some(r=>r.year===year)){
   const records=[...(s.reportArchive||[]),...(s.reports||[])].filter(r=>r.day>=year*365&&r.day<(year+1)*365);
   const days=records.length;
   const share=days?records.reduce((n,r)=>n+(Number(r.share)||0),0)/days:0;
   const profit=records.reduce((n,r)=>n+(Number(r.profit)||0),0);
   s.v14.seasonReports.push({year,days,share,profit,invested:s.v14.seasons.find(x=>x.year===year)?.budget||0});
   s.v14.seasonReports=s.v14.seasonReports.slice(-12);
   s.notes.unshift('Bilan annuel '+(year+1)+' : '+share.toFixed(2)+' % d’audience · '+EUR(profit)+' de résultat.');
  }
 }
 return outcome;
};

function v15Ensure(s){
 if(!s||!Array.isArray(s.schedule))return s;
 if(!s.v15||typeof s.v15!=='object')s.v15={version:15,lives:[],studios:[],channels:[],seq:0,groupNews:[]};
 for(const key of ['lives','studios','channels','groupNews'])if(!Array.isArray(s.v15[key]))s.v15[key]=[];
 s.v15.seq=Number.isFinite(s.v15.seq)?s.v15.seq:0;
 for(const entry of s.v15.lives){
  if(entry&&entry.programId&&entry.program){
   E.ALL[entry.programId]={...entry.program};
  }
 }
 return s;
}
E.ensureV15=v15Ensure;
const v15OldCreate=E.createGame;
E.createGame=function(...args){const x=v15OldCreate(...args);return v15Ensure(x);};
function v15LiveOffers(s){
 const week=Math.floor(s.day/7),remain=7-s.day%7;
 return V15_EVENTS.map((item,i)=>{
  const delta=remain===1?0:(i+1)%remain;
  const date=s.day+delta;
  const booked=(s.v15?.lives||[]).find(x=>x.key===item.id+'-'+week);
  const qualityDelta=Math.round((E.noise('v15-surprise',s.seed,item.id,week,date)-.5)*48);
  const quality=v15Clamp(item.quality+qualityDelta,36,99);
  const offer={...item,week,date,slot:i%2===0?28:32,key:item.id+'-'+week,quality,booked};
  return offer;
 });
}
E.getV15LiveOffers=v15LiveOffers;
E.reserveV15Live=function(source,id){
 const s=structuredClone(source);v15Ensure(s);
 const offer=v15LiveOffers(s).find(o=>o.id===id);
 if(!offer)return {error:'Événement inconnu.'};
 if(offer.booked)return {error:'Cet événement a déjà été réservé cette semaine.'};
 if(s.v15.lives.some(o=>o.date===offer.date))return {error:'Un grand direct est déjà programmé ce jour-là. Choisis un autre événement.'};
 if(s.cash<offer.fee)return {error:'Trésorerie insuffisante pour les droits et la production.'};
 const pid='v15live_'+offer.id+'_'+offer.date;
 const p={id:pid,title:offer.name,genre:offer.genre,quality:offer.quality,slots:2,fee:1200,licensePrice:0,description:offer.description};
 E.ALL[pid]=p;
 if(!s.owned.includes(pid))s.owned.push(pid);
 const weekday=offer.date%7;
 const originalSchedule=structuredClone(s.schedule[weekday]);
 const result=E.place(s,weekday,offer.slot,pid);
 if(result.error)return {error:'Grille incompatible : '+result.error};
 const next=result.state;v15Ensure(next);
 const entry={key:offer.key,id:offer.id,programId:pid,program:p,weekday,date:offer.date,slot:offer.slot,fee:offer.fee,originalSchedule,status:'booked',result:null};
 next.v15.lives.push(entry);
 E.transaction(next,'v15-live-'+offer.key+'-'+offer.date,'Droits et production du direct : '+offer.name,-offer.fee,next.day);
 next.directorNotes||=[];next.directorNotes.unshift('Direct confirmé pour le jour '+(offer.date+1)+' : '+offer.name+'.');
 return {state:next,entry};
};
E.addV15Studio=function(source,genre,style){
 const s=structuredClone(source);v15Ensure(s);
 if(!E.GENRES[genre]||!V15_STYLES[style])return {error:'Spécialité ou décor invalide.'};
 if(s.v15.studios.some(x=>x.genre===genre))return {error:'Un studio est déjà affecté à cette spécialité.'};
 if(s.v15.studios.length>=8)return {error:'Huit studios maximum pour ce groupe.'};
 const cost=150000;if(s.cash<cost+75000)return {error:'Budget insuffisant pour construire et conserver une réserve.'};
 E.transaction(s,'v15-studio-new-'+genre,'Construction plateau : '+E.GENRES[genre].name,-cost,s.day);
 s.v15.studios.push({genre,style,level:1,installedDay:s.day,spent:cost});
 return {state:s};
};
E.upgradeV15Studio=function(source,genre){
 const s=structuredClone(source);v15Ensure(s);
 const t=s.v15.studios.find(x=>x.genre===genre);
 if(!t)return {error:'Construis d’abord le plateau.'};
 if(t.level>=3)return {error:'Ce plateau est déjà au niveau maximal.'};
 const cost=t.level===1?350000:800000;
 if(s.cash<cost+75000)return {error:'Budget insuffisant pour agrandir le plateau.'};
 E.transaction(s,'v15-studio-up-'+genre+'-'+(t.level+1),'Amélioration plateau '+E.GENRES[genre].name,-cost,s.day);
 t.level++;t.spent+=cost;return {state:s};
};
E.styleV15Studio=function(source,genre,style){
 const s=structuredClone(source);v15Ensure(s);
 if(!V15_STYLES[style])return {error:'Style de plateau inconnu.'};
 const t=s.v15.studios.find(x=>x.genre===genre);if(!t)return {error:'Plateau introuvable.'};
 if(t.style===style)return {error:'Ce décor est déjà installé.'};
 const cost=12000;
 if(s.cash<cost)return {error:'Budget insuffisant.'};
 E.transaction(s,'v15-style-'+genre+'-'+s.day+'-'+style,'Nouveau décor '+E.GENRES[genre].name,-cost,s.day);
 t.style=style;t.spent+=cost;return {state:s};
};
E.v15StudioBoost=(s,genre)=>{
 const stage=s.v15?.studios?.find(t=>t.genre===genre);
 return stage?2+stage.level*3:0;
};
const V15_CHANNEL_LEVELS={economy:{name:'Prudent',dailyCost:2700,qualityModifier:-3},balanced:{name:'Équilibré',dailyCost:6500,qualityModifier:0},premium:{name:'Premium',dailyCost:13500,qualityModifier:7}};
function v15SharedPrograms(s,genre){
 return (s.owned||[]).filter(id=>id.startsWith('p')&&E.ALL[id]?.genre===genre).slice(0,40);
}
function v15ChannelProgram(s,genre){
 const owned=v15SharedPrograms(s,genre);
 if(owned.length)return owned[0];
 const fallback=(s.owned||[]).filter(id=>id.startsWith('p')&&E.ALL[id]);
 return fallback[0]||'interlude';
}
E.createV15Channel=function(source,name,genre,capital,policy){
 const s=structuredClone(source);v15Ensure(s);
 name=String(name||'').trim();capital=Number(capital);
 if(name.length<3||name.length>30)return {error:'Le nom doit contenir de 3 à 30 caractères.'};
 if(!E.GENRES[genre])return {error:'Spécialité inconnue.'};
 if(!V15_CHANNEL_LEVELS[policy])return {error:'Politique budgétaire inconnue.'};
 if(s.v15.channels.length>=4)return {error:'Quatre chaînes secondaires maximum.'};
 if(s.v15.channels.some(c=>c.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'))||name.toLocaleLowerCase('fr')===s.brandName.toLocaleLowerCase('fr'))return {error:'Ce nom de chaîne existe déjà.'};
 if(![300000,600000,1200000].includes(capital))return {error:'Capital de lancement invalide.'};
 const setup=140000;
 if(s.cash<capital+setup+100000)return {error:'Le groupe ne dispose pas du capital nécessaire et de la réserve.'};
 const index=++s.v15.seq,id='sub-'+index,program=v15ChannelProgram(s,genre);
 E.transaction(s,'v15-channel-setup-'+id,'Frais de création de '+name,-setup,s.day);
 E.transaction(s,'v15-channel-fund-'+id,'Capital transféré à '+name,-capital,s.day);
 const channel={id,name,genre,policy,cash:capital,initialCapital:capital,createdDay:s.day,day:s.day,history:[],lineup:[program,program,program],revenue:0,expenses:0,share:0,profit:0};
 s.v15.channels.push(channel);
 s.v15.groupNews.unshift('Ouverture de '+name+' : '+E.GENRES[genre].name+' · '+EUR(capital)+' de capital.');
 return {state:s,channel};
};
E.budgetV15Channel=function(source,id,amount,direction){
 const s=structuredClone(source);v15Ensure(s);
 const channel=s.v15.channels.find(x=>x.id===id);amount=Number(amount);
 if(!channel||!['in','out'].includes(direction))return {error:'Chaîne ou sens de transfert invalide.'};
 if(![50000,150000,300000,600000].includes(amount))return {error:'Montant de transfert non autorisé.'};
 if(direction==='in'&&s.cash<amount)return {error:'Trésorerie du groupe insuffisante.'};
 if(direction==='out'&&channel.cash<amount+10000)return {error:'Le retrait doit laisser au moins 10 000 € à la chaîne.'};
 E.transaction(s,'v15-budget-'+id+'-'+s.day+'-'+s.ledger.length,(direction==='in'?'Financement de ':'Remontée de trésorerie : ')+channel.name,(direction==='in'?-1:1)*amount,s.day);
 channel.cash+=(direction==='in'?1:-1)*amount;
 return {state:s};
};
E.setV15Lineup=function(source,id,position,programId,policy){
 const s=structuredClone(source);v15Ensure(s);
 const c=s.v15.channels.find(x=>x.id===id),index=Number(position);
 if(!c||![0,1,2].includes(index)||!V15_CHANNEL_LEVELS[policy])return {error:'Choix de grille ou de politique invalide.'};
 if(!s.owned.includes(programId)||!E.ALL[programId]||['interlude','night','live'].includes(programId))return {error:'Ce programme n’est pas sous droits partagés du groupe.'};
 c.lineup[index]=programId;
 c.policy=policy;
 return {state:s};
};
const v15PreviousSim=E.simulateDay;
E.simulateDay=function(source){
 const input=structuredClone(source);v15Ensure(input);
 const originals=new Map();
 for(const p of input.productions||[]){
  const bonus=E.v15StudioBoost(input,p.genre);
  if(bonus>0){originals.set(p.id,p.quality);p.quality=v15Clamp((p.quality||50)+bonus,1,99);}
 }
 const outcome=v15PreviousSim(input);
 if(outcome.error)return outcome;
 const s=outcome.state;v15Ensure(s);
 for(const p of s.productions||[])if(originals.has(p.id))p.quality=originals.get(p.id);
 const day=outcome.report?.day??source.day;
 // Le direct utilise réellement le moteur de la grille et des audiences, puis l'antenne retrouve son programme normal.
 for(const event of s.v15.lives){
  if(event.status!=='booked'||event.date!==day)continue;
  const stats=outcome.report.shows?.filter(x=>x.programId===event.programId)||[];
  const viewers=stats.reduce((total,x)=>total+(x.viewers||0),0);
  const market=stats.reduce((total,x)=>total+(x.market||0),0);
  const share=market>0?100*viewers/market:0;
  event.status='aired';event.result={day,share,viewers,budget:event.fee,revenue:stats.reduce((n,x)=>n+(x.revenue||0),0)};
  if(Array.isArray(event.originalSchedule))s.schedule[event.weekday]=event.originalSchedule;
  s.directorNotes||[];s.directorNotes.unshift('Direct : '+event.program.title+' · '+share.toFixed(2)+' % de part d’audience.');
 }
 // Filiales : audiences et budgets indépendants, recettes et dépenses calculées à chaque journée de diffusion.
 for(const c of s.v15.channels){
  if(day<c.createdDay||c.day>day)continue;
  const plan=V15_CHANNEL_LEVELS[c.policy]||V15_CHANNEL_LEVELS.balanced;
  const quality=c.lineup.map(id=>E.ALL[id]?.quality||46);
  const focus=quality.reduce((n,v)=>n+v,0)/3;
  const synergy=E.v15StudioBoost(s,c.genre);
  const bonus=Math.min(12,(s.v15.studios||[]).length*1.4);
  const random=E.noise('v15-subsidiary',s.seed,c.id,day);
  const projected=v15Clamp(1.2+(focus-50)*.047+synergy*.055+plan.qualityModifier*.052+random*1.8,0.4,8.5);
  const share=Number(projected.toFixed(3));
  const revenue=Math.round(8500+share*8500+(c.policy==='premium'?4400:0));
  const expenses=Math.round(plan.dailyCost+7900+quality.reduce((n,v)=>n+v*23,0)+bonus*150);
  const available=Math.max(0,c.cash);
  if(available<expenses){
   c.history.push({day,share:0,revenue:0,expenses:0,profit:0,closed:true});
   c.history=c.history.slice(-42);c.share=0;c.profit=0;c.day=day+1;
   continue;
  }
  const actualExpense=Math.round(expenses*(1-v15Clamp(.025*(s.v15.studios||[]).length,0,.15)));
  const profit=revenue-actualExpense;
  c.cash+=profit;c.revenue+=revenue;c.expenses+=actualExpense;c.share=share;c.profit=profit;c.day=day+1;
  c.history.push({day,share,revenue,expenses:actualExpense,profit});
  c.history=c.history.slice(-42);
 }
 return outcome;
};

 const graphic='<svg class="v16-scene-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Décor télévisuel illustré : '+v16Escape(E.GENRES[genre]?.name||genre)+'"><defs><linearGradient id="'+unique+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+palette[0]+'"/><stop offset=".53" stop-color="'+palette[1]+'"/><stop offset="1" stop-color="#0b183a"/></linearGradient><radialGradient id="'+unique+'-r"><stop stop-color="'+palette[2]+'" stop-opacity=".34"/><stop offset="1" stop-color="#0c1936" stop-opacity="0"/></radialGradient></defs><path d="M0 0h480v270H0Z" fill="url(#'+unique+')"/><ellipse cx="235" cy="91" rx="235" ry="147" fill="url(#'+unique+'-r)"/>'+beams+v16Backdrop(p,n)+transparent+v16Presenter(presenter,false,n,genre)+camera+desk+foot+'<g class="v16-screen-line" opacity=".72"><path d="M22 249h91" stroke="'+palette[2]+'" stroke-width="4"/><path d="M125 249h26" stroke="#fff" stroke-width="4"/></g></svg>';
 return graphic;
}
function v16Screen(p,opts={}){
 const genre=p?.genre||'info',title=ESC(p?.title||'TV Network Tycoon');
 const label=ESC(E.GENRES[genre]?.name||genre);
 return '<div class="v16-tv-screen">'+v16Svg(p,opts)+'<span class="v16-screen-flare"></span><div class="v16-screen-top"><span class="v16-screen-live">DIRECT</span><span class="v16-screen-label">'+label.toUpperCase()+'</span></div><div class="v16-lower-third"><div><strong>'+title+'</strong><small>'+ESC(opts.person?.name||'STUDIO · JLG CREATIVE')+'</small></div><b>TV NETWORK</b></div></div>';
}
const v16PreviousCover=v12Visual;
v12Visual=function(p,small){
 const n=v16Hash(p.id||p.title),palette=v16Color(p.genre||'info');
 return '<div class="v16-art-cover'+(small?' v12-cover-small':'')+'" style="--cover-a:'+palette[0]+';--cover-b:'+palette[1]+'" role="group" aria-label="Affiche originale de '+ESC(p.title)+'">'+v16Svg(p,{small})+'<span class="v16-poster-hash">'+String(n%9000+1000)+'</span><div class="v16-poster-caption"><small>'+ESC(E.GENRES[p.genre]?.name||'Télévision')+' · '+(p.season?'SAISON '+p.season:'STUDIO TV')+'</small><b>'+ESC(p.title)+'</b></div></div>';
};
const v16PreviousStudioStage=v15StudioStage;
v15StudioStage=function(st){
 const pseudo={id:'studio-'+st.genre+'-'+st.style,title:'Plateau '+(E.GENRES[st.genre]?.name||'TV'),genre:st.genre};
 const upper=V15_STYLES[st.style]?.name||'Décor TV';
 return '<div class="v16-stage-preview" aria-label="Décor animé du studio '+ESC(st.genre)+'">'+v16Svg(pseudo,{stage:true,style:st.style,level:st.level})+'<span class="v16-studio-badge">'+ESC(upper)+' · NIV '+st.level+'</span></div>';
};
function v16NowProgram(){
 if(!game)return E.ALL.p001||E.PROGRAMS[0];
 const grid=game.schedule?.[game.day%7]||[];
 const programmeId=grid.find(x=>x.start>=26&&x.start<39)?.programId||grid[Math.floor(grid.length/2)]?.programId||grid[0]?.programId||'p001';
 return E.getProgram(programmeId,game);
}
function v16ControlRoom(){
 const prog=v16NowProgram(),talent=(game.talents||[]).find(t=>t.genre===prog.genre);
 const report=game.reports?.at(-1),lives=game.v15?.lives?.filter(x=>x.status==='booked'&&x.date>=game.day).length||0;
 const share=report?pct(report.share):'—';
 const motion=!!ui.v16MotionPause;
 return '<section class="v16-hero" aria-label="Régie de diffusion animée"><div class="v16-hero-content"><div class="v16-kicker"><span class="v16-live-dot"></span> RÉGIE GÉNÉRALE · V1.6</div><h2>'+ESC(game.brandName)+'<br>aux commandes du direct.</h2><p>Une programmation vivante, des plateaux et des présentateurs illustrés. Le résultat d’audience n’est connu qu’après chaque diffusion.</p><div class="v16-hero-actions"><button class="btn btn-primary" data-action="simulate">▶ Diffuser la journée</button><button class="btn btn-outline" data-action="week">⏩ Avancer 7 jours</button></div><div class="v16-hero-onair"><span class="v16-live-dot"></span> PRÉVISUALISATION DE LA GRILLE · JOUR '+(game.day+1)+'</div></div><div class="v16-broadcast-panel'+(motion?' v16-paused':'')+'">'+v16Screen(prog,{person:talent})+'<button class="v16-motion-control" data-action="v16-motion" aria-label="'+(motion?'Reprendre les animations':'Mettre les animations en pause')+'" title="'+(motion?'Reprendre les animations':'Pause des animations')+'">'+(motion?'▶':'Ⅱ')+'</button><div class="v16-telemetry"><span><small>DERNIÈRE AUDIENCE</small><b>'+share+'</b></span><span><small>DIRECTS À VENIR</small><b>'+lives+'</b></span><span><small>ÉQUIPE ANTENNE</small><b>'+(game.talents?.length||0)+' talents</b></span></div></div></section>';
}
const v16PreviousDashboard=dashboard;
dashboard=function(){
 const html=v16PreviousDashboard();
 const hero=/<section class="hero">[\s\S]*?<\/section>/;
 return html.replace(hero,v16ControlRoom());
};
const v16PreviousHome=v09HomeMarkup;
v09HomeMarkup=function(){
 let html=v16PreviousHome();
 if(ui.startScreen!=='menu')return html;
 const p={id:'v16-tv-menu',title:'Le studio de ta future chaîne',genre:'info'};
 const visual='<div class="v16-home-intro"><span>STUDIO EDITION · V1.6</span><span>PRÉVISUALISATION</span></div><div class="v16-home-broadcast">'+v16Screen(p)+'</div>';
 return html.replace('</header>', '</header>'+visual);
};
const v16PreviousLivePage=v15LivePage;
v15LivePage=function(){
 const html=v16PreviousLivePage();
 const offers=v15LiveOffers(game);let i=0;
 return html.replace(/<div class="v15-event-poster"[^>]*><span>[\s\S]*?<\/span><div>[\s\S]*?<\/div><\/div>/g,()=>{
  const event=offers[i++];
  if(!event)return '';
  return '<div class="v16-live-card">'+v16Screen({id:'live-'+event.id,title:event.name,genre:event.genre},{event:true})+'</div>';
 });
};
function v16WeeklyReport(){
 if(!game)return '';
 const rows=game.reports.slice(-7),count=rows.length;
 const avg=count?rows.reduce((n,r)=>n+r.share,0)/count:0;
 const profit=rows.reduce((n,r)=>n+(r.profit||0),0);
 const audience=[...rows].map(r=>r.share),max=Math.max(4,...audience);
 const bars=audience.map((num,i)=>'<span style="height:'+Math.max(12,Math.round(100*num/max))+'%" title="Jour '+(rows[i].day+1)+' : '+num.toFixed(2)+' %"></span>').join('');
 const most=rows.at(-1),strongest=rows.reduce((a,b)=>a.share>b.share?a:b,rows[0]);
 const title='La semaine de '+ESC(game.brandName),scene=E.getProgram(most?.shows?.[0]?.programId||'p001',game);
 return '<div class="modal-backdrop"><section class="modal v16-weekly-modal" role="dialog" aria-modal="true"><div class="v16-weekly-banner"><span>📡 TV NETWORK · BILAN DE DIFFUSION</span><h2>'+title+'</h2><p>'+count+' journées simulées · chiffres issus de ta carrière</p></div>'+v16Screen(scene)+'<div class="v16-weekly-stats"><article><small>AUDIENCE MOYENNE</small><b>'+avg.toFixed(2).replace('.',',')+' %</b></article><article><small>RÉSULTAT SEMAINE</small><b>'+EUR(profit)+'</b></article><article><small>MEILLEUR JOUR</small><b>J'+(strongest?.day+1||game.day)+'</b></article></div><div class="v16-weekly-bars" role="img" aria-label="Graphique animé de l’évolution des parts d’audience">'+bars+'</div><div class="v16-weekly-footer"><button class="btn btn-primary" data-action="v16-report-close">Continuer</button><button class="btn btn-outline" data-action="v16-report-grid">Voir ma grille</button></div></section></div>';
}
const v16PreviousModal=modal;
modal=function(){if(ui.modal==='v16-week')return v16WeeklyReport();return v16PreviousModal();};
const v16PreviousPlay=play;
play=async function(days){
 const previous=game?.reports?.length||0;
 await v16PreviousPlay(days);
 if(days===7&&game?.reports?.length>previous&&!ui.startMenuOpen&&!ui.modal&&game.reports.length-previous>=5){
  ui.modal='v16-week';render();
 }
};
ui.v16MotionPause=false;
const v16PreviousClick=handleClick;
handleClick=async function(ev){
 const b=ev.target.closest('[data-action]');
 if(b&&!b.disabled){
  if(b.dataset.action==='v16-motion'){ui.v16MotionPause=!ui.v16MotionPause;render();return;}
  if(b.dataset.action==='v16-report-close'){ui.modal=null;render();return;}
  if(b.dataset.action==='v16-report-grid'){ui.modal=null;nav('grid');return;}
 }
 return v16PreviousClick(ev);
};

init();
})();
</script>
</body></html>
