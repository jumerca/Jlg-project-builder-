<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a9dd8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camping Tycoon">
<meta name="application-name" content="Camping Tycoon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camping Tycoon V1.8.0 — JLG Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Carte du camping"></canvas>

  <header id="top">
    <div class="brand"><img class="logo" src="assets/logo-mark.svg" alt=""><div><b>Camping Tycoon</b><small id="campName">—</small></div></div>
    <div class="chip" id="dateChip"><span id="date">—</span><b id="clock">07h00</b></div>
    <div class="chip weather" id="weatherChip" title="Météo et prévisions"><span id="wxIcon">☀️</span><b id="wxTemp">—</b><span id="forecast" class="forecast"></span></div>
    <div class="chip money" id="cashChip" title="Trésorerie"><span>💶</span><b id="cash">—</b></div>
    <div class="chip rep" title="Réputation et classement"><span id="stars">★</span><div class="bar"><i id="repBar"></i></div><b id="rep">—</b></div>
    <div class="chip occ" title="Occupation ce soir"><span>🛏️</span><b id="occ">—</b></div>
    <div class="speeds" role="group" aria-label="Vitesse">
      <button data-speed="0" title="Pause (Espace)">❚❚</button>
      <button data-speed="1" title="Vitesse normale (1)">▶</button>
      <button data-speed="2" title="Rapide (2)">▶▶</button>
      <button data-speed="3" title="Très rapide (3)">▶▶▶</button>
    </div>
    <button class="iconbtn" id="soundBtn" title="Sons">🔊</button>
    <button class="iconbtn" id="menuBtn" title="Menu">☰</button>
  </header>

  <div id="winterBar" class="hidden">
    <div>❄️ <b>Hors saison</b> — le camping est fermé. Construisez sans contrainte : les chantiers seront livrés à l’ouverture.</div>
    <button class="btn primary" id="openSeason">Ouvrir la saison ▶</button>
  </div>

  <nav id="tools" aria-label="Outils de construction">
    <button data-tool="select" class="tool active" title="Sélectionner / déplacer la vue"><span>👆</span><em>Voir</em></button>
    <button data-tool="path" class="tool" title="Tracer des allées"><span>🟫</span><em>Allées</em></button>
    <button data-cat="heberg" class="tool cat" title="Hébergements"><span>⛺</span><em>Héberger</em></button>
    <button data-cat="service" class="tool cat" title="Services"><span>🏠</span><em>Services</em></button>
    <button data-cat="loisir" class="tool cat" title="Loisirs"><span>🏊</span><em>Loisirs</em></button>
    <button data-cat="deco" class="tool cat" title="Paysage"><span>🌳</span><em>Paysage</em></button>
    <button data-tool="demolish" class="tool" title="Démolir"><span>🧨</span><em>Démolir</em></button>
    <div class="sep"></div>
    <button data-tab="bookings" class="tool tab" title="Réservations"><span>📅</span><em>Résas</em></button>
    <button data-tab="prices" class="tool tab" title="Tarifs"><span>🏷️</span><em>Tarifs</em></button>
    <button data-tab="staff" class="tool tab" title="Équipe"><span>👷</span><em>Équipe</em></button>
    <button data-tab="finance" class="tool tab" title="Finances"><span>📊</span><em>Finances</em></button>
    <button data-tab="goals" class="tool tab" title="Objectifs et classement"><span>🏆</span><em>Objectifs</em></button>
    <button data-tab="director" class="tool tab" title="Direction : campagnes, réservations et programmation"><span>🎯</span><em>Direction</em></button>
    <button data-tab="life" class="tool tab" title="Vie du camping : activités, nouveaux bâtiments et besoins"><span>🌞</span><em>Vie</em></button>
    <button data-tab="reviews" class="tool tab" title="Avis des vacanciers"><span>💬</span><em>Avis</em></button>
    <button data-tab="log" class="tool tab" title="Journal"><span>📰</span><em>Journal</em></button>
  </nav>
  <div id="flyout" class="hidden"></div>

  <aside id="panel" class="hidden">
    <div class="phead"><h2 id="ptitle">—</h2><button class="iconbtn" id="pclose">✕</button></div>
    <div id="pbody"></div>
  </aside>

  <div id="inspector" class="hidden"></div>
  <div id="tuto" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="toasts"></div>
  <div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="src/data.js"></script>
<script src="src/sim.js"></script>
<script src="src/save.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script>
  // Application installable : cache hors ligne quand le jeu est hébergé à sa propre adresse
  try { if ('serviceWorker' in navigator && window.top === window && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
</script>
</body>
</html>
