  function simulateVolleyball(home,away,rng,options={}){

function importSaveFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      let parsed;
      try{parsed=JSON.parse(String(reader.result||''));}
      catch{throw new Error('Le fichier JSON est illisible ou corrompu.');}
      const incoming=Array.isArray(parsed?.saves)?parsed.saves:(parsed?.countryId?[parsed]:[]);
      if(!incoming.length)throw new Error('Aucune sauvegarde National Glory reconnue.');
      let imported=0,lastId=null;
      for(const raw of incoming){
        const invalid=validateImportedSave(raw);if(invalid)throw new Error(invalid);
        const save=structuredClone(raw); normalizeSave(save);
        if(!save.id||localStorage.getItem(saveKey(save.id)))save.id='save_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
        save.updatedAt=Date.now(); save.version='0.99-fix3'; save.tutorialSeen=true;
        try{localStorage.setItem(saveKey(save.id),JSON.stringify(save));}
        catch(err){if(err?.name==='QuotaExceededError')throw new Error('Stockage local plein. Exporte ou supprime une ancienne partie avant d’importer.');throw err;}
        imported++; lastId=save.id;
      }
      if(!imported)throw new Error('Format non compatible.');
      if(lastId)localStorage.setItem(LAST_SAVE_KEY,lastId);
      toast(`${imported} sauvegarde(s) importée(s) avec succès.`); render();
    }catch(err){toast(`Import refusé : ${err?.message||'fichier invalide'}`);}
  };
  reader.onerror=()=>toast('Import refusé : impossible de lire le fichier.');
  reader.readAsText(file);
}

function generateAthletes(countryId='france', year=2034){
  const country = COUNTRIES[countryId];

  const basePerSport=Math.floor(baseTarget/SPORTS.length);
  SPORTS.forEach((sport, si)=>{
    const events=Engine.eventsForSport(sport.id);
    const team=Engine.isTeamSport(sport.id);
    const minCoverage=team?(GameConfig.TEAM_RULES[sport.id].preferred*2):Math.max(8,events.length*2);
    const count=Math.max(minCoverage,basePerSport+(si<baseTarget%SPORTS.length?1:0)+(isStrength(country,sport.id)?2:0));
    const disciplines=GameConfig.DISCIPLINES[sport.id]||['Épreuve'];
    for(let i=0;i<count;i++){
      const sex=i%2===0?'M':'F';
      const firsts=firstPool(countryId,sex);
      let name;
      do { name = `${firsts[Math.floor(rng()*firsts.length)]} ${names.last[Math.floor(rng()*names.last.length)]}`; } while(used.has(name)||RESERVED_REAL_NAMES.has(name));
      used.add(name);
      const discipline=disciplines[Math.floor(i/2)%disciplines.length];
      const regionPool = regionalPreference(countryId, sport.id);
      const region = regionPool.length && rng()<0.55 ? regionPool[Math.floor(rng()*regionPool.length)] : regions[Math.floor(rng()*regions.length)];
      const age = Math.floor(16 + rng()*19);
      const nationalStrength=countrySportStrength(country,sport);
      const ageCurve=Math.max(0,4-Math.abs(age-25)*.32);
      const base = clamp(Math.round(34 + nationalStrength*.48 + ageCurve + randomNormal(rng)*6.2), 42, 95);
      const potentialCenter = clamp(base + Math.round(6 + rng()*11 - (age-18)*0.35 + (country.scouting-70)*0.05), base, 99);
      const hidden = clamp(potentialCenter + Math.round(randomNormal(rng)*3), base, 99);
      const spread = Math.max(2, Math.round((100-country.scouting)/5 + rng()*2));
      athletes.push({
        id:uid('ath',rng), name, countryId, sportId:sport.id, discipline, sex, age, region,
        ability:base, truePotential:hidden,
        potentialMin:Math.round(clamp(potentialCenter-spread, base, 99)), potentialMax:Math.round(clamp(potentialCenter+spread, base, 99)),
        form:Math.round(68+rng()*28), fatigue:Math.round(6+rng()*24), confidence:Math.round(58+rng()*35), professionalism:Math.round(54+rng()*42),
        injuryRisk:Math.round(8+rng()*24), experience:clamp(Math.round((age-16)*4+rng()*18),2,95),
        physical:clamp(Math.round(base+randomNormal(rng)*5),40,99), technical:clamp(Math.round(base+randomNormal(rng)*5),40,99), mental:clamp(Math.round(base+randomNormal(rng)*6),40,99),
        coach:clamp(Math.round(country.infrastructure-6+rng()*18),45,99), infrastructure:clamp(Math.round(country.infrastructure-8+rng()*18),45,99),
        injuredDays:0,pb:null,trend:'→',history:[],selected:false,scoutingReviews:0
      });
    }
  });
  athletes.sort((a,b)=>b.ability-a.ability);
  athletes.slice(0,6).forEach((a,i)=>{
    a.age=17+i;a.ability=clamp(81+i*2+(isStrength(country,a.sportId)?2:0),80,97);a.truePotential=clamp(94+(i%3),a.ability,99);
    a.potentialMin=Math.round(clamp(a.truePotential-5,a.ability,99));a.potentialMax=Math.round(clamp(a.truePotential+1,a.ability,99));a.form=88+i;a.confidence=84+i;
  });
  return athletes;
}

function countrySportStrength(country, sport){
  const rank=country.worldRank||20;
  const overall=66.5+clamp((25-rank)*.24,-2,6)+((country.culture||75)-75)*.075+((country.infrastructure||75)-75)*.065;
  const strengths=country.strengths||[];
  const specialtyIndex=strengths.indexOf(sport.id);
  const specialist=specialtyIndex>=0;
  // The order of a nation's declared strengths matters: a flagship sport gets a
  // larger structural bonus than its fourth/fifth specialty. This prevents a
  // binary "strong/not strong" model from making Canada as strong as the USA in basketball.
  const specialtyCurve=[17,15,13.5,12,10.5,9];
  const concentrationBonus=specialist?Math.max(0,4-strengths.length)*1.4:0;
  const specialtyBonus=specialist?(specialtyCurve[Math.min(specialtyIndex,specialtyCurve.length-1)]+concentrationBonus):0;
  // Small deterministic affinity keeps nations from being clones without overpowering identity.
  const affinity=((((hashSeed(`${country.id}-${sport.id}-affinity`)%1000)/1000)-.5)*3);
  const franceLegacy=country.id==='france'?(sport.strength-80)*.28:0;
  return clamp(Math.round(overall+specialtyBonus+affinity+franceLegacy),45,98);
}
function initialSportRanking(country,sport,strengthIndex){
  const raw=(hashSeed(`${country.id}-${sport.id}-ranking`)%1000)/1000;
  const noise=(raw-.5)*2.8;
  const specialist=isStrength(country,sport.id);
  const globalPenalty=Math.max(0,(country.worldRank-1)*(specialist?.035:.07));
  const specialtyBonus=specialist?1.1:0;
  return clamp(Math.round(1+(98-strengthIndex)*.30+globalPenalty-specialtyBonus+noise),1,35);
}

function buildSportsForCountry(country, totalBudget=country.budget){
  const raw=SPORTS.map((s,i)=>({
    ...s,
    strengthIndex:countrySportStrength(country,s),
    budget:Math.max(4,Math.round(s.budget*(totalBudget/620)*(isStrength(country,s.id)?1.22:0.94))),
    licensed:Math.round(40000+country.culture*1500+country.infrastructure*1000+s.strength*1900+(isStrength(country,s.id)?50000:0)+i*1400),
    infrastructure:clamp(Math.round(country.infrastructure+(isStrength(country,s.id)?5:0)+(i%4)*2-4),45,98),

  return Engine.normalizeBudgets(raw,totalBudget,.08);
}

  if(!save.economy.facilities)save.economy.facilities=Economy.initialFacilities(country.infrastructure,country.scouting);
  if(!Array.isArray(save.economy.activeSponsors))save.economy.activeSponsors=[];
  if(!Array.isArray(save.economy.sponsorOffers))save.economy.sponsorOffers=Economy.createSponsorOffers({countryId:save.countryId,worldRank:save.worldRank||country.worldRank,year:save.year||2034,count:3});
  if(!Array.isArray(save.economy.sponsorHistory))save.economy.sponsorHistory=[];
  save.athletes.forEach(a=>{if(!a.developmentPlan)a.developmentPlan='balanced';});
  if(typeof save.tutorialSeen!=='boolean')save.tutorialSeen=true;
  save.version='0.99-fix3';
  if(!save.federations) save.federations={};
  for(const sp of save.sports){
    if(!save.federations[sp.id]) save.federations[sp.id]=buildFederationState([sp],country,save.year||2034)[sp.id];
    const f=save.federations[sp.id];
    for(const role of ['headCoach','youthDirector','medicalLead']) f[role]=Management.normalizeStaffMember(f[role],role,save.year||2034);
    if(!Array.isArray(f.seasonObjectives)||!f.seasonObjectives.length) f.seasonObjectives=Management.generateFederationObjectives(sp,save.year||2034,{olympicYear:(save.year||2034)%4===0});
    if(!Array.isArray(f.objectiveHistory)) f.objectiveHistory=[];
    if(!f.tactics)f.tactics={M:'balanced',F:'balanced'};
    if(!f.defenseSchemes)f.defenseSchemes={M:sp.id==='handball'?'6-0':sp.id==='basketball'?'man':'standard',F:sp.id==='handball'?'6-0':sp.id==='basketball'?'man':'standard'};
    if(!f.tacticalFamiliarity)f.tacticalFamiliarity={M:70,F:70};
  }
}

function dateLabel(save = state.save){ return `${String(save.day).padStart(2,'0')}/${String(save.month).padStart(2,'0')}/${save.year}`; }
function nextCompetition(){ return (state.save?.competitions||[]).filter(c=>['upcoming','live-pending'].includes(c.status)).sort(byCompetitionDate)[0] || null; }
function byCompetitionDate(a,b){ return a.year===b.year ? (a.month===b.month ? a.day-b.day : a.month-b.month) : a.year-b.year; }
function competitionDaysAway(c){
  const now = new Date(state.save.year, state.save.month-1, state.save.day);
  const then = new Date(c.year, c.month-1, c.day);
  return Math.max(0, Math.round((then-now)/86400000));
}

function handleAction(action){
  if(action==='save') { persist(); toast('Partie sauvegardée.'); return; }
  if(action==='install') { installApp(); return; }
  if(action==='back') { persist(); state.screen='landing'; state.save=null; state.modal=null; render(); return; }
  if(action==='nextDecision') { const d=nextDecisionItem(); if(d){state.modal={type:'decision',decisionId:d.id};openModal();}else advanceUntil('decision'); return; }

  if(action==='day') { advanceTime(1); return; }
  if(action==='week') { advanceTime(7); return; }
  if(action==='month') { advanceTime(30); return; }
}

function filteredAthletes(){
  return state.save.athletes.filter(a=>{
    const q = state.filters.q.toLowerCase();
    if(q && !(`${a.name} ${a.discipline}`.toLowerCase().includes(q))) return false;
    if(state.filters.sport && a.sportId!==state.filters.sport) return false;
    if(state.filters.region && a.region!==state.filters.region) return false;
    if(state.filters.sex && a.sex!==state.filters.sex) return false;
    if(state.filters.age==='young' && !(a.age<=20)) return false;
    if(state.filters.age==='prime' && !(a.age>=21 && a.age<=27)) return false;
    if(state.filters.age==='veteran' && !(a.age>=28)) return false;
    if(state.filters.potential==='elite' && !(a.potentialMin>=92)) return false;
    if(state.filters.potential==='high' && !(a.potentialMin>=85)) return false;
    if(state.filters.status==='injured' && !(a.injuredDays>0)) return false;
    if(state.filters.status==='hot' && !(a.form>=86)) return false;
    if(state.filters.status==='rising' && !(a.trend==='↗')) return false;
    return true;
  }).sort((a,b)=>b.ability-a.ability);
}

}

function bindAthleteFilters(){
  ['fltQ','fltSport','fltRegion','fltSex','fltAge','fltPotential','fltStatus'].forEach(id=>{
    const el = $('#'+id); if(!el) return;
    el.addEventListener(id==='fltQ'?'input':'change', ()=>{
      const cursor=id==='fltQ'?(el.selectionStart??el.value.length):null;
      state.filters = {
        q:$('#fltQ')?.value||'', sport:$('#fltSport')?.value||'', region:$('#fltRegion')?.value||'', sex:$('#fltSex')?.value||'', age:$('#fltAge')?.value||'', potential:$('#fltPotential')?.value||'', status:$('#fltStatus')?.value||''

      state.athletePage=1; state.screen='athletes'; render();
      if(id==='fltQ'){const q=$('#fltQ');if(q){q.focus();try{q.setSelectionRange(cursor,cursor);}catch{}}}

function sportById(id){ return SPORTS.find(s=>s.id===id); }
function openAthlete(id){ state.selectedAthlete = state.save.athletes.find(a=>a.id===id) || null; state.modal = {type:'athlete'}; openModal(); }
function navigateToNotification(id){
  const n=state.save.notifications.find(x=>x.id===id);if(!n)return;
  state.modal=null;state.screen=n.target||'dashboard';
  let athleteId=n.athleteId;
  if(!athleteId&&n.target==='athletes'){
    const all=[...state.save.athletes,...(state.save.retiredAthletes||[])];const match=all.find(a=>(n.title||'').includes(a.name)||(n.text||'').includes(a.name));athleteId=match?.id;
  }
  render();
  if(athleteId&&state.screen==='athletes'&&state.save.athletes.some(x=>x.id===athleteId))openAthlete(athleteId);
}


function modalHtml(){
  const m = state.modal;
  if(!m) return '';
  if(m.type==='load' || m.type==='delete') return saveListModal(m.type==='delete');
  if(m.type==='new') return newCareerModal();
  if(m.type==='athlete') return athleteModal();
  if(m.type==='sport') return sportModal(m.sportId);
  if(m.type==='decision') return decisionModal(m.decisionId);
  if(m.type==='matchreport') return matchReportModal(m.competitionId);
  if(m.type==='livematch') return liveMatchModal();
  if(m.type==='more') return moreModal();
  if(m.type==='settings') return settingsModal();
  if(m.type==='tutorial') return tutorialModal();
  return '';
}
function openModal(){
  closeModal();
  document.body.insertAdjacentHTML('beforeend', modalHtml());
  bindModal();
}
function closeModal(){ $('#modal')?.remove(); }
function bindModal(){
  const wrap = $('#modal'); if(!wrap) return;
  wrap.addEventListener('click',e=>{ if(e.target.id==='modal') { if(state.modal?.type==='livematch')stopLivePlayback(); state.modal=null; closeModal(); }});
  $('#closeModal')?.addEventListener('click',()=>{ if(state.modal?.type==='livematch')stopLivePlayback(); state.modal=null; closeModal(); });
  $('#backStep')?.addEventListener('click',()=>{ if(state.modal?.step>1){ state.modal.step--; closeModal(); openModal(); } });
  $('#nextStep')?.addEventListener('click',()=>{ if(state.modal?.step<3){ state.modal.step++; closeModal(); openModal(); } });
  $('#createCareer')?.addEventListener('click',()=>{ const d=state.modal.data; state.save=freshSave(d); state.screen='dashboard'; state.modal={type:'tutorial',step:1}; persist(); render(); toast('Nouvelle carrière créée.'); });
  $$('[data-pick-country]').forEach(el=>el.addEventListener('click',()=>{ state.modal.data.countryId=el.dataset.pickCountry; closeModal(); openModal(); }));
  $$('[data-pick-mode]').forEach(el=>el.addEventListener('click',()=>{ state.modal.data.mode=el.dataset.pickMode; closeModal(); openModal(); }));
  $('#pickDuration')?.addEventListener('change',e=>{ state.modal.data.duration=e.target.value; });
  $('#pickDifficulty')?.addEventListener('change',e=>{ state.modal.data.difficulty=e.target.value; });
  $$('[data-load-save]').forEach(el=>el.addEventListener('click',()=>loadSave(el.dataset.loadSave)));
  $$('[data-delete-save]').forEach(el=>el.addEventListener('click',()=>{ deleteSave(el.dataset.deleteSave); openModal(); }));
  $$('[data-more-nav]').forEach(el=>el.addEventListener('click',()=>{ state.screen=el.dataset.moreNav; state.modal=null; render(); }));
  $$('[data-decision-choice]').forEach(el=>el.addEventListener('click',()=>applyDecision(el.dataset.decisionChoice,el.dataset.choice)));
  $$('[data-invest]').forEach(el=>el.addEventListener('click',()=>investInFederation(el.dataset.sportId,el.dataset.invest)));
  $$('[data-focus]').forEach(el=>el.addEventListener('click',()=>setTrainingFocus(el.dataset.sportId,el.dataset.focus)));
  $$('[data-select-athlete]').forEach(el=>el.addEventListener('click',()=>toggleSelection(el.dataset.selectAthlete)));
  $$('[data-renew-staff]').forEach(el=>el.addEventListener('click',()=>renewStaff(el.dataset.sportId,el.dataset.renewStaff)));
  $$('[data-recruit-staff]').forEach(el=>el.addEventListener('click',()=>recruitStaff(el.dataset.sportId,el.dataset.recruitStaff)));
  $$('[data-athlete-plan]').forEach(el=>el.addEventListener('click',()=>setAthletePlan(el.dataset.athleteId,el.dataset.athletePlan)));
  $$('[data-team-tactic]').forEach(el=>el.addEventListener('click',()=>setTeamTactic(el.dataset.sportId,el.dataset.teamSex,el.dataset.teamTactic)));
  $$('[data-live-start]').forEach(el=>el.addEventListener('click',()=>startLiveFriendly(el.dataset.liveStart,el.dataset.teamSex||'M')));
  $$('[data-live-resume]').forEach(el=>el.addEventListener('click',()=>{if(state.liveMatchSession){state.modal={type:'livematch'};openModal();}}));
  $$('[data-live-abandon]').forEach(el=>el.addEventListener('click',()=>abandonLiveMatch()));
  $('[data-live-advance]').forEach(el=>el.addEventListener('click',()=>{stopLivePlayback();advanceLiveMatch(Number(el.dataset.liveAdvance)||1);}));
  $('[data-live-speed]').forEach(el=>el.addEventListener('click',()=>startLivePlayback(Number(el.dataset.liveSpeed)||1)));
  $('#livePause')?.addEventListener('click',()=>{stopLivePlayback();openModal();});
  $('[data-live-command]').forEach(el=>el.addEventListener('click',()=>liveCoachCommand(el.dataset.liveCommand,el.dataset.tactic||null)));
  $('[data-live-scheme]').forEach(el=>el.addEventListener('click',()=>liveCoachScheme(el.dataset.liveScheme)));
  $('[data-live-sub-out]').forEach(el=>el.addEventListener('click',()=>{stopLivePlayback();state.liveSubOutId=el.dataset.liveSubOut;openModal();}));
  $$('[data-live-sub-in]').forEach(el=>el.addEventListener('click',()=>completeLiveSubstitution(el.dataset.liveSubIn)));
  $('#liveFinish')?.addEventListener('click',finishLiveMatch);
  $('#liveClose')?.addEventListener('click',closeFinishedLiveMatch);
  $('#tutorialBack')?.addEventListener('click',()=>{state.modal.step=Math.max(1,(state.modal.step||1)-1);openModal();});
  $('#tutorialNext')?.addEventListener('click',()=>{state.modal.step=Math.min(4,(state.modal.step||1)+1);openModal();});
  $('#tutorialFinish')?.addEventListener('click',()=>{if(state.save){state.save.tutorialSeen=true;persist();}state.modal=null;closeModal();render();});
  $('#tutorialSkip')?.addEventListener('click',()=>{if(state.save){state.save.tutorialSeen=true;persist();}state.modal=null;closeModal();});
  $('#settingsTutorial')?.addEventListener('click',()=>{state.modal={type:'tutorial',step:1};openModal();});
  $('#settingsExport')?.addEventListener('click',exportSaveBundle);
  $('#settingsImport')?.addEventListener('click',triggerImport);
  const saveSettings=()=>{const st={reducedMotion:!!$('#settingMotion')?.checked,compact:!!$('#settingCompact')?.checked};localStorage.setItem(SETTINGS_KEY,JSON.stringify(st));applyGameSettings();};
  $('#settingMotion')?.addEventListener('change',saveSettings);$('#settingCompact')?.addEventListener('change',saveSettings);
  wrap.querySelectorAll('[data-athlete]').forEach(el=>el.addEventListener('click',()=>{ state.modal=null; closeModal(); openAthlete(el.dataset.athlete); }));
}

function saveOfficialProgress(c){

function prepareOfficialCompetition(c,rng){

function officialEventById(c,eventId){return competitionEvents(c).find(e=>e.id===eventId)||null;}
function buildOfficialTournamentForEvent(c,event,context){
  const seed=(context.seed+hashSeed(event.id)+context.eventIndex*7919)>>>0;
  const rng=rngObj(seed);
  const userTeam=userTeamForEvent(event),rule=GameConfig.TEAM_RULES[c.sportId];
  const foreign=Object.values(state.save.world.nations).filter(n=>n.id!==state.save.countryId).map(n=>foreignTeamForEvent(n,event,rng,context.olympics)).sort((a,b)=>b.strength-a.strength);
  if(userTeam.roster.length<rule.minimum){return {insufficient:true,userTeam,event,seed};}
  const participants=[userTeam,...foreign.slice(0,TeamMatch.RULES[c.sportId].tournamentTeams-1)].sort((a,b)=>b.strength-a.strength);
  const tournament=OfficialTournament.createTournament(c.sportId,participants,{focusTeamId:state.save.countryId,seed,metadata:{competitionId:c.id,eventId:event.id}});
  tournament._userTeam=userTeam;tournament._event=event;
  return tournament;
}
function resumeOfficialCompetition(competitionId){

}

function launchOfficialLiveMatch(c,event,tournament,pending){

function officialOutcomeHistory(tournament,event,rank){
  const team=tournament._userTeam;if(!team?.roster?.length)return;
  const games=tournament.matches.filter(m=>m.homeId===state.save.countryId||m.awayId===state.save.countryId).length;
  const medalBoost=rank===1?5:rank===2?3:rank===3?2:0;
  const athleteById=new Map(state.save.athletes.map(a=>[a.id,a]));
  team.roster.forEach(src=>{
    const a=athleteById.get(src.sourceId||src.id)||src;
    a.confidence=clamp(Math.round(a.confidence+medalBoost-(rank>8?2:0)),30,100);
    a.form=clamp(Math.round(a.form+(rank<=3?2:rank<=5?1:-1)),40,100);
    a.history=a.history||[];a.history.push({date:`${String(state.save.month).padStart(2,'0')}/${state.save.year}`,event:event.name,detail:`${rank===1?'Champion':rank===2?'Finaliste':rank===3?'Médaille de bronze':`${rank}e`} · ${games} match(s) officiels coachés`,result:rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':''});
  });
  const fed=federationFor(event.sportId);if(fed?.tacticalFamiliarity)fed.tacticalFamiliarity[event.sex]=clamp((fed.tacticalFamiliarity[event.sex]||70)+Math.min(8,games*.9),35,100);
}
function completeOfficialEvent(c,event,tournament){
  const rank=tournament.placement[tournament._userTeam.name]||Infinity;
  const podium=tournament.podium.map(t=>({nationId:t.nationId,name:t.name}));
  const reports=tournament.matches.filter(m=>m.homeId===state.save.countryId||m.awayId===state.save.countryId);
  officialOutcomeHistory(tournament,event,rank);
  if(state.officialCompetition.qualifier)qualifyEvent(c.sportId,event,rank,c.name);
  if(state.officialCompetition.olympics)awardOlympicPodium(podium);
  const finalUserMatch=reports[reports.length-1];
  state.officialCompetition.results.push({event,podium,bestRank:rank,userResults:[{rank,athlete:tournament._userTeam.name,detail:`${rank===1?'Champion':rank===2?'Finaliste':rank===3?'Bronze':`${rank}e`} · ${reports.length} matchs coachés · ${finalUserMatch?matchReportSummary(finalUserMatch):'—'}`}],matchReports:reports});
  state.officialCompetition.eventIndex++;
  state.officialTournament=null;saveOfficialProgress(c);
}
function finalizeOfficialCompetition(c){
  const context=state.officialCompetition,results=context.results;
  c.status='done';clearOfficialProgress(c);
  const podiums=results.flatMap(r=>r.podium.map((p,i)=>({event:r.event.name,rank:i+1,nationId:p.nationId,nation:state.save.world.nations[p.nationId]?.name||p.nationId,athlete:p.name,medal:i===0?'🥇':i===1?'🥈':'🥉'})));
  c.results=podiums;c.matchReports=results.flatMap(r=>r.matchReports||[]).slice(-80);c.officialCoached=true;
  const userBest=results.length?Math.min(...results.map(r=>r.bestRank)):Infinity,winner=podiums[0];
  if(context.olympics){
    const userMedals=podiums.filter(p=>p.nationId===state.save.countryId);
    state.save.history.push({kind:'competition',name:c.name,date:dateLabel(),summary:`${userMedals.length} médaille(s) après coaching officiel · meilleur rang ${Number.isFinite(userBest)?userBest:'—'}.`});
    state.save.notifications.unshift({id:`official_done_${c.id}`,type:'olympics',title:`Grands Jeux — ${sportById(c.sportId).name}`,text:`Tournoi coaché terminé : ${userMedals.length} médaille(s).`,target:'competitions',competitionId:c.id});
  }else{
    state.save.history.push({kind:'competition',name:c.name,date:dateLabel(),summary:`${winner?`Vainqueur : ${winner.nation}`:'Tournoi terminé'}. Meilleur rang ${currentCountry().name} : ${Number.isFinite(userBest)?userBest+'e':'—'} · coaching officiel.`});
    state.save.notifications.unshift({id:`official_done_${c.id}`,type:context.qualifier?'qualification':'result',title:`Résultat — ${c.name}`,text:context.qualifier?`${qualificationEventCount(c.sportId)} épreuve(s) qualifiée(s) après tournoi coaché.`:`Meilleur résultat ${currentCountry().name} : ${Number.isFinite(userBest)?userBest+'e':'—'}.`,target:'competitions',competitionId:c.id});
  }
  if(context.olympics)updateWorldRankFromOlympics();else applyWorldRankingFromCompetition(c,results);
  state.officialCompetition=null;state.officialTournament=null;state.liveMatchMeta=null;persist();render();toast('Compétition officielle terminée et enregistrée.');
}
function advanceOfficialCompetition(){
  const context=state.officialCompetition;if(!context)return;
  const c=state.save.competitions.find(x=>x.id===context.competitionId);if(!c)return;
  while(context.eventIndex<context.eventIds.length){
    const event=officialEventById(c,context.eventIds[context.eventIndex]);if(!event){context.eventIndex++;continue;}
    if(!state.officialTournament){
      const built=buildOfficialTournamentForEvent(c,event,context);
      if(built.insufficient){if(context.qualifier)qualifyEvent(c.sportId,event,Infinity,c.name);context.results.push({event,podium:[],bestRank:Infinity,userResults:[],matchReports:[]});context.eventIndex++;continue;}
      state.officialTournament=built;saveOfficialProgress(c);
    }
    const step=OfficialTournament.advance(state.officialTournament);
    if(step.type==='live'){launchOfficialLiveMatch(c,event,state.officialTournament,step.match);return;}
    completeOfficialEvent(c,event,state.officialTournament);
  }
  finalizeOfficialCompetition(c);
}
function submitOfficialLiveResult(result){
  const context=state.officialCompetition,tournament=state.officialTournament;if(!context||!tournament)return false;
  const c=state.save.competitions.find(x=>x.id===context.competitionId);if(!c)return false;
  const event=officialEventById(c,context.eventIds[context.eventIndex]);
  applyLiveMatchToCareer(result);
  const step=OfficialTournament.submitLiveResult(tournament,result);saveOfficialProgress(c);
  state.liveMatchSession=null;state.liveMatchResult=null;state.liveSubOutId=null;state.liveMatchMeta=null;
  if(step.type==='live'){launchOfficialLiveMatch(c,event,tournament,step.match);return true;}
  completeOfficialEvent(c,event,tournament);advanceOfficialCompetition();return true;
}

function showOfficialTimeBlock(result){
  const c=state.save.competitions?.find(x=>x.id===result?.competitionId)||state.save.competitions?.find(x=>x.status==='live-pending');
  if(!c)return false;
  state.screen='competitions';
  state.modal=null;
  persist();
  render();
  toast(`🏆 ${c.name} est prête : choisis « Coacher » ou « Simuler » pour continuer.`);
  return true;
}
function advanceUntil(kind){
  if(state.save.careerComplete){toast('Carrière terminée. Consulte ton bilan dans Histoire.');return;}
  let limit=370,progressed=0,block=null;
  const completedStart=state.save.competitions.filter(c=>c.status==='done').length;
  while(limit-->0){
    const step=advanceOneDay();
    if(step.advanced)progressed++;
    if(step.reason==='official'){block=step;break;}
    if(!step.advanced)break;
    if(kind==='competition'&&state.save.competitions.filter(c=>c.status==='done').length>completedStart)break;
    if(kind==='decision'&&nextDecisionItem())break;
  }
  if(block&&showOfficialTimeBlock(block))return;
  persist();render();
  if(kind==='competition'&&progressed===0)toast('Aucune compétition accessible pour le moment.');
  else toast(`${progressed} jour${progressed>1?'s':''} simulé${progressed>1?'s':''}`);
}
function advanceTime(days){
  if(state.save.careerComplete){toast('Carrière terminée. Consulte ton bilan dans Histoire.');return;}
  let progressed=0,block=null;
  for(let i=0;i<days;i++){
    const step=advanceOneDay();
    if(step.advanced)progressed++;
    if(step.reason==='official'){block=step;break;}
    if(!step.advanced)break;
  }
  if(block&&showOfficialTimeBlock(block))return;
  persist();render();toast(`${progressed} jour${progressed>1?'s':''} simulé${progressed>1?'s':''}`);
}

function advanceOneDay(){
  const s = state.save;
  if(s.careerComplete)return {advanced:false,reason:'career'};
  const pendingOfficial=s.competitions?.find(c=>c.status==='live-pending');
  if(pendingOfficial)return {advanced:false,reason:'official',competitionId:pendingOfficial.id};
  if(s.careerEndYear&&s.year===s.careerEndYear&&s.month===12&&s.day===31){s.careerComplete=true;s.history.push({kind:'career',name:'Fin de carrière',date:dateLabel(),summary:`Carrière de ${s.duration} terminée.`});s.notifications.unshift({id:'career_end_'+s.tick,type:'career',title:'Carrière terminée',text:'Ton mandat arrive à son terme. Le bilan est disponible dans Histoire.',target:'history'});return {advanced:false,reason:'career'};}
  const rng = rngObj((s.seed + s.tick*7919)>>>0);
  s.tick++;
  s.day++;
  const monthDays = new Date(s.year, s.month, 0).getDate();
  if(s.day>monthDays){ s.day=1; s.month++; if(s.month>12){ s.month=1; s.year++; yearRefresh(rng); } }

  s.athletes.forEach(a=>{
    const dev=Development.planEffects(a.developmentPlan||'balanced'),fac=facilityEffects();
    if(a.injuredDays>0){ a.injuredDays--; a.fatigue=clamp(a.fatigue-2-fac.recoveryBonus,0,100); a.form=clamp(Math.round(a.form-0.3),40,100); return; }
    a.fatigue = clamp(a.fatigue + (rng()<0.57?1:-1) + dev.fatigue - fac.recoveryBonus*.18, 0, 100);
    a.form = clamp(Math.round(a.form + randomNormal(rng)*1.1 + (a.fatigue<30?0.35:-0.18)), 42, 100);
    a.confidence = clamp(Math.round(a.confidence + randomNormal(rng)*0.6), 35, 100);
    if(s.tick%7===0) progressAthlete(a, rng);
    const med=federationFor(a.sportId)?.medicalLead.rating||65; const mods=Engine.careerModifiers(s.mode,s.difficulty); const risk=(a.injuryRisk/100)*(a.fatigue/100)*0.008*(1-(med-50)/180)*mods.injuryMultiplier*Development.injuryMultiplier(a.developmentPlan||'balanced')*facilityEffects().injuryMultiplier;
    if(rng()<risk){
      a.injuredDays = 3 + Math.floor(rng()*18);
      s.notifications.unshift({id:uid('n',rng),type:'injury',title:`Blessure — ${a.name}`,text:`Indisponibilité estimée : ${a.injuredDays} jours.`,target:'athletes',athleteId:a.id});
    }
  });

  if(s.tick%7===0)Object.values(s.federations||{}).forEach(f=>{if(f.tacticalFamiliarity){f.tacticalFamiliarity.M=clamp((f.tacticalFamiliarity.M||70)+.35,35,100);f.tacticalFamiliarity.F=clamp((f.tacticalFamiliarity.F||70)+.35,35,100);}});
  if(s.tick%28===0)s.athletes.forEach(a=>refineScoutingEstimate(a,rng));

  const due = s.competitions.filter(c=>c.status==='upcoming' && c.year===s.year && c.month===s.month && c.day===s.day);
  for(const c of due){simulateCompetition(c,rng);if(c.status==='live-pending')return {advanced:true,reason:'official',competitionId:c.id};}
  if(s.tick%14===0 && rng()<0.4) generateStory(rng);
  if(s.tick%45===0 && rng()<0.65 && s.notifications.filter(n=>n.decision&&!n.resolved).length<3) createManagementDecision(rng);
  if(s.notifications.length>22){
    const pending=s.notifications.filter(n=>n.decision&&!n.resolved);
    const rest=s.notifications.filter(n=>!(n.decision&&!n.resolved)).slice(0,Math.max(0,18-pending.length));
    s.notifications=[...pending,...rest];
  }
  return {advanced:true,reason:null};
}
function refineScoutingEstimate(a,rng){
  const country=currentCountry(),fed=federationFor(a.sportId);const mods=Engine.careerModifiers(state.save.mode,state.save.difficulty);
  const quality=clamp((country.scouting*mods.scoutingMultiplier+(fed?.youthDirector.rating||65)) / 2 + facilityEffects().scoutingBonus,40,99);

    if(a.discipline==='1500 m'){const t=clamp(252-(score-55)*1.25+randomNormal(rng)*.8,205,270);const m=Math.floor(t/60),sec=(t%60).toFixed(2).padStart(5,'0');return {key:a.discipline,value:`${m}:${sec}`,numeric:t,lower:true,detail:`1500 m en ${m}:${sec}`};}
    if(a.discipline==='5000 m'){const t=clamp(860-(score-55)*4.25+randomNormal(rng)*2.2,750,960);const m=Math.floor(t/60),sec=(t%60).toFixed(2).padStart(5,'0');return {key:a.discipline,value:`${m}:${sec}`,numeric:t,lower:true,detail:`5000 m en ${m}:${sec}`};}
    if(a.discipline==='Marathon'){const t=clamp(9300-(score-55)*46+randomNormal(rng)*24,7200,10800);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),sec=Math.round(t%60);const txt=`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;return {key:a.discipline,value:txt,numeric:t,lower:true,detail:`Marathon en ${txt}`};}
    if(a.discipline==='Saut en longueur'){const d=clamp(5.6+(score-55)*.062+randomNormal(rng)*.04,5.2,8.9);return {key:a.discipline,value:d.toFixed(2)+' m',numeric:d,lower:false,detail:`Saut à ${d.toFixed(2)} m`};}
  }
  if(sportId==='swimming'){
    const is200=a.discipline.includes('200 m');const t=(is200?clamp(126-(score-55)*.48+randomNormal(rng)*.18,101,132):clamp(58-(score-55)*.22+randomNormal(rng)*.12,46.2,60.5));
    return {key:a.discipline,value:t.toFixed(2)+' s',numeric:t,lower:true,detail:`${a.discipline} en ${t.toFixed(2)} s`};
  }
  if(sportId==='judo')return {key:a.discipline,value:`Victoire ${rank===0?'ippon':'aux points'}`,numeric:score,lower:false,detail:`${rank===0?'Victoire par ippon':'Combat maîtrisé'} · indice ${score.toFixed(1)}`};
  if(sportId==='gymnastics'){const pts=clamp(11.5+(score-55)*.075+randomNormal(rng)*.08,10.5,16.2);return {key:a.discipline,value:`${pts.toFixed(3)} pts`,numeric:pts,lower:false,detail:`Note ${pts.toFixed(3)}`};}
  if(sportId==='fencing'){const lost=clamp(Math.round(13-(score-55)*.12+randomNormal(rng)*1.2),4,14);return {key:a.discipline,value:`15–${lost}`,numeric:score,lower:false,detail:`Assaut remporté 15–${lost}`};}
  if(sportId==='boxing'){const ko=score>86&&rng()<.32;return {key:a.discipline,value:ko?'Victoire KO':'Décision',numeric:score,lower:false,detail:ko?'Victoire par arrêt avant la limite':'Victoire aux points'};}
  if(sportId==='rowing'){const t=clamp(430-(score-55)*2.05+randomNormal(rng)*1.2,330,455);const m=Math.floor(t/60),sec=(t%60).toFixed(2).padStart(5,'0');return {key:a.discipline,value:`${m}:${sec}`,numeric:t,lower:true,detail:`Temps ${m}:${sec}`};}
  if(sportId==='canoe'){const slalom=a.discipline==='Slalom';const t=slalom?clamp(118-(score-55)*.72+randomNormal(rng)*.6,82,125):clamp(112-(score-55)*.62+randomNormal(rng)*.5,76,120);return {key:a.discipline,value:`${t.toFixed(2)} s`,numeric:t,lower:true,detail:`${t.toFixed(2)} s`};}
  if(sportId==='cycling'){const isTT=a.discipline==='Contre-la-montre';const t=isTT?clamp(2700-(score-55)*18+randomNormal(rng)*8,2100,2850):clamp(13200-(score-55)*65+randomNormal(rng)*25,9600,14000);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),sec=Math.round(t%60);const txt=isTT?`${Math.floor(t/60)}:${String(sec).padStart(2,'0')}`:`${h}h${String(m).padStart(2,'0')}`;return {key:a.discipline,value:txt,numeric:t,lower:true,detail:`Temps ${txt}`};}
  if(sportId==='tennis'){const straight=score>80||rng()<.58;return {key:a.discipline,value:straight?'2–0':'2–1',numeric:score,lower:false,detail:`Victoire ${straight?'2 sets à 0':'2 sets à 1'}`};}
  if(sportId==='tabletennis'){const lost=score>82&&rng()<.55?1:2;return {key:a.discipline,value:`4–${lost}`,numeric:score,lower:false,detail:`Victoire 4 manches à ${lost}`};}
  if(sportId==='archery'){const pts=clamp(Math.round(570+(score-55)*3.1+randomNormal(rng)*4),520,700);return {key:a.discipline,value:`${pts} pts`,numeric:pts,lower:false,detail:`${pts} points`};}
  return {key:a.discipline,value:`${score.toFixed(1)} pts`,numeric:score,lower:false,detail:`Performance ${score.toFixed(1)} pts`};
}

function updateRecord(a, sportId, out){
  const key = `${sportById(sportId).name} — ${out.key}`;
  const old = state.save.records[key];
  const better = !old || (out.lower ? out.numeric<old.numeric : out.numeric>old.numeric);
  if(better){ state.save.records[key] = {athlete:a.name, value:out.value, numeric:out.numeric, lower:out.lower}; a.pb = out.value; }
}
function generateStory(rng){
  const candidates = state.save.athletes.filter(a=>a.age<=21 && a.potentialMax>=92);
  if(!candidates.length) return;
  const a = candidates[Math.floor(rng()*candidates.length)];
  state.save.notifications.unshift({id:uid('n',rng),type:'talent',title:`Révélation — ${a.name}`,text:`Sa progression attire l’attention du staff national. Potentiel estimé ${Math.round(a.potentialMin)}-${Math.round(a.potentialMax)}.`,target:'athletes',athleteId:a.id});
}
function processRetirements(rng){
  const retired=[];
  state.save.athletes=state.save.athletes.filter(a=>{
    const threshold=peakAge(a.sportId)+6;if(a.age<34||a.age<threshold)return true;
    const chance=clamp(.28+(a.age-threshold)*.13+(a.ability<68?.12:0),.18,.96);
    if(a.age>=40||rng()<chance){retired.push({...a,retiredYear:state.save.year,selected:false});return false;}return true;
  });
  if(retired.length){
    state.save.retiredAthletes.push(...retired);
    state.save.history.push({kind:'retirements',name:'Retraites sportives',date:dateLabel(),summary:`${retired.length} athlète(s) quittent le haut niveau.`});
    state.save.notifications.unshift({id:uid('n',rng),type:'retirement',title:`${retired.length} retraite(s) sportive(s)`,text:`${retired.slice(0,3).map(a=>a.name).join(', ')}${retired.length>3?'…':''} quittent le haut niveau.`,target:'history'});
  }
}

function ensureMinimumSelections(){
  SPORTS.filter(sp=>Engine.isTeamSport(sp.id)).forEach(sp=>{
    GameConfig.SEXES.forEach(sex=>{
      const rule=GameConfig.TEAM_RULES[sp.id];
      const count=state.save.athletes.filter(a=>a.sportId===sp.id&&a.sex===sex.id&&a.selected&&!a.injuredDays).length;
      const id=`selection_warn_${state.save.year}_${sp.id}_${sex.id}`;
      if(count<rule.minimum&&!state.save.notifications.some(n=>n.id===id)){
        state.save.notifications.unshift({id,type:'selection',title:`Sélection incomplète — ${sportById(sp.id).name} ${sex.label}`,text:`${count}/${rule.minimum} athlètes disponibles. Complète toi-même la sélection avant la prochaine compétition.`,target:'athletes'});
      }
    });
  });
}

function rebalanceBudgetIfNeeded(){
  const before=Engine.reserveBudget(state.save.budget,state.save.sports);if(before>=0)return false;
  state.save.sports=Engine.normalizeBudgets(state.save.sports,state.save.budget,.02);
  state.save.notifications.unshift({id:'budget_rebalance_'+state.save.year,type:'budget',title:'Rééquilibrage budgétaire',text:'La baisse de l’enveloppe nationale a imposé une réduction proportionnelle des budgets fédéraux.',target:'finances'});return true;
}
function archiveOlympicEdition(year){
  const table=sortedWorldMedals().map(r=>({id:r.id,name:r.name,flag:r.flag,g:r.g,s:r.s,b:r.b,total:r.total}));
  state.save.olympicEditions.push({year,countryId:state.save.countryId,medals:{...state.save.medals},worldRank:state.save.worldRank,table});
}


function closeFederationSeason(previousYear){
  state.save.sports.forEach(sp=>{
    const fed=federationFor(sp.id);if(!fed)return;
    const evaluation=Management.evaluateFederationObjectives(sp,state.save.qualifications?.[sp.id],fed.seasonObjectives||[]);
    fed.objectiveHistory.unshift({year:previousYear,score:evaluation.score,achieved:evaluation.achieved,total:evaluation.total,details:evaluation.details.map(d=>({id:d.id,label:d.label,achieved:d.achieved,value:d.value,target:d.target}))});
    fed.objectiveHistory=fed.objectiveHistory.slice(0,12);
    fed.morale=clamp(fed.morale+evaluation.moraleDelta,0,100);
    fed.efficiency=clamp(fed.efficiency+evaluation.efficiencyDelta,0,100);
    if(evaluation.score>=80||evaluation.score<35){
      state.save.notifications.unshift({id:`obj_${previousYear}_${sp.id}`,type:'objective',title:`Bilan ${sportById(sp.id).name} — ${evaluation.score}/100`,text:evaluation.score>=80?'Objectifs largement atteints : la fédération gagne en confiance.':'Objectifs manqués : moral et efficacité sont sous pression.',target:'management'});
    }
    fed.seasonObjectives=Management.generateFederationObjectives(sp,state.save.year,{olympicYear:state.save.year%4===0});
  });
}
function processStaffContracts(){
  state.save.sports.forEach(sp=>{
    const fed=federationFor(sp.id);if(!fed)return;
    for(const role of ['headCoach','youthDirector','medicalLead']){
      let member=Management.normalizeStaffMember(fed[role],role,state.save.year);
      const status=Management.contractStatus(member,state.save.year);
      if(status==='expired'){
        const oldName=member.name;
        member={...member,name:`Intérim — ${oldName.split(' ').slice(-1)[0]}`,rating:clamp(member.rating-10,45,90),salary:Math.round(Math.max(.3,member.salary*.65)*10)/10,contractEnd:state.save.year+1,specialty:'Intérim'};
        fed[role]=member;fed.morale=clamp(fed.morale-4,0,100);fed.efficiency=clamp(fed.efficiency-2,0,100);
        state.save.notifications.unshift({id:`staff_exp_${state.save.year}_${sp.id}_${role}`,type:'staff',title:`Contrat expiré — ${sportById(sp.id).name}`,text:`${oldName} a quitté son poste de ${GameConfig.STAFF_ROLES[role].label.toLowerCase()}. Un intérim moins performant est en place.`,target:'management'});
      }else{
        fed[role]=member;
        if(status==='expiring') state.save.notifications.unshift({id:`staff_warn_${state.save.year}_${sp.id}_${role}`,type:'staff',title:`Contrat à renouveler — ${sportById(sp.id).name}`,text:`${member.name}, ${GameConfig.STAFF_ROLES[role].label.toLowerCase()}, arrive en fin de contrat cette saison.`,target:'management'});
      }
    }
  });
}

function processAnnualEconomy(previousYear,rng){
  const eco=economyState();if(!eco)return;
  const majorPodiums=state.save.athletes.reduce((sum,a)=>sum+a.history.filter(h=>String(h.date||'').endsWith('/'+previousYear)&&['🥇','🥈','🥉'].includes(h.result)&&!/Championnats nationaux/.test(h.event||'')).length,0);
  const settlement=Economy.settleSponsors(eco.activeSponsors,{worldRank:state.save.worldRank,medals:majorPodiums});
  eco.sponsorHistory.unshift({year:previousYear,revenue:Economy.annualSponsorRevenue(eco.activeSponsors),bonus:settlement.bonus,penalty:settlement.penalty,active:eco.activeSponsors.map(s=>s.name)});
  eco.sponsorHistory=eco.sponsorHistory.slice(0,15);eco.activeSponsors=settlement.next;
  eco.publicGrant=Math.max(35,Math.round((eco.publicGrant||currentCountry().budget)*(.985+rng()*.045)));
  eco.sponsorOffers=Economy.createSponsorOffers({countryId:state.save.countryId,worldRank:state.save.worldRank,year:state.save.year,count:3}).filter(o=>!eco.activeSponsors.some(a=>a.name===o.name));
  eco.lastAnnualRevenue=Economy.annualSponsorRevenue(eco.activeSponsors);
  eco.reputation=clamp((eco.reputation||60)+(state.save.worldRank<=10?2:-1)+(settlement.bonus>settlement.penalty?1:-1),30,99);
  state.save.budget=Math.round((eco.publicGrant+eco.lastAnnualRevenue+settlement.netAdjustment)*10)/10;
  state.save.notifications.unshift({id:`eco_${state.save.year}`,type:'budget',title:`Budget national ${state.save.year}`,text:`Subvention ${Math.round(eco.publicGrant)} M€ · sponsors ${eco.lastAnnualRevenue} M€ · ajustement ${settlement.netAdjustment>=0?'+':''}${settlement.netAdjustment} M€.`,target:'finances'});
}

function yearRefresh(rng){
  const country=currentCountry(),previousYear=state.save.year-1;
  closeFederationSeason(previousYear);
  state.save.centralSpend=0;
  processStaffContracts();
  if(previousYear%4===0){archiveOlympicEdition(previousYear);state.save.medals={g:0,s:0,b:0};}
  processAnnualEconomy(previousYear,rng);rebalanceBudgetIfNeeded();
  state.save.sports.forEach(sp=>{
    const bf=Engine.budgetFactor(sp);sp.youth=clamp(sp.youth+Math.round(randomNormal(rng)*2+(bf-1)*2),45,97);sp.infrastructure=clamp(sp.infrastructure+Math.round(randomNormal(rng)*1.5+(bf-1)),50,97);sp.ranking=clamp(sp.ranking+Math.round(randomNormal(rng)*1.2-(bf-1)*2),1,35);
    const fed=federationFor(sp.id);if(fed&&bf<.82)fed.morale=clamp(fed.morale-3,0,100);else if(fed&&bf>1.08)fed.morale=clamp(fed.morale+2,0,100);
  });
  state.save.athletes.forEach(a=>a.age++);processRetirements(rng);
  state.save.sports.forEach(sp=>{const f=federationFor(sp.id);if(f&&rng()<.50)generateYouthProspects(sp.id,1+(rng()<.25?1:0));});ensureMinimumSelections();
  Object.values(state.save.world.nations).forEach(n=>Object.values(n.sports).forEach(sp=>{sp.form=clamp(sp.form+Math.round(randomNormal(rng)*2),50,99);sp.strength=clamp(sp.strength+Math.round(randomNormal(rng)*1.2),45,99)}));
  if(state.save.year%4!==0&&state.save.olympicCycle.next<state.save.year)state.save.olympicCycle.next=nextOlympicYear(state.save.year);
  if(state.save.year%4===0){
    state.save.sports.forEach(sp=>{
      const q=state.save.qualifications[sp.id]||createQualificationState()[sp.id];
      const rankThreshold=Engine.isTeamSport(sp.id)?6:8;
      if(sp.ranking<=rankThreshold){
        Engine.eventsForSport(sp.id).forEach(ev=>{
          if(Engine.isTeamSport(sp.id)&&sp.ranking>6)return;
          const hasEntrant=ev.type==='team'?Engine.teamStrength(state.save.athletes,ev,{coach:federationFor(sp.id)?.headCoach.rating,efficiency:federationFor(sp.id)?.efficiency,morale:federationFor(sp.id)?.morale,budgetFactor:Engine.budgetFactor(sp)}).roster.length>=GameConfig.TEAM_RULES[sp.id].minimum:Engine.eventEntries(state.save.athletes,ev,{selectedOnly:true,limit:1}).length>0;
          if(hasEntrant){q.events[ev.id]={qualified:true,score:Math.max(q.events?.[ev.id]?.score||0,100-sp.ranking*3),status:`Qualifié au classement mondial (#${sp.ranking})`};}
        });
      }
      q.qualified=Object.values(q.events||{}).some(e=>e.qualified);q.status=q.qualified?`${Object.values(q.events).filter(e=>e.qualified).length}/${Object.keys(q.events).length} épreuve(s) qualifiée(s)`:'Non qualifié';state.save.qualifications[sp.id]=q;
    });
    state.save.olympicCycle.qualifiedTotal=qualificationCount();
  }
  if(state.save.year%4===1){
    state.save.qualifications=createQualificationState();Object.values(state.save.world.nations).forEach(n=>n.medalTable={g:0,s:0,b:0});state.save.olympicCycle={next:nextOlympicYear(state.save.year),qualifiedTotal:0};
  }
  state.save.competitions=buildCompetitionSchedule(state.save.year,country.id);
  state.save.notifications.unshift({id:uid('n',rng),type:'season',title:`Nouvelle saison ${state.save.year}`,text:`Nouveau calendrier international disponible. Prochains Grands Jeux : ${state.save.olympicCycle.next}.`,target:'competitions'});
}



migrateLegacyStorage();
if(!globalThis.__ON_TEST__&&!globalThis.__NG_TEST__){applyGameSettings();render();}

</script></body></html>
