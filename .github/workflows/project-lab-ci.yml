name: Project Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in v4-1.js v4-2.js v4-3.js v4-4.js v4-5.js v5-1.js v5-2.js v5-2-core.js v6.js v6-preflight.js v7.js v8-1.js v8-2.js v8-3.js v9-1.js v9-2.js v9-preflight.js v10-1.js v10-2.js v10-preflight.js v10-standalone.js v10-fix.js v10-4-install.js sw.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check V10.5 shell and PWA
        run: |
          set -e
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s project-lab-logo-v10.svg
          test -s v10-4-install.js
          grep -q '10.5.0' index.html
          grep -q 'jlgInstallHeaderBtn' index.html
          grep -q 'project-lab-logo-v10.svg' index.html
          grep -q 'v5-2.js?v=10.5.0' index.html
          grep -q 'v10-4-install.js' v5-2.js
          grep -q '10.5.0' manifest.webmanifest
          grep -q 'jlg-project-lab-360-v10-5' sw.js
          grep -q 'Installer l.application' v10-4-install.js
          grep -q 'intent://' v10-4-install.js
          ! grep -q 'project-lab-360-v6-192.png' v6-preflight.js
          ! grep -q 'project-lab-360-v6-192.png' v9-preflight.js
          grep -q 'Aucun compte, aucun serveur obligatoire' v10-standalone.js
          grep -q 'AES-GCM' v10-standalone.js
