name: Project Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in v4-1.js v4-2.js v4-3.js v4-4.js v4-5.js v5-1.js v5-2.js v5-2-core.js v6.js v6-preflight.js v7.js v8-1.js v8-2.js v8-3.js v9-1.js v9-2.js v9-preflight.js v10-1.js v10-2.js v10-preflight.js v10-standalone.js v10-fix.js sw.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check critical standalone PWA files
        run: |
          set -e
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s project-lab-logo-v10.svg
          test -s project-lab-logo-v10-192.png
          test -s project-lab-logo-v10-512.png
          test -s v10.css
          test -s v10-1.js
          test -s v10-2.js
          test -s v10-preflight.js
          test -s v10-standalone.js
          test -s v10-fix.js
          grep -q 'v10-fix.js' v5-2.js
          grep -q 'v10-fix.js' sw.js
          grep -q '10.3.0' manifest.webmanifest
          grep -q 'project-lab-logo-v10-192.png' manifest.webmanifest
          grep -q 'project-lab-logo-v10-512.png' manifest.webmanifest
          grep -q 'hardUpdate' v10-fix.js
          grep -q 'Installer l.application' v10-fix.js
          grep -q 'jlg360_update_applied' v10-fix.js
          grep -q 'Aucun compte, aucun serveur obligatoire' v10-standalone.js
          grep -q 'AES-GCM' v10-standalone.js
