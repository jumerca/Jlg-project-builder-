name: Project Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in v4-1.js v4-2.js v4-3.js v4-4.js v4-5.js v5-1.js v5-2.js v5-2-core.js v6.js v7.js v8-1.js v8-2.js v8-3.js v9-1.js v9-2.js v10-1.js v10-2.js v10-standalone.js v10-fix.js v10-4-install.js v10-9-interactions.js sw.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check V10.9 interactions PDF and Android bridge
        run: |
          set -e
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s project-lab-logo-v10.svg
          test -s android.css
          test -s v10-9.css
          test -s v10-9-interactions.js
          test -s v10-4-install.js
          test -s downloads/JLG-Project-Lab-360.apk
          test -s android-wrapper/app/src/main/AndroidManifest.xml
          test -s android-wrapper/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '10.9.0' v5-2.js
          grep -q '10.9.0' v10-fix.js
          grep -q '10.9.0' v10-4-install.js
          grep -q '10.9.0' manifest.webmanifest
          grep -q 'jlg-project-lab-360-v10-9' sw.js
          grep -q 'v10-9-interactions.js' v5-2.js
          grep -q 'v10-9-interactions.js' sw.js
          grep -q 'Choisir précisément le projet' v10-9-interactions.js
          grep -q 'Voir pourquoi, quoi faire et le document attendu' v10-9-interactions.js
          grep -q 'Télécharger le dossier PDF' v10-9-interactions.js
          grep -q 'application/pdf' v10-9-interactions.js
          grep -q 'saveBase64File' v10-9-interactions.js
          grep -q 'saveBase64File' android-wrapper/app/src/main/java/com/jlg/projectlab360/MainActivity.java
          grep -q 'addJavascriptInterface' android-wrapper/app/src/main/java/com/jlg/projectlab360/MainActivity.java
          grep -q 'onShowFileChooser' android-wrapper/app/src/main/java/com/jlg/projectlab360/MainActivity.java
          grep -q 'JLGProjectLabAndroid/10.9.0' android-wrapper/app/src/main/java/com/jlg/projectlab360/MainActivity.java
          grep -q 'versionName .10.9.0.' android-wrapper/app/build.gradle
          grep -q 'native-android' v5-2.js
          grep -q 'android.css' v5-2.js
          grep -q 'hero-brand' android.css
          grep -q 'overflow-x:hidden' android.css
          grep -q '@mipmap/ic_launcher' android-wrapper/app/src/main/AndroidManifest.xml
          ! grep -q 'package=com.android.chrome' v10-4-install.js
          ! grep -q 'MutationObserver' v10-fix.js
          ! grep -q 'MutationObserver' v10-4-install.js
          grep -q 'Aucun compte, aucun serveur obligatoire' v10-standalone.js
          grep -q 'AES-GCM' v10-standalone.js
