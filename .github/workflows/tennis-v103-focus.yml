name: Tennis V10.3 - Tests ciblés internationaux
on:
  push:
    branches: [qa/tennis-academy-manager]
    paths:
      - '.github/workflows/tennis-v103-focus.yml'
      - 'qa/tennis-academy-manager/tests/international-v103.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  international:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: qa/tennis-academy-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les tests
        run: npm install --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Scénarios V10.3 ciblés
        run: npx playwright test tests/international-v103.spec.mjs --project=desktop-chromium --retries=0 --timeout=20000 --global-timeout=210000
        env:
          TAM_URL: https://tennis-academy-jlg-fii19kuhv-jlg-creative.vercel.app
      - name: Captures de diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v103-focused-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            qa/tennis-academy-manager/playwright-report/
            qa/tennis-academy-manager/test-results/
