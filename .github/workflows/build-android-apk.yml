name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'
      - 'project-lab-logo-v10-512.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare launcher icon
        run: |
          mkdir -p android-wrapper/app/src/main/res/drawable
          cp project-lab-logo-v10-512.png android-wrapper/app/src/main/res/drawable/app_icon.png

      - name: Build debug APK
        run: gradle -p android-wrapper assembleDebug --stacktrace

      - name: Publish APK in Pages repository
        run: |
          mkdir -p downloads
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk downloads/JLG-Project-Lab-360.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/JLG-Project-Lab-360.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build Android APK [skip ci]'
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLG-Project-Lab-360-APK
          path: downloads/JLG-Project-Lab-360.apk
