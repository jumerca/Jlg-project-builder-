name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'
      - 'project-lab-logo-v10.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and SVG renderer
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin imagemagick

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare exact launcher icon from app SVG
        run: |
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          rsvg-convert project-lab-logo-v10.svg -w 300 -h 300 -o /tmp/project-lab-logo.png
          convert -size 432x432 xc:none /tmp/project-lab-logo.png -gravity center -composite android-wrapper/app/src/main/res/drawable-nodpi/app_icon_foreground.png

      - name: Build Android APK
        run: gradle -p android-wrapper assembleDebug --stacktrace

      - name: Publish APK in Pages repository
        run: |
          set -e
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk /tmp/JLG-Project-Lab-360.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p downloads
          cp /tmp/JLG-Project-Lab-360.apk downloads/JLG-Project-Lab-360.apk
          git add downloads/JLG-Project-Lab-360.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build JLG Project Lab Android V10.8'
            git push origin HEAD:main
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLG-Project-Lab-360-APK
          path: downloads/JLG-Project-Lab-360.apk
